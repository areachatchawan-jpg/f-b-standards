let FNB_SB = null;
let FNB_CLOUD_READY = false;
let FNB_CLOUD_TIMER = null;
let FNB_CLOUD_SYNCING = false;

let FNB_CLOUD_TOASTED = false;

function cloudConfigured() {
  return !!(window.supabase && FNB_CLOUD.url && FNB_CLOUD.key && !FNB_CLOUD.key.startsWith('PASTE_'));
}
function cloudConfigPayload() {
  return {
    hotels: DATA.hotels,
    shifts: DATA.shifts,
    checklists: DATA.checklists,
    outletChecklists: DATA.outletChecklists || {},
    settings: DATA.settings || { autoCompact: true, compactDays: 30 },
  };
}
function jsonStable(v) {
  try { return JSON.stringify(v); } catch (_) { return ''; }
}
async function initCloud() {
  if (!cloudConfigured()) {
    console.warn('F&B Cloud not configured: add the Supabase publishable/anon key to FNB_CLOUD.key');
    return;
  }
  try {
    FNB_SB = window.supabase.createClient(FNB_CLOUD.url, FNB_CLOUD.key, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
    });

    let { data: sessionData, error: sessionError } = await FNB_SB.auth.getSession();
    if (sessionError) console.warn('getSession:', sessionError.message);
    if (!sessionData?.session) {
      const anon = await FNB_SB.auth.signInAnonymously();
      if (anon.error) throw anon.error;
    }

    FNB_CLOUD_READY = true;
    await cloudLoadState();

    FNB_SB.channel('fnb-cloud-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: FNB_CLOUD.table }, payload => {
        try { applyCloudRealtime(payload); } catch (e) { console.warn('Realtime apply failed', e); }
      })
      .subscribe(status => {
        if (status === 'SUBSCRIBED') console.log('F&B Cloud realtime subscribed');
      });

    if (!FNB_CLOUD_TOASTED) {
      FNB_CLOUD_TOASTED = true;
      toast('☁️ Cloud พร้อมใช้งาน · Shared database online', 'success');
    }
  } catch (e) {
    console.error('F&B Cloud init failed:', e);
    toast(`☁️ Cloud ยังเชื่อมต่อไม่ได้ · ${e.message || e}`, 'warn');
  }
}

async function cloudLoadState() {
  if (!FNB_SB) return;
  const { data: rows, error } = await FNB_SB.from(FNB_CLOUD.table).select('bucket,item_id,payload,updated_at');
  if (error) throw error;
  const list = rows || [];
  const cfgRow = list.find(r => r.bucket === 'config' && r.item_id === 'state');
  const cloudIns = list.filter(r => r.bucket === 'inspections' && !r.payload?.testRun && !String(r.item_id||'').startsWith('LOADTEST_'));
  const cloudComp = list.filter(r => r.bucket === 'complaints');

  if (!cfgRow && cloudIns.length === 0 && cloudComp.length === 0) {
    // First device becomes the migration source. Existing local data is preserved.
    FNB_CLOUD_CACHE.config = cloudConfigPayload();
    FNB_CLOUD_CACHE.inspections = new Map((DATA.inspections || []).map(x => [x.id, JSON.parse(JSON.stringify(x))]));
    FNB_CLOUD_CACHE.complaints = new Map((DATA.complaints || []).map(x => [x.id, JSON.parse(JSON.stringify(x))]));
    await cloudSyncNow(true);
    return;
  }

  if (cfgRow?.payload) {
    const p = cfgRow.payload;
    if (Array.isArray(p.hotels)) DATA.hotels = p.hotels;
    if (Array.isArray(p.shifts)) DATA.shifts = p.shifts;
    if (p.checklists) DATA.checklists = p.checklists;
    if (p.outletChecklists) DATA.outletChecklists = p.outletChecklists;
    if (p.settings) DATA.settings = p.settings;
    FNB_CLOUD_CACHE.config = JSON.parse(JSON.stringify(p));
  }

  const cloudInsMap = new Map(cloudIns.map(r => [r.item_id, r.payload]));
  const cloudCompMap = new Map(cloudComp.map(r => [r.item_id, r.payload]));

  // Merge local-only legacy records into the cloud once, without deleting anything already online.
  for (const item of (DATA.inspections || [])) {
    if (!isLoadTestInspection(item) && !cloudInsMap.has(item.id)) cloudInsMap.set(item.id, item);
  }
  for (const item of (DATA.complaints || [])) {
    if (!cloudCompMap.has(item.id)) cloudCompMap.set(item.id, item);
  }

  DATA.inspections = Array.from(cloudInsMap.values());
  DATA.complaints = Array.from(cloudCompMap.values());
  FNB_CLOUD_CACHE.inspections = new Map(DATA.inspections.map(x => [x.id, JSON.parse(JSON.stringify(x))]));
  FNB_CLOUD_CACHE.complaints = new Map(DATA.complaints.map(x => [x.id, JSON.parse(JSON.stringify(x))]));

  // Push any local-only records merged above.
  await cloudSyncNow(true);
  saveDataLocalOnly();
  render();
}

function cloudRowPayload(bucket, item) {
  let payload = JSON.parse(JSON.stringify(item));
  // Photos should be Supabase Storage URLs; never push large inline data URLs to the database.
  if (payload.items) {
    for (const v of Object.values(payload.items)) {
      if (Array.isArray(v.photos)) v.photos = v.photos.filter(p => typeof p === 'string' && /^https?:\/\//i.test(p));
    }
  }
  if (payload.execReview?.items) {
    for (const v of Object.values(payload.execReview.items)) {
      if (typeof v.execPhoto === 'string' && !/^https?:\/\//i.test(v.execPhoto)) delete v.execPhoto;
    }
  }
  return payload;
}

async function cloudSyncNow(force = false) {
  if (!FNB_CLOUD_READY || !FNB_SB || FNB_CLOUD_SYNCING) return;
  FNB_CLOUD_SYNCING = true;
  try {
    const upserts = [];
    const cfg = cloudConfigPayload();
    if (force || jsonStable(cfg) !== jsonStable(FNB_CLOUD_CACHE.config)) {
      upserts.push({ bucket: 'config', item_id: 'state', payload: cfg, updated_at: new Date().toISOString() });
    }

    const currentIns = new Map((DATA.inspections || []).map(x => [x.id, x]));
    for (const [id, item] of currentIns) {
      const clean = cloudRowPayload('inspections', item);
      const prev = FNB_CLOUD_CACHE.inspections.get(id);
      if (force || jsonStable(clean) !== jsonStable(cloudRowPayload('inspections', prev || null))) {
        upserts.push({ bucket: 'inspections', item_id: id, payload: clean, updated_at: new Date().toISOString() });
      }
    }
    const deletesIns = [];
    for (const id of FNB_CLOUD_CACHE.inspections.keys()) if (!currentIns.has(id)) deletesIns.push(id);

    const currentComp = new Map((DATA.complaints || []).map(x => [x.id, x]));
    for (const [id, item] of currentComp) {
      const clean = JSON.parse(JSON.stringify(item));
      const prev = FNB_CLOUD_CACHE.complaints.get(id);
      if (force || jsonStable(clean) !== jsonStable(prev || null)) {
        upserts.push({ bucket: 'complaints', item_id: id, payload: clean, updated_at: new Date().toISOString() });
      }
    }
    const deletesComp = [];
    for (const id of FNB_CLOUD_CACHE.complaints.keys()) if (!currentComp.has(id)) deletesComp.push(id);

    for (let i = 0; i < upserts.length; i += 100) {
      const chunk = upserts.slice(i, i + 100);
      const { error } = await FNB_SB.from(FNB_CLOUD.table).upsert(chunk, { onConflict: 'bucket,item_id' });
      if (error) throw error;
    }
    if (deletesIns.length) {
      const { error } = await FNB_SB.from(FNB_CLOUD.table).delete().eq('bucket', 'inspections').in('item_id', deletesIns);
      if (error) throw error;
    }
    if (deletesComp.length) {
      const { error } = await FNB_SB.from(FNB_CLOUD.table).delete().eq('bucket', 'complaints').in('item_id', deletesComp);
      if (error) throw error;
    }

    FNB_CLOUD_CACHE.config = JSON.parse(JSON.stringify(cfg));
    FNB_CLOUD_CACHE.inspections = new Map(currentIns);
    FNB_CLOUD_CACHE.complaints = new Map(currentComp);
  } catch (e) {
    console.error('Cloud sync failed:', e);
    toast(`บันทึก Cloud ไม่สำเร็จ · ${e.message || e}`, 'warn');
  } finally {
    FNB_CLOUD_SYNCING = false;
  }
}

function scheduleCloudSync() {
  if (!FNB_CLOUD_READY) return;
  clearTimeout(FNB_CLOUD_TIMER);
  FNB_CLOUD_TIMER = setTimeout(() => cloudSyncNow(false), 600);
}

function applyCloudRealtime(payload) {
  const row = payload.eventType === 'DELETE' ? payload.old : payload.new;
  if (!row) return;
  if (row.bucket === 'config' && row.item_id === 'state') {
    if (payload.eventType === 'DELETE') return;
    const p = row.payload || {};
    if (Array.isArray(p.hotels)) DATA.hotels = p.hotels;
    if (Array.isArray(p.shifts)) DATA.shifts = p.shifts;
    if (p.checklists) DATA.checklists = p.checklists;
    if (p.outletChecklists) DATA.outletChecklists = p.outletChecklists;
    if (p.settings) DATA.settings = p.settings;
    FNB_CLOUD_CACHE.config = JSON.parse(JSON.stringify(p));
  } else if (row.bucket === 'inspections') {
    const id = row.item_id;
    if (payload.eventType === 'DELETE') {
      DATA.inspections = DATA.inspections.filter(x => x.id !== id);
      FNB_CLOUD_CACHE.inspections.delete(id);
    } else {
      const item = row.payload;
      const idx = DATA.inspections.findIndex(x => x.id === id);
      if (idx >= 0) DATA.inspections[idx] = item; else DATA.inspections.push(item);
      FNB_CLOUD_CACHE.inspections.set(id, JSON.parse(JSON.stringify(item)));
    }
  } else if (row.bucket === 'complaints') {
    const id = row.item_id;
    if (payload.eventType === 'DELETE') {
      DATA.complaints = DATA.complaints.filter(x => x.id !== id);
      FNB_CLOUD_CACHE.complaints.delete(id);
    } else {
      const item = row.payload;
      const idx = DATA.complaints.findIndex(x => x.id === id);
      if (idx >= 0) DATA.complaints[idx] = item; else DATA.complaints.push(item);
      FNB_CLOUD_CACHE.complaints.set(id, JSON.parse(JSON.stringify(item)));
    }
  }
  saveDataLocalOnly();
  // Do not interrupt an in-progress inspection UI; refresh all other screens immediately.
  if (!(VIEW_STATE.page === 'inspection' && VIEW_STATE.inspection?.status !== 'done')) render();
}

function saveDataLocalOnly() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); } catch (_) {}
}

function dataUrlToBlob(dataUrl) {
  const [meta, b64] = dataUrl.split(',');
  const mime = (meta.match(/data:([^;]+)/i) || [,'image/jpeg'])[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function uploadPhotoToCloud(dataUrl, inspectionId, itemId) {
  if (!FNB_CLOUD_READY || !FNB_SB) return dataUrl;
  const path = `inspections/${inspectionId}/${itemId}/${uid()}.jpg`;
  const blob = dataUrlToBlob(dataUrl);
  const { error } = await FNB_SB.storage.from(FNB_CLOUD.photoBucket).upload(path, blob, {
    contentType: 'image/jpeg', cacheControl: '3600', upsert: false
  });
  if (error) throw error;
  const { data } = FNB_SB.storage.from(FNB_CLOUD.photoBucket).getPublicUrl(path);
  return data.publicUrl;
}

function isLoadTestInspection(item) {
  const id = String(item?.id || item?.item_id || '');
  return item?.testRun === true || item?.inspectorId === 'load-test' || id.startsWith('LOADTEST_') || id.startsWith('loadtest-');
}

function loadData() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const p = JSON.parse(s);
      if (!p.users?.length) p.users = JSON.parse(JSON.stringify(DEFAULT_DATA.users));
      if (!p.hotels?.length) p.hotels = JSON.parse(JSON.stringify(DEFAULT_DATA.hotels));
      if (!p.checklists) p.checklists = JSON.parse(JSON.stringify(DEFAULT_CHECKLISTS));
      if (!p.checklists.main) p.checklists.main = JSON.parse(JSON.stringify(DEFAULT_CHECKLISTS.main));
      if (!p.shifts?.length) p.shifts = JSON.parse(JSON.stringify(DEFAULT_SHIFTS));
      if (!p.outletChecklists) p.outletChecklists = {};
      if (!p.inspections) p.inspections = [];
      if (!p.complaints) p.complaints = [];
      if (!p.settings) p.settings = { autoCompact: true, compactDays: 30 };
      // Never mix synthetic LOADTEST rows into operational F&B history.
      p.inspections = p.inspections.filter(i => !isLoadTestInspection(i));
      // Migrate old inspections: ensure they have tables array
      p.inspections.forEach(i => { if (!i.tables) i.tables = []; });
      return p;
    }
  } catch(e) { console.warn(e); }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
let _saveQuotaWarned = false;
function saveData() {
  try {
    // Auto-compact if enabled: strip photos from inspections older than settings.compactDays
    if (DATA.settings?.autoCompact !== false) {
      const days = DATA.settings?.compactDays || 30;
      const cutoff = Date.now() - days*86400000;
      DATA.inspections.forEach(i => {
        if ((i.completedAt || 0) < cutoff && !i._compacted && i.items) {
          Object.values(i.items).forEach(v => {
            if (v.photos?.length > 0) { v.photos = []; }
          });
          i._compacted = true;
          i._compactedAt = Date.now();
        }
      });
    }
    const json = JSON.stringify(DATA);
    localStorage.setItem(STORAGE_KEY, json);
    _saveQuotaWarned = false;
    scheduleCloudSync();
  } catch(e) {
    console.warn('saveData failed:', e);
    if (!_saveQuotaWarned) {
      _saveQuotaWarned = true;
      // Try more aggressive compaction as fallback
      try {
        const stripped = JSON.parse(JSON.stringify(DATA));
        stripped.inspections?.forEach(i => {
          if (i.items) Object.values(i.items).forEach(v => { v.photos = []; });
          i._compacted = true;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stripped));
        // Update actual DATA to match
        DATA.inspections.forEach(i => {
          if (i.items) Object.values(i.items).forEach(v => { v.photos = []; });
          i._compacted = true;
        });
        toast('⚠️ พื้นที่เก็บใกล้เต็ม — ลบรูปเก่าให้อัตโนมัติแล้ว · Storage full: photos compacted', 'warn');
      } catch(e2) {
        toast('❌ บันทึกไม่ได้ — ใช้ Admin > Data > Clear เก่าออก · Cannot save: clear old data', 'warn');
      }
    }
  }
}
function getStorageInfo() {
  try {
    const size = localStorage.getItem(STORAGE_KEY)?.length || 0;
    return { sizeMB: (size/1024/1024).toFixed(2), pct: Math.round(size/5242880*100) };

function toast(msg, kind='success') {
  const el = document.createElement('div');
  el.className = 'toast';
  const bg = { success:'linear-gradient(135deg,#6fbc85,#4a9660)', warn:'linear-gradient(135deg,#f0b862,#8b6820)', error:'linear-gradient(135deg,#e66b70,#b8383e)', info:'linear-gradient(135deg,#7aacd6,#4d80ad)' };
  el.style.background = bg[kind] || bg.success;
  const ic = { success:'✓', warn:'⚠', error:'✕', info:'ℹ' };
  el.innerHTML = `<span style="font-size:16px">${ic[kind]||ic.success}</span> ${msg}`;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function render() {
  try {
    const app = document.getElementById('app');
    if (!SESSION.user && VIEW_STATE.page !== 'login') VIEW_STATE.page = 'login';
    // Preserve scroll + focus across re-renders (kills "หน้าเด้ง" bug)
    const scrollY = window.scrollY;
    // Preserve horizontal scroll positions of all scrollable tab bars
    const hScrolls = [];
    document.querySelectorAll('.scroll-hide').forEach(el => {
      if (el.scrollLeft > 0 || el.scrollWidth > el.clientWidth) {
        // Track by key: page + first-child-text hash so we can match after re-render
        const key = (el.getAttribute('data-scroll-key')) ||
                    (VIEW_STATE.page + '|' + (el.firstElementChild?.textContent?.slice(0,40) || '') + '|' + el.children.length);
        hScrolls.push({ key, scrollLeft: el.scrollLeft });
      }
    });
    const focused = document.activeElement;
    const focusInfo = focused && focused !== document.body ? {
      itemId: focused.dataset?.itemId, field: focused.dataset?.field,
      cfield: focused.dataset?.cfield, tfield: focused.dataset?.tfield,
      tableId: focused.dataset?.tableId,
      id: focused.id,
      selStart: focused.selectionStart, selEnd: focused.selectionEnd,
    } : null;
    const views = { login: renderLogin, home: renderHome, outlets: renderOutlets, inspection: renderInspection, summary: renderSummary, history: renderHistory, kpi: renderKPI, testHistory: renderTestHistory, admin: renderAdmin, complaints: renderComplaints, complaintForm: renderComplaintForm, execReview: renderExecReview, dailySummary: renderDailySummary };
    app.innerHTML = (views[VIEW_STATE.page] || renderLogin)();
    if (VIEW_STATE.page === 'kpi') setTimeout(drawKPI, 50);
    // Restore scroll and focus
    if (_forceScrollTop) { window.scrollTo(0, 0); _forceScrollTop = false; }
    else window.scrollTo(0, scrollY);
    // Restore horizontal scroll positions on tab bars
    requestAnimationFrame(() => {
      document.querySelectorAll('.scroll-hide').forEach(el => {
        const key = (el.getAttribute('data-scroll-key')) ||
                    (VIEW_STATE.page + '|' + (el.firstElementChild?.textContent?.slice(0,40) || '') + '|' + el.children.length);
        const match = hScrolls.find(h => h.key === key);
        if (match) el.scrollLeft = match.scrollLeft;
        // Additionally, scroll active tab into view
        const active = el.querySelector('.tab-btn.active');
        if (active && !match) {
          try {
            const elRect = el.getBoundingClientRect();
            const actRect = active.getBoundingClientRect();
            if (actRect.left < elRect.left || actRect.right > elRect.right) {
              el.scrollLeft += (actRect.left - elRect.left) - (elRect.width - actRect.width) / 2;
            }
          } catch(_) {}
        }
      });
    });
    if (focusInfo) {
      let el = null;
      if (focusInfo.id) el = document.getElementById(focusInfo.id);
      else if (focusInfo.field && focusInfo.itemId) el = document.querySelector(`[data-field="${focusInfo.field}"][data-item-id="${focusInfo.itemId}"]`);
      else if (focusInfo.tfield && focusInfo.tableId) el = document.querySelector(`[data-tfield="${focusInfo.tfield}"][data-table-id="${focusInfo.tableId}"]`);
      else if (focusInfo.field) el = document.querySelector(`[data-field="${focusInfo.field}"]`);
      else if (focusInfo.cfield) el = document.querySelector(`[data-cfield="${focusInfo.cfield}"]`);
      if (el) {
        try { el.focus(); if (focusInfo.selStart != null && el.setSelectionRange) el.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); } catch(_) {}
      }
    }
    closeModal();
  } catch(e) {
    console.error(e);
    document.getElementById('app').innerHTML = `<div style="padding:40px;background:#faf5e8;color:#1a1611;min-height:100vh"><h2 style="color:#dc2626">เกิดข้อผิดพลาด</h2><pre style="background:#fee2e2;padding:16px;border-radius:12px;overflow:auto;font-size:12px">${(e.stack||e.message).replace(/</g,'&lt;')}</pre></div>`;
  }
}

// EVENT DELEGATION — max compatibility (click + touchend + pointerup)
function handleAction(e) {
  try {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    if (!a || a === 'noop') return;
    if (el._acted && Date.now() - el._acted < 400) return;
    el._acted = Date.now();
    if (e.type === 'click' && e.cancelable) e.preventDefault();
    if (typeof ACTIONS !== 'undefined' && ACTIONS[a]) ACTIONS[a](el.dataset, el, e);
    else if (typeof toast === 'function') toast('ไม่พบ action: '+a, 'error');
  } catch(err) {
    console.error('handleAction error:', err);
    if (typeof toast === 'function') toast('ผิดพลาด: '+err.message, 'error');
  }
}
document.addEventListener('click', handleAction, false);
document.addEventListener('touchend', function(e) {
  const el = e.target.closest('[data-action]');
  if (el && el.dataset.action && el.dataset.action !== 'noop') handleAction(e);
}, {passive: true});
document.addEventListener('pointerup', function(e) {
  if (e.pointerType === 'mouse') return;
  const el = e.target.closest('[data-action]');
  if (el && el.dataset.action && el.dataset.action !== 'noop') handleAction(e);
}, {passive: true});
document.addEventListener('submit', function(e) {
  if (e.target.id === 'login-form') { e.preventDefault(); doLogin(); }
});
document.addEventListener('change', function(e) {
  if (e.target.dataset.photoInput) attachPhoto(e, e.target.dataset.itemId);
  if (e.target.dataset.execPhoto) attachExecPhoto(e, e.target.dataset.itemId);
  if (e.target.dataset.importInput) importData(e);
  const df = e.target.dataset.dfield;
  if (df === 'date') { VIEW_STATE.dailyDate = e.target.value; render(); }
  if (df === 'outlet') { VIEW_STATE.dailyOutlet = e.target.value; render(); }
  // Settings toggles
  const setting = e.target.dataset.setting;
  if (setting) {
    if (!DATA.settings) DATA.settings = { autoCompact: true, compactDays: 30 };
    if (setting === 'autoCompact') {
      DATA.settings.autoCompact = e.target.checked;
      saveData();
      toast(e.target.checked ? '✓ เปิด Auto-compact แล้ว' : 'ปิด Auto-compact แล้ว');
    }
  }
});
document.addEventListener('input', function(e) {
  const t = e.target;
  const insp = VIEW_STATE.inspection;
  if (insp) {
    if (t.dataset.field === 'date') { insp.date = t.value; autoSave(); }
    if (t.dataset.field === 'time') { insp.time = t.value; autoSave(); }
    if (t.dataset.field === 'shift') { insp.shift = t.value; autoSave(); }
    if (t.dataset.field === 'shiftStart') { insp.shiftStart = t.value; autoSave(); }
    if (t.dataset.field === 'shiftEnd') { insp.shiftEnd = t.value; autoSave(); }
    if (t.dataset.field === 'general') { insp.generalNote = t.value; autoSave(); }
    if (t.dataset.field === 'responsibleName') { insp.responsibleName = t.value; autoSave(); }
    if (t.dataset.field === 'responsibleRole') { insp.responsibleRole = t.value; autoSave(); }
    if (t.dataset.field === 'item-note') { if (insp.items[t.dataset.itemId]) { insp.items[t.dataset.itemId].note = t.value; autoSave(); } }
    // Table fields
    const tf = t.dataset.tfield;
    if (tf && insp.tables) {
      const tbl = insp.tables.find(x => x.id === t.dataset.tableId);
      if (tbl) {
        if (tf === 'number') tbl.number = t.value;
        else if (tf === 'guests') tbl.guests = t.value;
        else if (tf === 'feedback') tbl.feedback = t.value;
        else if (tf === 'complaint') { tbl.complaint = t.checked; autoSave(); render(); return; }
        else if (tf === 'complaintCat') tbl.complaintCat = t.value;
        else if (tf === 'resolutionNote') tbl.resolutionNote = t.value;
        else if (tf === 'resolvedBy') tbl.resolvedBy = t.value;
        else if (tf === 'lessonLearned') tbl.lessonLearned = t.value;
        else if (tf === 'resolved') { tbl.resolved = t.checked; autoSave(); render(); return; }
        autoSave();
      }
    }
  }
  // Exec review note per item
  if (t.dataset.field === 'exec-note') {
    const ins2 = DATA.inspections.find(x => x.id === VIEW_STATE.historyId);
    if (ins2?.execReview?.items) {
      if (!ins2.execReview.items[t.dataset.itemId]) ins2.execReview.items[t.dataset.itemId] = {};
      ins2.execReview.items[t.dataset.itemId].execNote = t.value;
      saveData();
    }
  }
  if (t.dataset.field === 'exec-general-note') {
    const ins2 = DATA.inspections.find(x => x.id === VIEW_STATE.historyId);
    if (ins2?.execReview) { ins2.execReview.generalNote = t.value; saveData(); }
  }
  const cf = VIEW_STATE.complaintForm;
  if (cf) {
    if (t.dataset.cfield === 'category') { cf.category = t.value; cf.subCategory = ''; render(); }
    if (t.dataset.cfield === 'sub') { cf.subCategory = t.value; }
    if (t.dataset.cfield === 'description') cf.description = t.value;
    if (t.dataset.cfield === 'hotel') { cf.hotelId = t.value; cf.outletId = ''; render(); }
    if (t.dataset.cfield === 'outlet') cf.outletId = t.value;
    if (t.dataset.cfield === 'date') cf.date = t.value;
    if (t.dataset.cfield === 'time') cf.time = t.value;
  }
});

function autoSave() {
  const insp = VIEW_STATE.inspection;
  if (!insp) return;
  insp.updatedAt = Date.now();
  const idx = DATA.inspections.findIndex(x => x.id === insp.id);
  if (idx >= 0) DATA.inspections[idx] = insp; else DATA.inspections.push(insp);
  saveData();
}

    VIEW_STATE.complaintForm = { category: '', subCategory: '', description: '', severity: 3, hotelId: 'baiyoke', outletId: '', date: new Date().toISOString().slice(0,10), time: new Date().toTimeString().slice(0,5) };

  },

  saveComplaint: () => saveComplaint(),
  delComplaint: (d) => {
    const c = DATA.complaints.find(x => x.id === d.id);
    showConfirmModal('ลบคอมเพลนต์นี้?', c?.description?.slice(0,80) || '', () => {
      DATA.complaints = DATA.complaints.filter(c => c.id !== d.id);
      saveData(); render(); toast('ลบแล้ว');
    });
  },
  toggleResolve: (d) => {
    const c = DATA.complaints.find(x => x.id === d.id);

    } else {
      openResolveModal(c.id);
    }
  },

  noop: () => {},
};

  const u = (document.getElementById('login-user')?.value||'').trim().toLowerCase();

  const err = document.getElementById('login-err');
  if (!u || !p) { if (err) { err.textContent='กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'; err.style.display='block'; } return; }

  toast(`ยินดีต้อนรับ ${found.name} 👋`);
  nav('home');
}

      <div class="text-xs" style="color:#78716c">${o?.name} · ${o?.floor}</div>
    </div>
    <div class="space-y-3">
      ${Object.entries(INSPECTION_TYPES).map(([k,t]) => `
        <div data-action="startInspection" data-hotel-id="${hotelId}" data-outlet-id="${outletId}" data-type="${k}" class="card-hover rounded-2xl p-5 relative overflow-hidden" style="background:linear-gradient(135deg,#fb923c,#ea580c,#c2410c);color:white;cursor:pointer;box-shadow:0 12px 24px rgba(234,88,12,0.3)">
          <div class="flex items-center gap-4">
            <div class="text-4xl">${t.icon}</div>
            <div class="flex-1">
              <div class="text-lg font-bold">${t.label}</div>
              <div class="text-xs opacity-90">${t.desc}</div>
            </div>
            <div class="text-2xl">→</div>
          </div>
        </div>
      `).join('')}
    </div>
    <button data-action="closeModal" class="btn-secondary w-full mt-4">ยกเลิก · Cancel</button>
  </div>`);
}

// INSPECTION
function renderInspection() {
  const h = DATA.hotels.find(x => x.id === VIEW_STATE.hotelId);
  const o = h?.outlets.find(x => x.id === VIEW_STATE.outletId);
  if (!h || !o) return renderHome();
  const type = VIEW_STATE.inspectionType || 'main';
  const typeCfg = INSPECTION_TYPES[type] || INSPECTION_TYPES.main;
  const checklists = getChecklistForOutlet(o.id);
  const shifts = DATA.shifts || DEFAULT_SHIFTS;
  if (!VIEW_STATE.inspection) {
    // Determine current shift by time
    const nowH = new Date().getHours();
    const defaultShift = shifts.find(s => {
      const [sh,sm] = s.start.split(':').map(Number);
      const [eh,em] = s.end.split(':').map(Number);
      const cur = nowH*60 + new Date().getMinutes();
      return cur >= sh*60+sm && cur < eh*60+em;
    }) || shifts[0];
    VIEW_STATE.inspection = {
      id: uid(), type, hotelId: h.id, outletId: o.id,
      inspectorId: SESSION.user.id, inspectorName: SESSION.user.name, inspectorRole: SESSION.user.role,
      responsibleName: '', responsibleRole: 'Manager',
      date: new Date().toISOString().slice(0,10),
      time: new Date().toTimeString().slice(0,5),
      shiftId: defaultShift.id,
      shift: `${defaultShift.name} · ${defaultShift.nameTh}`,
      shiftStart: defaultShift.start, shiftEnd: defaultShift.end,
      generalNote: '', items: {}, tables: [], activeTab: checklists[0]?.id, status: 'draft', execReview: null,
    };
    checklists.forEach(cl => cl.items.forEach(it => {
      VIEW_STATE.inspection.items[it.id] = { status: null, note: '', photos: [] };
    }));
  }
  const insp = VIEW_STATE.inspection;
  // Ensure items array structure has photos array (migrate old ones)
  Object.values(insp.items).forEach(v => { if (!v.photos) v.photos = v.photo ? [v.photo] : []; if (v.photo !== undefined) delete v.photo; });
  if (!insp.tables) insp.tables = [];
  const activeCl = checklists.find(c => c.id === insp.activeTab) || checklists[0];
  const totals = calcInspectionProgress(insp);
  const isEditingSaved = insp.status === 'done';
  return `
  ${topbar()}
  <div class="max-w-4xl mx-auto px-4 pb-32 fade-in">
    <div class="flex items-center justify-between gap-2 mb-4 flex-wrap">
      <button data-action="cancelInspection" class="btn-secondary">← ${isEditingSaved?'กลับ · Back':'ยกเลิก · Cancel'}</button>
      ${isEditingSaved?`<span class="badge badge-gold">✏️ กำลังแก้ไข · Editing</span>`:''}
    </div>

    <div class="rounded-3xl p-5 mb-4 relative overflow-hidden" style="background:linear-gradient(135deg,#f4dfa8,#d4af6c 45%,#8b6820);box-shadow:0 14px 34px rgba(139,104,32,0.25)">
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0 flex-1">
          <div class="text-white/90 text-xs font-semibold" style="letter-spacing:0.1em;text-transform:uppercase">${typeCfg.icon} ${typeCfg.label}</div>
          <div class="text-white text-xl font-bold truncate display-font">${o.name}</div>
          <div class="text-white/85 text-xs">${h.name} · ${o.floor}</div>
        </div>
        <div class="text-right shrink-0">
          <div class="text-white/80 text-xs">คืบหน้า · Progress</div>
          <div class="text-white text-3xl font-bold" data-progress-count>${totals.answered}/${totals.total}</div>
          <div class="w-32 mt-2 progress-bar" style="background:rgba(255,255,255,0.25)">
            <div class="progress-fill" data-progress-fill style="width:${(totals.answered/totals.total)*100}%;background:linear-gradient(90deg,#fff,#faf5e8)"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Shift Selector -->
    <div class="card p-4 mb-4">
      <label class="text-xs mb-2 block font-semibold" style="color:#5c5138;letter-spacing:0.05em">☀️ รอบการตรวจ · Meal Shift</label>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
        ${shifts.map(s => `
          <button data-action="selectShift" data-shift-id="${s.id}" class="rounded-xl p-3 text-center transition" style="border:2px solid ${insp.shiftId===s.id?'#b8892f':'#ecdcb7'};background:${insp.shiftId===s.id?'linear-gradient(135deg,#faf5e8,#f2e6c8)':'#fff'};cursor:pointer">
            <div class="text-2xl mb-1">${s.icon}</div>
            <div class="text-xs font-semibold" style="color:${insp.shiftId===s.id?'#8b6820':'#1a1611'}">${s.name}</div>
            <div class="text-xs" style="color:#5c5138">${s.nameTh}</div>
            <div class="text-xs mt-1" style="color:#5c5138;font-weight:600">${s.start}-${s.end}</div>
          </button>
        `).join('')}
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" style="padding-top:12px;border-top:1px dashed #f2e6c8">
        <div><label class="text-xs mb-1 block font-semibold" style="color:#5c5138">📅 วันที่ · Date</label><input type="date" data-field="date" value="${insp.date}"></div>
        <div><label class="text-xs mb-1 block font-semibold" style="color:#5c5138">🕐 เวลา · Time</label><input type="time" data-field="time" value="${insp.time}"></div>
        <div><label class="text-xs mb-1 block font-semibold" style="color:#5c5138">⏰ เริ่ม · Start</label><input type="time" data-field="shiftStart" value="${insp.shiftStart||''}"></div>
        <div><label class="text-xs mb-1 block font-semibold" style="color:#5c5138">⏱️ ถึง · End</label><input type="time" data-field="shiftEnd" value="${insp.shiftEnd||''}"></div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-3" style="padding-top:12px;border-top:1px dashed #f2e6c8">
        <div><label class="text-xs mb-1 block font-semibold" style="color:#5c5138">👤 ผู้ตรวจ · Inspector</label><input value="${insp.inspectorName}" disabled></div>
        <div class="sm:col-span-1"><label class="text-xs mb-1 block" style="color:#8b6820;font-weight:600">⭐ ผู้รับผิดชอบ · Manager</label><input data-field="responsibleName" placeholder="ชื่อ-นามสกุล..." value="${(insp.responsibleName||'').replace(/"/g,'&quot;')}" style="background:#faf5e8"></div>
        <div><label class="text-xs mb-1 block" style="color:#8b6820;font-weight:600">ตำแหน่ง · Role</label>
          <select data-field="responsibleRole">${['Manager','Assistant Manager','Supervisor','Head Chef','Captain'].map(r=>`<option ${insp.responsibleRole===r?'selected':''}>${r}</option>`).join('')}</select>
        </div>
      </div>
    </div>

    ${checklists.length > 1 ? `
    <div class="card p-2 mb-4 flex overflow-x-auto scroll-hide gap-1" data-scroll-key="inspection-tabs">
      ${checklists.map(cl => {
        const t = calcTabProgress(insp, cl);
        const active = insp.activeTab === cl.id;
        return `<button data-action="switchTab" data-tab="${cl.id}" class="tab-btn ${active?'active':''} flex-1 min-w-max">
          <div class="text-xl mb-1">${cl.icon}</div><div class="text-xs">${cl.name}</div><div class="text-[10px] mt-1" data-tab-count="${cl.id}" style="opacity:0.7">${t.answered}/${t.total}</div>
        </button>`;
      }).join('')}
      <button data-action="switchTab" data-tab="_tables" class="tab-btn ${insp.activeTab==='_tables'?'active':''} flex-1 min-w-max">
        <div class="text-xl mb-1">🪑</div><div class="text-xs">โต๊ะลูกค้า</div><div class="text-[10px] mt-1" style="opacity:0.7">${insp.tables.length} โต๊ะ</div>
      </button>
    </div>` : ''}

    ${insp.activeTab === '_tables' ? renderTableFeedback(insp) : `
    <div class="space-y-3 mb-6">
      ${(activeCl?.items||[]).map((item,idx) => renderInspectionItem(item, insp, idx)).join('')}
    </div>`}

    <div class="card p-4 mb-6">
      <label class="text-sm font-semibold mb-2 block" style="color:#1a1611">📝 หมายเหตุรวม · General Notes</label>
      <textarea rows="3" data-field="general" placeholder="สรุปสิ่งที่พบระหว่างการตรวจ... · Summary of findings...">${insp.generalNote||''}</textarea>
    </div>

    <div class="bottom-bar">
      <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
        <div>
          <div class="text-xs" style="color:#5c5138;font-weight:600">คะแนน · Score</div>
          <div class="text-2xl font-bold" data-bottom-score style="color:${totals.score>=75?'#166534':totals.score>=60?'#8b6820':'#dc2626'}">${totals.score}%</div>
        </div>
        <div class="flex gap-2">
          <button data-action="saveDraft" class="btn-secondary">💾 ${isEditingSaved?'บันทึก':'บันทึกร่าง'}</button>
          <button data-action="finishInspection" class="btn-primary">✓ ${isEditingSaved?'อัปเดต · Update':'ตรวจเสร็จ · Finish'}</button>
        </div>
      </div>
    </div>
  </div>`;
}

// Render Table Feedback section
function renderTableFeedback(insp) {
  return `
  <div class="card p-4 mb-6">
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div>
        <div class="font-semibold" style="color:#1a1611">🪑 ความพึงพอใจตามโต๊ะ · Table Feedback</div>
        <div class="text-xs" style="color:#5c5138">สอบถามความพึงพอใจลูกค้าทีละโต๊ะ · Ask each table's feedback</div>
      </div>
      <button data-action="addTable" class="btn-primary">+ เพิ่มโต๊ะ · Add Table</button>
    </div>

    ${insp.tables.length === 0 ? `
      <div class="text-center py-8" style="color:#5c5138">
        <div class="text-4xl mb-2">🪑</div>
        <div class="text-sm">ยังไม่มีโต๊ะ · No tables yet</div>
        <div class="text-xs mt-1">กด "+ เพิ่มโต๊ะ" เพื่อบันทึกความพึงพอใจของลูกค้าแต่ละโต๊ะ</div>
      </div>
    ` : `
      <div class="grid grid-cols-4 gap-2 mb-4 pb-4" style="border-bottom:1px solid #f2e6c8">
        <div class="text-center"><div class="text-2xl font-bold" style="color:#1a1611">${insp.tables.length}</div><div class="text-xs" style="color:#5c5138">โต๊ะ · Tables</div></div>
        <div class="text-center"><div class="text-2xl font-bold" style="color:#8b6820">${insp.tables.reduce((s,t)=>s+(Number(t.guests)||0),0)}</div><div class="text-xs" style="color:#5c5138">ลูกค้า · Guests</div></div>
        <div class="text-center"><div class="text-2xl font-bold" style="color:#166534">${insp.tables.filter(t=>(t.rating||0)>=4).length}</div><div class="text-xs" style="color:#5c5138">พอใจ · Happy</div></div>
        <div class="text-center"><div class="text-2xl font-bold" style="color:#dc2626">${insp.tables.filter(t=>t.complaint).length}</div><div class="text-xs" style="color:#5c5138">คอมเพลนต์ · Issues</div></div>
      </div>
      <div class="space-y-3">
        ${insp.tables.map((t,i) => renderTableCard(t, i)).join('')}
      </div>
    `}
  </div>`;
}

function renderTableCard(t, idx) {
  const cats = COMPLAINT_CATS.filter(c => c.id !== 'other');
  return `
  <div class="rounded-2xl p-3" style="background:${t.complaint?'#fef2f2':'#faf5e8'};border:1.5px solid ${t.complaint?'#fca5a5':'#ecdcb7'}">
    <div class="flex items-center gap-2 mb-3">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center text-lg font-bold" style="background:${t.complaint?'#fee2e2':'#f2e6c8'};color:${t.complaint?'#a52d33':'#8b6820'}">${idx+1}</div>
      <input data-tfield="number" data-table-id="${t.id}" placeholder="เลข/ชื่อโต๊ะ · Table #" value="${(t.number||'').replace(/"/g,'&quot;')}" class="flex-1" style="padding:6px 10px;font-size:13px;background:white">
      <input type="number" data-tfield="guests" data-table-id="${t.id}" placeholder="ลูกค้า" value="${t.guests||''}" style="width:70px;padding:6px 10px;font-size:13px;background:white" min="1">
      <span class="text-xs" style="color:#5c5138">ท่าน</span>
      <button data-action="delTable" data-table-id="${t.id}" style="background:none;border:0;color:#dc2626;padding:6px;cursor:pointer;font-size:16px">✕</button>
    </div>
    <div class="grid grid-cols-5 gap-1 mb-2">
      ${[1,2,3,4,5].map(n => `<button data-action="setTableRating" data-table-id="${t.id}" data-rating="${n}" class="text-center py-2 rounded-lg text-sm" style="background:${(t.rating||0)>=n?'linear-gradient(135deg,#d4af6c,#8b6820)':'#fff'};color:${(t.rating||0)>=n?'white':'#8b6820'};border:1.5px solid ${(t.rating||0)>=n?'transparent':'#ecdcb7'};font-weight:600;cursor:pointer">${'⭐'.repeat(n>3?1:1)}${n}</button>`).join('')}
    </div>
    <textarea data-tfield="feedback" data-table-id="${t.id}" placeholder="ความเห็นลูกค้า · Guest feedback (เช่น: อาหารอร่อย บริการดี · หรือ อาหารไม่สด รอนาน)" rows="2" style="padding:8px 10px;font-size:13px;background:white;margin-bottom:8px">${(t.feedback||'').replace(/"/g,'&quot;')}</textarea>
    <div class="flex items-center gap-2 flex-wrap">
      <label class="flex items-center gap-1.5 text-xs cursor-pointer" style="color:${t.complaint?'#a52d33':'#5c5138'};font-weight:600">
        <input type="checkbox" data-tfield="complaint" data-table-id="${t.id}" ${t.complaint?'checked':''} style="width:auto;padding:0;margin:0">
        📢 มีคอมเพลนต์ · Complaint
      </label>
      ${t.complaint ? `
        <select data-tfield="complaintCat" data-table-id="${t.id}" style="flex:1;padding:4px 8px;font-size:12px;width:auto;min-width:120px">
          <option value="">-- เลือกหมวดปัญหา --</option>
          ${cats.map(c => `<option value="${c.id}" ${t.complaintCat===c.id?'selected':''}>${c.icon} ${c.name}</option>`).join('')}
        </select>
      ` : ''}
    </div>

    ${t.complaint ? `
      <!-- Inline resolution — บันทึกวิธีแก้ปัญหาที่นี่เลย -->
      <div class="mt-3 pt-3 rounded-xl p-3" style="background:${t.resolved?'#dcfce7':'#fef3c7'};border:1.5px dashed ${t.resolved?'#86efac':'#fde68a'}">
        <div class="flex items-center justify-between gap-2 mb-2">
          <div class="text-xs font-bold" style="color:${t.resolved?'#166534':'#92400e'}">
            ${t.resolved ? '✅ แก้ไขแล้ว · Resolved' : '🔧 บันทึกวิธีแก้ไข · Log Resolution'}
          </div>
          <label class="flex items-center gap-1 text-xs cursor-pointer" style="color:${t.resolved?'#166534':'#92400e'};font-weight:600">
            <input type="checkbox" data-tfield="resolved" data-table-id="${t.id}" ${t.resolved?'checked':''} style="width:auto;padding:0;margin:0">
            แก้ไขแล้ว
          </label>
        </div>
        <textarea data-tfield="resolutionNote" data-table-id="${t.id}" placeholder="🔧 วิธีแก้ไข · How was it fixed? (เช่น: เชิญไปที่โต๊ะ แจ้งครัวเปลี่ยนจานใหม่ให้ทันที)" rows="2" style="padding:6px 10px;font-size:12px;background:white;margin-bottom:6px">${(t.resolutionNote||'').replace(/"/g,'&quot;')}</textarea>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <div>
            <div class="text-xs mb-1" style="color:#5c5138;font-weight:600">😊 ลูกค้าพอใจหลังแก้</div>
            <div class="flex gap-0.5">
              ${[1,2,3,4,5].map(n => `<button data-action="setTableCustSat" data-table-id="${t.id}" data-sat="${n}" style="flex:1;padding:4px 0;border-radius:6px;background:${(t.customerSat||0)>=n?'linear-gradient(135deg,#fbbf24,#d97706)':'#fff'};color:${(t.customerSat||0)>=n?'white':'#8b6820'};border:1px solid ${(t.customerSat||0)>=n?'transparent':'#ecdcb7'};font-size:11px;cursor:pointer;font-weight:600">${n}⭐</button>`).join('')}
            </div>
          </div>
          <div>
            <div class="text-xs mb-1" style="color:#5c5138;font-weight:600">👤 คนแก้ปัญหา</div>
            <input data-tfield="resolvedBy" data-table-id="${t.id}" placeholder="ชื่อพนักงาน" value="${(t.resolvedBy||'').replace(/"/g,'&quot;')}" style="padding:5px 10px;font-size:12px;background:white">
          </div>
        </div>
        <textarea data-tfield="lessonLearned" data-table-id="${t.id}" placeholder="💡 บทเรียน · Lesson (ทีมได้เรียนรู้อะไร? เพื่อป้องกันซ้ำ)" rows="2" style="padding:6px 10px;font-size:12px;background:white">${(t.lessonLearned||'').replace(/"/g,'&quot;')}</textarea>
      </div>
    ` : ''}
  </div>`;
}

function renderInspectionItem(item, insp, idx) {
  const val = insp.items[item.id] || { status: null, note: '', photos: [] };
  if (!val.photos) val.photos = [];
  const s = val.status;
  const badgeBg = s==='pass'?'#dcfce7':s==='warn'?'#ffedd5':s==='fail'?'#fee2e2':'#f5f5f4';
  const badgeColor = s==='pass'?'#166534':s==='warn'?'#8b6820':s==='fail'?'#a52d33':'#5c5138';
  return `
  <div class="card p-4" data-item-anchor="${item.id}">
    <div class="flex items-start gap-3 mb-3">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0" data-num-badge="${item.id}" style="background:${badgeBg};color:${badgeColor};transition:background 0.2s,color 0.2s">${idx+1}</div>
      <div class="text-sm flex-1 pt-1" style="color:#1a1611;font-weight:500">${item.text}</div>
    </div>
    <div class="status-buttons mb-3">
      <button data-action="setStatus" data-item-id="${item.id}" data-status="pass" class="status-btn ${s==='pass'?'active-pass':''}"><span class="icon">✓</span> ผ่าน · Pass</button>
      <button data-action="setStatus" data-item-id="${item.id}" data-status="warn" class="status-btn ${s==='warn'?'active-warn':''}"><span class="icon">⚠</span> เตือน · Warn</button>
      <button data-action="setStatus" data-item-id="${item.id}" data-status="fail" class="status-btn ${s==='fail'?'active-fail':''}"><span class="icon">✕</span> ไม่ผ่าน · Fail</button>
    </div>
    <div class="flex gap-2 flex-wrap items-center" style="border-top:1px dashed #f2e6c8;padding-top:10px">
      <input type="text" data-field="item-note" data-item-id="${item.id}" placeholder="หมายเหตุ · Note (optional)..." value="${(val.note||'').replace(/"/g,'&quot;')}" class="flex-1" style="min-width:100px;padding:8px 12px;font-size:13px">
      <label class="btn-secondary cursor-pointer whitespace-nowrap flex items-center gap-1" style="padding:8px 12px;font-size:13px">
        🖼️ คลัง · Gallery
        <input type="file" accept="image/*" multiple data-photo-input data-item-id="${item.id}" style="display:none">
      </label>
      <label class="btn-secondary cursor-pointer whitespace-nowrap flex items-center gap-1" style="padding:8px 12px;font-size:13px">
        📷 กล้อง · Camera
        <input type="file" accept="image/*" capture="environment" data-photo-input data-item-id="${item.id}" style="display:none">
      </label>
    </div>
    <div data-photo-preview="${item.id}" style="${val.photos.length?'':'display:none;'}margin-top:10px">
      <div class="flex gap-2 flex-wrap">
        ${val.photos.map((p,i) => `<div class="relative inline-block"><img src="${p}" style="height:80px;border-radius:8px;border:1px solid #ecdcb7"><button data-action="removePhoto" data-item-id="${item.id}" data-photo-idx="${i}" style="position:absolute;top:-8px;right:-8px;width:24px;height:24px;background:#dc2626;color:white;border:0;border-radius:50%;cursor:pointer;font-size:11px">✕</button></div>`).join('')}
      </div>
      ${val.photos.length>0 ? `<div class="text-xs mt-1" style="color:#5c5138">${val.photos.length} รูป · photos</div>`:''}
    </div>
  </div>`;
}

// อัปเดต UI แบบ surgical (ไม่ต้อง render ใหม่)
function updateInspectionUI() {
  const insp = VIEW_STATE.inspection;
  if (!insp) return;
  const totals = calcInspectionProgress(insp);
  // Bottom bar score + progress
  const scoreEl = document.querySelector('[data-bottom-score]');
  if (scoreEl) {
    scoreEl.textContent = totals.score + '%';
    scoreEl.style.color = totals.score>=75?'#16a34a':totals.score>=60?'#c2410c':'#dc2626';
  }
  // Progress badge in hotel header (X/Y + progress bar width)
  const progText = document.querySelector('[data-progress-count]');
  if (progText) progText.textContent = `${totals.answered}/${totals.total}`;
  const progFill = document.querySelector('[data-progress-fill]');
  if (progFill) progFill.style.width = `${(totals.answered/totals.total)*100}%`;
  // Tab counters
  const cls = getInspectionChecklist(insp);
  cls.forEach(cl => {
    const t = calcTabProgress(insp, cl);
    const counter = document.querySelector(`[data-tab-count="${cl.id}"]`);
    if (counter) counter.textContent = `${t.answered}/${t.total}`;
  });
}

// เช็คว่าหมวดปัจจุบันตรวจครบไหม → สลับ tab อัตโนมัติ (แต่ไม่บังคับสลับทันที)
function checkTabComplete() {
  const insp = VIEW_STATE.inspection;
  if (!insp) return;
  const cls = getInspectionChecklist(insp);
  const currentCat = cls.find(c => c.id === insp.activeTab);
  if (!currentCat) return;
  const allDone = currentCat.items.every(it => insp.items[it.id]?.status);
  if (!allDone) return;
  // หมวดปัจจุบันครบแล้ว - หาหมวดถัดไปที่ยังมีข้อค้าง
  const currentTabIdx = cls.findIndex(c => c.id === insp.activeTab);
  let nextCat = null;
  for (let i = currentTabIdx + 1; i < cls.length; i++) {
    if (cls[i].items.some(it => !insp.items[it.id]?.status)) { nextCat = cls[i]; break; }
  }
  if (!nextCat) {
    for (let i = 0; i < currentTabIdx; i++) {
      if (cls[i].items.some(it => !insp.items[it.id]?.status)) { nextCat = cls[i]; break; }
    }
  }
  if (nextCat) {
    toast(`✓ ${currentCat.icon} ${currentCat.name} ครบแล้ว → กำลังไป ${nextCat.icon} ${nextCat.name}`, 'success');
    setTimeout(() => {
      insp.activeTab = nextCat.id;
      _forceScrollTop = true;
      render();
    }, 1200);
  } else {
    // ตรวจครบทุกหัวข้อ
    toast('🎉 ตรวจครบทุกข้อแล้ว! กดปุ่ม "ตรวจเสร็จ" ด้านล่าง', 'success');
    setTimeout(() => window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'}), 600);
  }
}

async function attachPhoto(ev, itemId) {
  const files = Array.from(ev.target.files || []);
  if (!files.length) return;
  const item = VIEW_STATE.inspection.items[itemId];
  if (!item.photos) item.photos = [];
  let done = 0;
  let failed = 0;
  for (const file of files) {
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        compressImage(file, resolve);
        setTimeout(() => reject(new Error('รูปใช้เวลานานเกินไป')), 30000);
      });
      const finalUrl = await uploadPhotoToCloud(dataUrl, VIEW_STATE.inspection.id, itemId);
      item.photos.push(finalUrl);
      done++;
    } catch (e) {
      failed++;
      console.error('Photo upload failed', e);
    }
  }
  autoSave();
  render();
  if (done) toast(`แนบรูปแล้ว ${done} รูป · ${failed ? `ล้มเหลว ${failed}` : 'Cloud synced'}`);
  else toast('แนบรูปไม่สำเร็จ', 'warn');
  ev.target.value = '';
}
async function attachExecPhoto(ev, itemId) {
  const file = ev.target.files[0]; if (!file) return;
  try {
    const dataUrl = await new Promise((resolve, reject) => {
      compressImage(file, resolve);
      setTimeout(() => reject(new Error('รูปใช้เวลานานเกินไป')), 30000);
    });
    const finalUrl = await uploadPhotoToCloud(dataUrl, VIEW_STATE.historyId, itemId);
    const insp = DATA.inspections.find(x => x.id === VIEW_STATE.historyId);
    if (!insp.execReview) insp.execReview = { items: {} };
    if (!insp.execReview.items) insp.execReview.items = {};
    if (!insp.execReview.items[itemId]) insp.execReview.items[itemId] = {};
    insp.execReview.items[itemId].execPhoto = finalUrl;
    saveData(); render(); toast('แนบหลักฐานแล้ว · Cloud synced');
  } catch (e) {
    console.error('Executive photo upload failed', e);
    toast(`แนบรูปไม่สำเร็จ · ${e.message || e}`, 'warn');
  } finally {
    ev.target.value = '';
  }
}
function compressImage(file, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const s = Math.min(1, 800 / Math.max(img.width, img.height));
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Get the checklist for an outlet — defensive against legacy/malformed cloud data.
function normalizeChecklistList(list) {
  if (!Array.isArray(list)) return [];
  return list.filter(Boolean).map((cl, idx) => ({
    ...cl, id: cl.id || `legacy_cl_${idx}`, name: cl.name || 'หมวดตรวจ', icon: cl.icon || '📋',
    items: Array.isArray(cl.items) ? cl.items.filter(Boolean).map((it, j) => ({
      ...it, id: it.id || `legacy_item_${idx}_${j}`, text: it.text || '-'
    })) : []
  }));
}
function getChecklistForOutlet(outletId) {
  const custom = outletId ? normalizeChecklistList(DATA.outletChecklists?.[outletId]) : [];
  if (custom.length) return custom;
  return normalizeChecklistList(DATA.checklists?.main);
}
function getInspectionChecklist(insp) {
  return getChecklistForOutlet(insp?.outletId);
}

function calcTabProgress(insp, cl) {
  return { total: cl.items.length, answered: cl.items.filter(it => insp.items[it.id]?.status).length };
}
function calcInspectionProgress(insp) {
  const cls = getInspectionChecklist(insp);
  let total=0, answered=0, points=0;
  cls.forEach(cl => cl.items.forEach(it => {
    total++;
    const s = insp.items[it.id]?.status;
    if (s) answered++;
    if (s === 'pass') points += 100;
    else if (s === 'warn') points += 50;
  }));
  return { total, answered, score: total ? Math.round(points/total) : 0 };
}
// EFFECTIVE SCORE — KPI ยึดจากคะแนนหลังตรวจซ้ำโดยฝ่ายบริหาร
// ถ้า exec ยังไม่ได้ตรวจซ้ำ → ใช้ manager's score
// ถ้า exec ตรวจแล้ว → หัวข้อไหน exec disagree จะกลายเป็น fail อัตโนมัติ (manager ไม่ใส่ใจ)
function calcEffectiveScore(insp) {
  if (!insp) return 0;
  const notReviewed = !insp.execReview?.status || insp.execReview.status === 'pending';
  if (notReviewed) return insp.score || 0;
  const cls = getInspectionChecklist(insp);
  let total = 0, points = 0;
  cls.forEach(cl => cl.items.forEach(it => {
    const mgr = insp.items[it.id]?.status;
    if (!mgr) return;
    total++;
    const er = insp.execReview?.items?.[it.id];
    const effective = er && er.agree === false ? 'fail' : mgr;
    if (effective === 'pass') points += 100;
    else if (effective === 'warn') points += 50;
  }));
  return total ? Math.round(points/total) : 0;
}
function isExecFailed(insp) {
  return insp?.execReview?.status === 'rejected';
}
function finishInspection() {
  const insp = VIEW_STATE.inspection;
  const p = calcInspectionProgress(insp);
  if (p.answered === 0) { toast('กรุณาตรวจอย่างน้อย 1 หัวข้อ', 'warn'); return; }
  if (p.answered < p.total) {
    toast(`บันทึกทั้งที่ตรวจไป ${p.answered}/${p.total} ข้อ`, 'warn');
  }
  const wasEditingDone = insp.status === 'done';
  insp.score = p.score;
  insp.status = 'done';
  if (!wasEditingDone) {
    insp.completedAt = Date.now();
    insp.execReview = { status: 'pending' };
  } else {
    insp.updatedAt = Date.now();
    // If we're editing a previously completed inspection, mark as re-edited
    insp.editedAt = Date.now();
    insp.editedBy = SESSION.user.name;
  }
  const idx = DATA.inspections.findIndex(x => x.id === insp.id);
  if (idx >= 0) DATA.inspections[idx] = insp; else DATA.inspections.push(insp);
  // Auto-create complaints from table feedback (only for new inspections, to prevent duplication)
  if (!wasEditingDone && insp.tables) {
    insp.tables.filter(t => t.complaint && t.feedback).forEach(t => {
      const cat = COMPLAINT_CATS.find(c => c.id === t.complaintCat) || COMPLAINT_CATS[4];
      DATA.complaints.push({
        id: uid(),
        category: cat.id,
        subCategory: cat.subs[0] || 'อื่นๆ',
        description: `[โต๊ะ ${t.number}, ${t.guests} ท่าน] ${t.feedback}`,
        severity: t.rating>=4?1:t.rating>=3?2:t.rating>=2?3:4,
        hotelId: insp.hotelId,
        outletId: insp.outletId,
        date: insp.date,
        time: insp.time,
        resolved: !!t.resolved,
        resolutionNote: t.resolutionNote || '',
        customerSat: t.customerSat || 0,
        resolvedBy: t.resolvedBy || (t.resolved ? SESSION.user.name : ''),
        lessonLearned: t.lessonLearned || '',
        createdAt: Date.now(),
        fromInspection: insp.id,
        tableNumber: t.number,
      });
    });
  }
  saveData();
  const done = insp.id;
  VIEW_STATE.inspection = null;
  toast(wasEditingDone ? `อัปเดตแล้ว · Updated ${insp.score}% ✏️` : `บันทึกเรียบร้อย! คะแนน ${insp.score}% 🎉`);
  nav('summary', { historyId: done });
}

function execVerify(id, status) {
  const insp = DATA.inspections.find(x => x.id === id);
  if (!insp) return;
  const note = status==='rejected' ? prompt('เหตุผลที่ไม่ผ่าน:') : '';
  if (status==='rejected' && !note) return;
  insp.execReview = { status, reviewerId: SESSION.user.id, reviewerName: SESSION.user.name, reviewedAt: Date.now(), note: note||'' };
  saveData(); render();
  toast(status==='verified'?'ยืนยันผ่านการตรวจซ้ำแล้ว':'ไม่ผ่านการตรวจซ้ำ', status==='verified'?'success':'warn');
}

function categoryScore(insp, cl) {
  const items = Array.isArray(cl?.items) ? cl.items.filter(Boolean) : [];
  const values = insp?.items || {};
  let p=0;
  items.forEach(it => { const st = values[it?.id]?.status; if (st==='pass') p+=100; else if (st==='warn') p+=50; });
  return { score: items.length ? Math.round(p/items.length) : 0 };
}
function countStatus(insp, target) {
  const cls = getChecklistForOutlet(insp.outletId);
  let n=0;
  cls.forEach(cl => cl.items.forEach(it => {
    const s = insp.items[it.id]?.status;
    if (target==='none' && !s) n++;
    else if (s===target) n++;
  }));
  return n;
}
function shareLine() {
  const insp = DATA.inspections.find(x => x.id === VIEW_STATE.historyId);
  const h = DATA.hotels.find(x => x.id === insp.hotelId);
  const o = h.outlets.find(x => x.id === insp.outletId);
  const cls = getChecklistForOutlet(insp.outletId);
  const effScore = calcEffectiveScore(insp);
  const rev = insp.execReview;
  const isRejected = isExecFailed(insp);
  const isVerified = rev?.status === 'verified';
  const showRev = canSeeExecReview();

  let text = `📊 F&B STANDARDS REPORT\n`;
  text += `🏨 ${h.name}\n`;
  text += `🍽️ ${o.name} · ${o.floor}\n`;
  text += `📅 ${formatThaiDate(insp.date)} · ${insp.time} · รอบ${insp.shift}\n`;
  text += `\n═══════════════════\n`;

  // สรุปสถานะพร้อมให้บริการ

    text += `❌ ไม่ผ่าน — ต้องแก้ไขด่วน\n`;
    text += `   ห้องอาหารยังไม่พร้อมให้บริการ\n`;
  } else if (effScore >= 90) {
    text += `✅ พร้อมให้บริการ ${effScore}%\n`;

    text += `   มีจุดต้องระวัง (ดูรายละเอียดด้านล่าง)\n`;
  } else if (effScore >= 60) {
    text += `⚠️ ${effScore}% — ยังไม่พร้อมเต็มที่\n`;
    text += `   ต้องแก้ไขก่อนเปิดบริการ\n`;
  } else {
    text += `❌ ${effScore}% — ไม่พร้อมให้บริการ\n`;
    text += `   ต้องแก้ไขทันที\n`;
  }
  text += `═══════════════════\n\n`;

  // รายละเอียดแต่ละหมวด
  text += `📋 ผลตรวจแยกหมวด\n`;
  text += `───────────────────\n`;
  cls.forEach(cl => {
    const cs = categoryScore(insp, cl);
    const passItems = cl.items.filter(it => insp.items[it.id]?.status === 'pass');
    const failItems = cl.items.filter(it => insp.items[it.id]?.status === 'fail');
    const warnItems = cl.items.filter(it => insp.items[it.id]?.status === 'warn');
    const noneItems = cl.items.filter(it => !insp.items[it.id]?.status);
    const statusIcon = cs.score === 100 ? '✅' : cs.score >= 75 ? '⚠️' : '❌';
    text += `\n${cl.icon} ${cl.name}: ${cs.score}% ${statusIcon}\n`;
    if (cs.score === 100 && noneItems.length === 0) {
      text += `   ✓ ผ่านครบ ${passItems.length}/${cl.items.length} ข้อ\n`;
    } else {
      text += `   ผ่าน ${passItems.length}·เตือน ${warnItems.length}·ไม่ผ่าน ${failItems.length}\n`;
      if (failItems.length > 0) {
        text += `   ❌ ไม่ผ่าน:\n`;
        failItems.forEach(it => {
          const note = insp.items[it.id]?.note;
          text += `      • ${it.text}${note?` (${note})`:''}\n`;
        });
      }
      if (warnItems.length > 0) {
        text += `   ⚠️ เตือน:\n`;
        warnItems.forEach(it => {
          const note = insp.items[it.id]?.note;
          text += `      • ${it.text}${note?` (${note})`:''}\n`;
        });
      }
    }
  });

  // คอมเพลนต์ห้องอาหารนี้ 7 วันย้อนหลัง
  const inspDate = new Date(insp.date);
  const weekAgo = new Date(inspDate.getTime() - 7*86400000);
  const outletComps = DATA.complaints.filter(c =>
    c.outletId === o.id && new Date(c.date) >= weekAgo && new Date(c.date) <= inspDate
  ).sort((a,b) => new Date(b.date) - new Date(a.date));

  if (outletComps.length > 0) {
    const openCount = outletComps.filter(c => !c.resolved).length;
    const closedCount = outletComps.filter(c => c.resolved).length;
    text += `\n═══════════════════\n`;
    text += `📢 คอมเพลนต์ 7 วันย้อนหลัง\n`;
    text += `   ทั้งหมด ${outletComps.length} เรื่อง (แก้แล้ว ${closedCount} · ค้าง ${openCount})\n`;
    text += `═══════════════════\n`;
    outletComps.forEach((c, i) => {
      const cat = COMPLAINT_CATS.find(x => x.id === c.category);
      text += `\n${i+1}. ${cat?.icon||'📌'} ${cat?.name||'-'} / ${c.subCategory}\n`;
      text += `   ระดับ: ${'★'.repeat(c.severity)}${'☆'.repeat(5-c.severity)} · ${c.date}\n`;
      text += `   ปัญหา: ${c.description}\n`;
      if (c.resolved) {
        text += `   ✅ แก้แล้ว: ${c.resolutionNote}\n`;
        text += `   ลูกค้าพอใจ: ${'★'.repeat(c.customerSat||0)}${'☆'.repeat(5-(c.customerSat||0))}${c.resolvedBy?` (โดย ${c.resolvedBy})`:''}\n`;
        if (c.lessonLearned) text += `   💡 บทเรียน: ${c.lessonLearned}\n`;
      } else {
        text += `   ⏳ ยังไม่แก้ — รอดำเนินการ\n`;
      }
    });
  } else {
    text += `\n═══════════════════\n`;
    text += `📢 คอมเพลนต์ 7 วันย้อนหลัง\n`;
    text += `═══════════════════\n`;
    text += `🎉 ไม่มีคอมเพลนต์ในช่วง 7 วันที่ผ่านมา\n`;
  }

  // Table Feedback
  if (insp.tables && insp.tables.length > 0) {
    text += `\n═══════════════════\n`;
    text += `🪑 ความพึงพอใจตามโต๊ะ\n`;
    text += `   ${insp.tables.length} โต๊ะ · ${insp.tables.reduce((s,t)=>s+(Number(t.guests)||0),0)} ลูกค้า\n`;
    text += `═══════════════════\n`;
    insp.tables.forEach(t => {
      const stars = '⭐'.repeat(Math.max(0, t.rating||0)) + '☆'.repeat(Math.max(0, 5-(t.rating||0)));
      const flag = t.complaint ? ' 📢 คอมเพลนต์' : '';
      text += `\nโต๊ะ ${t.number} · ${t.guests||0} ท่าน · ${stars}${flag}\n`;
      if (t.feedback) text += `   💬 ${t.feedback}\n`;
      if (t.complaint && t.complaintCat) {
        const cat = COMPLAINT_CATS.find(c => c.id === t.complaintCat);
        text += `   📢 หมวด: ${cat?.icon||''} ${cat?.name||'-'}\n`;
      }
    });
    const avgRating = insp.tables.filter(t=>t.rating>0).length ?
      (insp.tables.filter(t=>t.rating>0).reduce((s,t)=>s+t.rating,0)/insp.tables.filter(t=>t.rating>0).length).toFixed(1) : 0;
    text += `\n⭐ คะแนนเฉลี่ยจากลูกค้า: ${avgRating}/5\n`;
  }

  // Photo count
  const totalPhotos = Object.values(insp.items).reduce((s,v) => s+(v.photos?.length||0), 0);
  if (totalPhotos > 0) {
    text += `\n═══════════════════\n`;
    text += `📸 รูปภาพหลักฐาน · ${totalPhotos} รูป\n`;
    text += `═══════════════════\n`;
    text += `   ดูรูปทั้งหมดในระบบ (แนบใน LINE ทีละรูปได้จาก modal)\n`;
  }

  // หมายเหตุ
  if (insp.generalNote) {
    text += `\n═══════════════════\n`;
    text += `📝 หมายเหตุจากผู้ตรวจ\n`;
    text += `═══════════════════\n`;
    text += `${insp.generalNote}\n`;
  }

  // ลายเซ็น
  text += `\n═══════════════════\n`;
  text += `👤 ผู้ตรวจ: ${insp.inspectorName} (${insp.inspectorRole||'-'})\n`;
  if (insp.responsibleName) text += `⭐ ผู้รับผิดชอบ: ${insp.responsibleName} (${insp.responsibleRole||'-'})\n`;
  if (showRev && rev?.status && rev.status !== 'pending') {
    text += `\n🔍 ตรวจซ้ำโดยฝ่ายบริหาร\n`;
    text += `   ${rev.reviewerName} · Match ${rev.matchRate||0}%\n`;
    text += `   ${isVerified ? '✅ ผ่านการตรวจซ้ำ' : '❌ ไม่ผ่านการตรวจซ้ำ'}\n`;
    if (rev.note) text += `   📝 ${rev.note}\n`;
    if (insp.score !== effScore) text += `   (Manager รายงาน: ${insp.score}% → หลังตรวจซ้ำ: ${effScore}%)\n`;
  }
  text += `═══════════════════`;

  // Collect all photos for gallery
  const allPhotos = [];
  cls.forEach(cl => cl.items.forEach(it => {
    const v = insp.items[it.id];
    if (v?.photos?.length) {
      v.photos.forEach(p => allPhotos.push({ text: it.text, photo: p, category: cl.name, status: v.status }));
    }
  }));
  showLineModal(text, 'รายงานการตรวจ', allPhotos);
}

function formatThaiDate(dateStr) {
  try {
    const d = new Date(dateStr);
    const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
  } catch(e) { return dateStr; }
}

// Download all photos in current inspection as sequential downloads
function downloadAllPhotos() {
  const insp = DATA.inspections.find(x => x.id === VIEW_STATE.historyId);
  if (!insp) return;
  const cls = getChecklistForOutlet(insp.outletId);
  let count = 0;
  cls.forEach(cl => cl.items.forEach(it => {
    const v = insp.items[it.id];
    if (v?.photos?.length) {
      v.photos.forEach((p,i) => {
        count++;
        setTimeout(() => {
          const a = document.createElement('a');
          a.href = p;
          a.download = `fnb-${insp.date}-${it.id}-${i+1}.jpg`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }, count * 200);
      });
    }
  }));
  toast(`กำลังดาวน์โหลด ${count} รูป...`);
}

function copyLineText() {
  const ta = document.getElementById('line-text-area');
  if (!ta) return;
  ta.select();
  ta.setSelectionRange(0, 99999);
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(()=>toast('Copy เรียบร้อย! วางใน LINE ได้เลย')).catch(()=>{
        try { document.execCommand('copy'); toast('Copy เรียบร้อย! วางใน LINE ได้เลย'); }
        catch(e2) { toast('กรุณากด Ctrl+C หรือ ⌘+C เพื่อ copy', 'warn'); }
      });
      ok = true;
    } else {
      document.execCommand('copy');
      ok = true;
      toast('Copy เรียบร้อย! วางใน LINE ได้เลย');
    }
  } catch(e) {
    if (!ok) toast('กรุณากด Ctrl+C หรือ ⌘+C เพื่อ copy', 'warn');
  }
}

function openLineApp() {
  const ta = document.getElementById('line-text-area');
  if (!ta) return;
  const text = ta.value;
  // LINE share URL (short version works on mobile app)
  const url = `https://line.me/R/msg/text/?${encodeURIComponent(text)}`;
  window.open(url, '_blank');
  toast('เปิด LINE... ถ้าไม่เปิดกรุณา Copy ข้อความแทน', 'info');
}

      </div>
    ` : ''}
    <div class="card p-4 mb-4">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div><div class="text-xs font-semibold" style="color:#78716c">ทั้งหมด · Total</div><div class="text-xl font-bold" style="color:#1c1917">${items.length}</div></div>
        <div><div class="text-xs font-semibold" style="color:#78716c">คะแนนเฉลี่ย · Avg KPI</div><div class="text-xl font-bold" style="color:#16a34a">${items.length?Math.round(items.reduce((s,x)=>s+calcEffectiveScore(x),0)/items.length):0}%</div></div>
        <div><div class="text-xs font-semibold" style="color:#78716c">ผ่าน · Passed (≥75%)</div><div class="text-xl font-bold" style="color:#15803d">${items.filter(i=>calcEffectiveScore(i)>=75).length}</div></div>
        <div><div class="text-xs font-semibold" style="color:#78716c">ต้องปรับปรุง · Needs Fix</div><div class="text-xl font-bold" style="color:#dc2626">${items.filter(i=>calcEffectiveScore(i)<60||isExecFailed(i)).length}</div></div>
      </div>
    </div>
    <div class="space-y-2">
      ${items.length===0 ? '<div class="card p-8 text-center" style="color:#5c5138">ยังไม่มีข้อมูล</div>' :
        displayItems.map(i => {
          const h = DATA.hotels.find(x=>x.id===i.hotelId);
          const o = h?.outlets.find(x=>x.id===i.outletId);
          const t = INSPECTION_TYPES[i.type||'main'] || INSPECTION_TYPES.main;
          const rev = i.execReview;
          const revBadge = !canSeeRev ? '<span class="badge badge-mint">✓ เสร็จ · Done</span>' : (!rev || rev.status==='pending' ? '<span class="badge badge-amber">⏳ รอตรวจซ้ำ · Pending</span>' : rev.status==='verified' ? '<span class="badge badge-mint">✅ ผ่าน exec · Verified</span>' : '<span class="badge badge-red">❌ Exec Reject</span>');
          const effScore = calcEffectiveScore(i);
          const scoreColor = effScore>=75?'#16a34a':effScore>=60?'#c2410c':'#dc2626';
          return `
          <div class="card card-hover p-4">
            <div class="flex items-center justify-between gap-3 flex-wrap">
              <div data-action="nav" data-page="summary" data-history-id="${i.id}" class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer">
                <div class="w-12 h-12 rounded-xl flex items-center justify-center text-xl shrink-0" style="background:linear-gradient(135deg,#fb923c,#ea580c);color:white;box-shadow:0 4px 12px rgba(234,88,12,0.3)">${t.icon}</div>
                <div class="min-w-0 flex-1">
                  <div class="font-semibold truncate flex items-center gap-2" style="color:#1c1917">${o?.name||'-'} <span class="text-xs badge badge-neutral">${t.label}</span></div>
                  <div class="text-xs truncate" style="color:#78716c">${h?.name||'-'} · ${o?.floor||''} · ${i.date} ${i.time}</div>
                  <div class="text-xs truncate mt-1" style="color:#78716c">👤 ${i.inspectorName} ${revBadge}</div>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <div class="text-right">
                  <div class="text-2xl font-bold" style="color:${scoreColor}">${effScore}%</div>
                  ${canSeeRev && (i.score||0) !== effScore ? `<div class="text-[10px]" style="color:#78716c">M: ${i.score||0}%</div>`:''}
                </div>
                ${(isAdmin() || i.inspectorId === SESSION.user.id)?`<button data-action="editInspection" data-id="${i.id}" title="แก้ไข · Edit" style="color:#8b6820;background:#faf5e8;border:1px solid #ecdcb7;font-size:12px;cursor:pointer;padding:4px 10px;border-radius:6px;font-weight:600">✏️ แก้</button>`:''}
                ${isAdmin()?`<button data-action="delInsp" data-id="${i.id}" style="color:#dc2626;background:none;border:0;font-size:14px;cursor:pointer;padding:4px 8px">🗑️</button>`:''}
              </div>
            </div>
          </div>`;
        }).join('')}
    </div>
    ${hasMore ? `<div class="text-center mt-4"><button data-action="loadMoreHistory" class="btn-secondary" style="padding:12px 32px">โหลดเพิ่ม · Show more (${items.length - shown} left)</button></div>` : ''}
    ${items.length > 50 ? `<div class="text-xs text-center mt-3" style="color:#5c5138">แสดง ${Math.min(shown, items.length)} จาก ${items.length} รายการ</div>` : ''}
  </div>`;
}

function delInsp(id) {
  const i = DATA.inspections.find(x=>x.id===id);
  const h = DATA.hotels.find(x=>x.id===i?.hotelId);
  const o = h?.outlets.find(x=>x.id===i?.outletId);
  showConfirmModal('ลบการตรวจนี้?', `${o?.name||''} · ${i?.date||''} ${i?.time||''}`, () => {
    DATA.inspections = DATA.inspections.filter(i => i.id !== id);
    saveData(); render(); toast('ลบแล้ว');
  });
}

function saveResolution(id) {
  const rf = VIEW_STATE.resolveForm;
  const note = document.getElementById('res-note')?.value.trim() || '';
  const lesson = document.getElementById('res-lesson')?.value.trim() || '';
  if (!note) { toast('กรุณากรอกวิธีแก้ไข', 'warn'); return; }
  const c = DATA.complaints.find(x => x.id === id);
  if (!c) return;
  c.resolved = true;
  c.resolvedAt = Date.now();
  c.resolvedBy = SESSION.user.name;
  c.resolutionNote = note;
  c.customerSat = rf?.customerSat || 3;
  c.lessonLearned = lesson;
  saveData();
  VIEW_STATE.resolveForm = null;
  closeModal();
  render();
  toast('บันทึกการแก้ไขเรียบร้อย ✓');
}

function saveComplaint() {
  const cf = VIEW_STATE.complaintForm;
  if (!cf.category || !cf.subCategory || !cf.description || !cf.outletId) {
    toast('กรุณากรอกให้ครบ (หมวด + ปัญหาย่อย + รายละเอียด + ห้องอาหาร)', 'warn');
    return;
  }
  DATA.complaints.push({
    id: uid(), ...cf,
    resolved: false, reportedBy: SESSION.user.id, reporterName: SESSION.user.name,
    createdAt: Date.now(),
  });
  saveData();
  VIEW_STATE.complaintForm = null;
  toast('บันทึกคอมเพลนต์เรียบร้อย 📢');
  nav('complaints');
}

// EXEC REVIEW (ตรวจซ้ำแบบ checklist)
function renderExecReview() {
  const insp = DATA.inspections.find(x => x.id === VIEW_STATE.historyId);
  if (!insp) return renderHome();
  const h = DATA.hotels.find(x => x.id === insp.hotelId);
  const o = h.outlets.find(x => x.id === insp.outletId);
  const type = insp.type || 'main';
  const typeCfg = INSPECTION_TYPES[type] || INSPECTION_TYPES.main;
  const cls = getChecklistForOutlet(insp.outletId);
  if (!insp.execReview) insp.execReview = { status: 'pending', items: {} };
  if (!insp.execReview.items) insp.execReview.items = {};
  // Calc progress
  let checked = 0, total = 0, agreed = 0;
  cls.forEach(cl => cl.items.forEach(it => {
    if (insp.items[it.id]?.status) {
      total++;
      const er = insp.execReview.items[it.id];
      if (er && typeof er.agree === 'boolean') { checked++; if (er.agree) agreed++; }
    }
  }));
  const matchRate = checked ? Math.round(agreed / checked * 100) : 0;
  return `
  ${topbar()}
  <div class="max-w-4xl mx-auto px-4 pb-32 fade-in">
    <button data-action="nav" data-page="summary" data-history-id="${insp.id}" class="btn-secondary mb-4">← กลับดูสรุป</button>

    <div class="rounded-3xl p-5 mb-4" style="background:linear-gradient(135deg,#a78bda,#7a5eb0);box-shadow:0 12px 32px rgba(0,0,0,0.12)">
      <div class="flex items-center gap-3">
        <div class="text-4xl">🔍</div>
        <div class="text-white flex-1 min-w-0">
          <div class="text-xs opacity-90">Executive Re-verification</div>
          <div class="text-xl font-bold truncate">ตรวจซ้ำแบบ Checklist</div>
          <div class="text-sm opacity-90 truncate">${o.name} · ${h.name}</div>
        </div>
        <div class="text-right text-white">
          <div class="text-xs opacity-80">คืบหน้า</div>
          <div class="text-2xl font-bold">${checked}/${total}</div>
        </div>
      </div>
    </div>

    <div class="card p-4 mb-4">
      <div class="text-xs mb-2" style="color:#5c5138">ข้อมูลการตรวจเดิม:</div>
      <div class="text-sm" style="color:#1a1611">
        ${typeCfg.icon} ${typeCfg.label} · ${insp.date} ${insp.time}<br>
        👤 ผู้ตรวจ: <b>${insp.inspectorName}</b> (${insp.inspectorRole})<br>
        ${insp.responsibleName?`⭐ ผู้รับผิดชอบ: <b>${insp.responsibleName}</b> (${insp.responsibleRole})<br>`:''}

function finishExecReview() {
  const insp = DATA.inspections.find(x => x.id === VIEW_STATE.historyId);
  if (!insp) return;
  const cls = getChecklistForOutlet(insp.outletId);
  let checked=0, total=0, agreed=0;
  cls.forEach(cl => cl.items.forEach(it => {
    if (insp.items[it.id]?.status) {
      total++;
      const er = insp.execReview?.items?.[it.id];
      if (er && typeof er.agree === 'boolean') { checked++; if (er.agree) agreed++; }
    }
  }));
  if (checked === 0) { toast('กรุณาตรวจซ้ำอย่างน้อย 1 หัวข้อ', 'warn'); return; }
  const matchRate = checked ? Math.round(agreed/checked*100) : 0;
  const overallStatus = matchRate >= 80 ? 'verified' : 'rejected';
  insp.execReview = {
    ...insp.execReview,
    status: overallStatus,
    reviewerId: SESSION.user.id,
    reviewerName: SESSION.user.name,
    reviewedAt: Date.now(),
    matchRate, checked, total, agreed,
    note: insp.execReview?.generalNote || '',
  };
  saveData();
  toast(overallStatus==='verified'?`✓ ผ่านการตรวจซ้ำ (Match ${matchRate}%)`:`ไม่ผ่านการตรวจซ้ำ (Match ${matchRate}%)`, overallStatus==='verified'?'success':'warn');
  nav('summary', { historyId: insp.id });
}

// Daily KPI aggregator: returns array of {date, count, avgScore} for last N days
function getDailyKPI(insps, days) {
  const results = [];
  const now = new Date();
  now.setHours(0,0,0,0);
  for (let i = days-1; i >= 0; i--) {
    const d = new Date(now.getTime() - i*86400000);
    const ds = d.toISOString().slice(0,10);
    const dayInsps = insps.filter(x => x.date === ds);
    const avg = dayInsps.length ? Math.round(dayInsps.reduce((s,x)=>s+calcEffectiveScore(x),0)/dayInsps.length) : null;
    results.push({ date: ds, count: dayInsps.length, avgScore: avg });
  }
  return results;
}

// YEARLY ANALYTICS: aggregate by year and month
function getYearlyAnalytics(insps, comps) {
  const years = {};
  insps.forEach(i => {
    if (!i.date) return;
    const y = new Date(i.date).getFullYear();
    if (isNaN(y)) return;
    if (!years[y]) years[y] = {
      year: y, total: 0, sumScore: 0,
      months: Array(12).fill(null).map(() => ({total:0, sumScore:0, complaints:0, resolved:0})),
      complaints: 0, resolved: 0,
      byOutlet: {}, byHotel: {},
      execRejected: 0, execVerified: 0, execPending: 0,
    };
    const y0 = years[y];
    y0.total++;
    y0.sumScore += calcEffectiveScore(i);
    const m = new Date(i.date).getMonth();
    y0.months[m].total++;
    y0.months[m].sumScore += calcEffectiveScore(i);
    if (isExecFailed(i)) y0.execRejected++;
    else if (i.execReview?.status === 'verified') y0.execVerified++;
    else y0.execPending++;
    if (!y0.byOutlet[i.outletId]) y0.byOutlet[i.outletId] = { total: 0, sum: 0 };
    y0.byOutlet[i.outletId].total++;
    y0.byOutlet[i.outletId].sum += calcEffectiveScore(i);
    if (!y0.byHotel[i.hotelId]) y0.byHotel[i.hotelId] = { total: 0, sum: 0 };
    y0.byHotel[i.hotelId].total++;
    y0.byHotel[i.hotelId].sum += calcEffectiveScore(i);
  });
  comps.forEach(c => {
    if (!c.date) return;
    const y = new Date(c.date).getFullYear();
    if (isNaN(y) || !years[y]) return;
    const y0 = years[y];
    y0.complaints++;
    if (c.resolved) y0.resolved++;
    const m = new Date(c.date).getMonth();
    if (y0.months[m]) {
      y0.months[m].complaints++;
      if (c.resolved) y0.months[m].resolved++;
    }
  });
  // Finalize averages
  Object.values(years).forEach(y => {
    y.avgScore = y.total ? Math.round(y.sumScore / y.total) : 0;
    y.months.forEach(m => {
      m.avgScore = m.total ? Math.round(m.sumScore / m.total) : null;
      m.resolveRate = m.complaints ? Math.round(m.resolved/m.complaints*100) : 100;
    });
    y.resolveRate = y.complaints ? Math.round(y.resolved / y.complaints * 100) : 100;
    Object.values(y.byOutlet).forEach(o => o.avg = o.total ? Math.round(o.sum/o.total) : 0);
    Object.values(y.byHotel).forEach(h => h.avg = h.total ? Math.round(h.sum/h.total) : 0);
  });
  return years;
}
