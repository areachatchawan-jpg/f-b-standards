      const liveInsp = (VIEW_STATE.inspection && VIEW_STATE.inspection.id === inspId) ? VIEW_STATE.inspection : (DATA.inspections || []).find(x => x.id === inspId);

      if (!Array.isArray(item.photos)) item.photos = [];
      if (!Array.isArray(item.photoEvidence)) item.photoEvidence = [];
      item.photos.push(asset.url);
      item.photoEvidence.push({
        url: asset.url, path: asset.path, storageMode: asset.storageMode || 'public',

function compressImage(file, cb, onError) {
  const fail = e => { if (typeof onError === 'function') onError(e instanceof Error ? e : new Error(String(e || 'อ่านรูปไม่สำเร็จ'))); };
  // ใช้ createImageBitmap ก่อน เพราะหมุนรูปตาม EXIF ให้เอง
  // (บางรุ่นถ่ายแนวตั้งแล้วรูปออกมานอน ถ้าใช้ new Image() เฉย ๆ)
  const draw = src => {
    const c = document.createElement('canvas');
    const w = src.width, h = src.height;
    const s = Math.min(1, 800 / Math.max(w, h));
    c.width = Math.max(1, Math.round(w * s));
    c.height = Math.max(1, Math.round(h * s));
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    try { cb(c.toDataURL('image/jpeg', 0.75)); } catch (e) { fail(e); }
  };
  if (window.createImageBitmap) {
    createImageBitmap(file, { imageOrientation: 'from-image' })
      .then(draw)
      .catch(() => legacyRead());
  } else legacyRead();

  function legacyRead() {
    const reader = new FileReader();
    reader.onerror = () => fail(new Error('อ่านไฟล์ไม่ได้'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => fail(new Error('ไฟล์รูปนี้เปิดไม่ได้ (เช่นไฟล์ HEIC) — ลองถ่ายใหม่ด้วยปุ่มกล้อง'));
      img.onload = () => draw(img);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}

// Get the checklist for an outlet — defensive against legacy/malformed cloud data.
function normalizeChecklistList(list) {
  if (!Array.isArray(list)) return [];
  return list.filter(Boolean).map((cl, idx) => ({
    ...cl, id: cl.id || `legacy_cl_${idx}`, name: cl.name || 'หมวดตรวจ', icon: cl.icon || '📋',
    items: Array.isArray(cl.items) ? cl.items.filter(Boolean).map((it, j) => ({
      ...it, id: it.id || `legacy_item_${idx}_${j}`, text: it.text || '-'
    })) : []
  }));
}
function getChecklistForOutlet(outletId) {
  const custom = outletId ? normalizeChecklistList(DATA.outletChecklists?.[outletId]) : [];
  if (custom.length) return custom;
  return normalizeChecklistList(DATA.checklists?.main);
}
function getInspectionChecklist(insp) {
  return getChecklistForOutlet(insp?.outletId);
}

function calcTabProgress(insp, cl) {
  return { total: cl.items.length, answered: cl.items.filter(it => insp.items[it.id]?.status).length };
}
function calcInspectionProgress(insp) {
  const cls = getInspectionChecklist(insp);
  let total=0, answered=0, points=0;
  cls.forEach(cl => cl.items.forEach(it => {
    total++;
    const s = insp.items[it.id]?.status;
    if (s) answered++;
    if (s === 'pass') points += 100;
    else if (s === 'warn') points += 50;
  }));
  return { total, answered, score: total ? Math.round(points/total) : 0 };
}
// EFFECTIVE SCORE — KPI ยึดจากคะแนนหลังตรวจซ้ำโดยฝ่ายบริหาร
// ถ้า exec ยังไม่ได้ตรวจซ้ำ → ใช้ manager's score
// ถ้า exec ตรวจแล้ว → หัวข้อไหน exec disagree จะกลายเป็น fail อัตโนมัติ (manager ไม่ใส่ใจ)
function calcEffectiveScore(insp) {
  if (!insp) return 0;
  const notReviewed = !insp.execReview?.status || insp.execReview.status === 'pending';
  if (notReviewed) return insp.score || 0;
  const cls = getInspectionChecklist(insp);
  let total = 0, points = 0;
  cls.forEach(cl => cl.items.forEach(it => {
    const mgr = insp.items[it.id]?.status;
    if (!mgr) return;
    total++;
    const er = insp.execReview?.items?.[it.id];
    const effective = er && er.agree === false ? 'fail' : mgr;
    if (effective === 'pass') points += 100;
    else if (effective === 'warn') points += 50;
  }));
  return total ? Math.round(points/total) : 0;
}
function isExecFailed(insp) {
  return insp?.execReview?.status === 'rejected';
}
let FNB_FINISHING_INSPECTION = false;
async function finishInspection() {
  if (FNB_FINISHING_INSPECTION) return;
  FNB_FINISHING_INSPECTION = true;
  try {
    const insp = VIEW_STATE.inspection;
  const p = calcInspectionProgress(insp);
  if (p.answered === 0) { toast('กรุณาตรวจอย่างน้อย 1 หัวข้อ', 'warn'); return; }
  if (p.answered < p.total) {
    toast(`บันทึกทั้งที่ตรวจไป ${p.answered}/${p.total} ข้อ`, 'warn');
  }
    const wasEditingDone = insp.status === 'done';
    insp.score = p.score;
    insp.status = 'done';
    const finishNow = Date.now();
    insp.updatedAt = finishNow;
    if (!wasEditingDone) {
      insp.completedAt = finishNow;
    insp.execReview = { status: 'pending' };
    } else {
      insp.updatedAt = finishNow;
    // Editing a completed inspection changes the audit result, so it must return
    // to Pending for an executive re-check on every device.
    insp.editedAt = Date.now();
    insp.editedBy = SESSION.user.name;
    insp.execReview = {
      ...(insp.execReview || {}),
      status: 'pending',
      reopenedAt: Date.now(),
      reopenedBy: SESSION.user.id,
      reopenedByName: SESSION.user.name
    };
  }
  const idx = DATA.inspections.findIndex(x => x.id === insp.id);
  if (idx >= 0) DATA.inspections[idx] = insp; else DATA.inspections.push(insp);
  // Auto-create complaints from table feedback (only for new inspections, to prevent duplication)
  if (!wasEditingDone && insp.tables) {
    insp.tables.filter(t => t.complaint && t.feedback).forEach(t => {
      const cat = COMPLAINT_CATS.find(c => c.id === t.complaintCat) || COMPLAINT_CATS[4];
      DATA.complaints.push({
        id: uid(),
        category: cat.id,
        subCategory: cat.subs[0] || 'อื่นๆ',
        description: `[โต๊ะ ${t.number}, ${t.guests} ท่าน] ${t.feedback}`,
        severity: t.rating>=4?1:t.rating>=3?2:t.rating>=2?3:4,
        hotelId: insp.hotelId,
        outletId: insp.outletId,
        date: insp.date,
        time: insp.time,
        resolved: !!t.resolved,
        resolutionNote: t.resolutionNote || '',
        customerSat: t.customerSat || 0,
        resolvedBy: t.resolvedBy || (t.resolved ? SESSION.user.name : ''),
        lessonLearned: t.lessonLearned || '',
        createdAt: Date.now(),
        updatedAt: Date.now(),
        fromInspection: insp.id,
        tableNumber: t.number,
      });
    });
  }
    saveData();
    const done = insp.id;
    const synced = await commitCurrentStateToCloud(wasEditingDone ? 'editInspection' : 'finishInspection');
    if (!synced) {
      toast('⚠️ ข้อมูลถูกเก็บไว้ในเครื่อง แต่ยังยืนยันกับ Cloud ไม่สำเร็จ · กรุณาเชื่อมต่อ Cloud แล้วกดบันทึกอีกครั้ง', 'warn');
      render();
      return;
    }
    VIEW_STATE.inspection = null;
    toast(wasEditingDone ? `อัปเดตแล้ว · Updated ${insp.score}% ✏️` : `บันทึกเรียบร้อย! คะแนน ${insp.score}% 🎉`);
    nav('summary', { historyId: done });
  } finally {
    FNB_FINISHING_INSPECTION = false;
  }
}

    ${insp.generalNote ? `<div class="card p-4 mb-3 print-no-break"><div class="font-semibold mb-2" style="color:#1a1611">📝 หมายเหตุรวม · General Notes</div><div class="text-sm" style="color:#5c5138">${insp.generalNote}</div></div>` : ''}

    <div class="card p-4 mt-4 text-xs print-no-break" style="color:#5c5138;background:linear-gradient(135deg,#faf5e8,#f2e6c8);border-color:transparent">

      ${insp.responsibleName ? `<div class="mt-1">⭐ ผู้รับผิดชอบห้องอาหาร · Manager: <span style="color:#8b6820;font-weight:600">${insp.responsibleName}</span> (${insp.responsibleRole||'-'})</div>` : '<div class="mt-1" style="color:#a52d33">⭐ ไม่ได้ระบุผู้รับผิดชอบห้องอาหาร</div>'}

function categoryScore(insp, cl) {
  const items = Array.isArray(cl?.items) ? cl.items.filter(Boolean) : [];
  const values = insp?.items || {};
  let p=0;
  items.forEach(it => { const st = values[it?.id]?.status; if (st==='pass') p+=100; else if (st==='warn') p+=50; });
  return { score: items.length ? Math.round(p/items.length) : 0 };
}
function countStatus(insp, target) {
  const cls = getChecklistForOutlet(insp.outletId);
  let n=0;
  cls.forEach(cl => cl.items.forEach(it => {
    const s = insp.items[it.id]?.status;
    if (target==='none' && !s) n++;
    else if (s===target) n++;
  }));
  return n;
}
function shareLine() {
  const insp = DATA.inspections.find(x => x.id === VIEW_STATE.historyId);
  const h = DATA.hotels.find(x => x.id === insp.hotelId);
  const o = h.outlets.find(x => x.id === insp.outletId);
  const cls = getChecklistForOutlet(insp.outletId);
  const effScore = calcEffectiveScore(insp);
  const rev = insp.execReview;
  const isRejected = isExecFailed(insp);
  const isVerified = rev?.status === 'verified';
  const showRev = canSeeExecReview();

  let text = `📊 F&B STANDARDS REPORT\n`;
  text += `🏨 ${h.name}\n`;
  text += `🍽️ ${o.name} · ${o.floor}\n`;
  text += `📅 ${formatThaiDate(insp.date)} · ${insp.time} · รอบ${insp.shift}\n`;
  text += `\n═══════════════════\n`;

  // สรุปสถานะพร้อมให้บริการ
  if (isRejected) {
    text += `❌ ไม่ผ่าน — ต้องแก้ไขด่วน\n`;
    text += `   ห้องอาหารยังไม่พร้อมให้บริการ\n`;
  } else if (effScore >= 90) {
    text += `✅ พร้อมให้บริการ ${effScore}%\n`;
    text += `   ห้องอาหารพร้อมเปิดบริการ\n`;
  } else if (effScore >= 75) {
    text += `⚠️ พร้อมบริการ ${effScore}%\n`;
    text += `   มีจุดต้องระวัง (ดูรายละเอียดด้านล่าง)\n`;
  } else if (effScore >= 60) {
    text += `⚠️ ${effScore}% — ยังไม่พร้อมเต็มที่\n`;
    text += `   ต้องแก้ไขก่อนเปิดบริการ\n`;
  } else {
    text += `❌ ${effScore}% — ไม่พร้อมให้บริการ\n`;
    text += `   ต้องแก้ไขทันที\n`;
  }
  text += `═══════════════════\n\n`;

  // รายละเอียดแต่ละหมวด
  text += `📋 ผลตรวจแยกหมวด\n`;
  text += `───────────────────\n`;
  cls.forEach(cl => {
    const cs = categoryScore(insp, cl);
    const passItems = cl.items.filter(it => insp.items[it.id]?.status === 'pass');
    const failItems = cl.items.filter(it => insp.items[it.id]?.status === 'fail');
    const warnItems = cl.items.filter(it => insp.items[it.id]?.status === 'warn');
    const noneItems = cl.items.filter(it => !insp.items[it.id]?.status);
    const statusIcon = cs.score === 100 ? '✅' : cs.score >= 75 ? '⚠️' : '❌';
    text += `\n${cl.icon} ${cl.name}: ${cs.score}% ${statusIcon}\n`;
    if (cs.score === 100 && noneItems.length === 0) {
      text += `   ✓ ผ่านครบ ${passItems.length}/${cl.items.length} ข้อ\n`;
    } else {
      text += `   ผ่าน ${passItems.length}·เตือน ${warnItems.length}·ไม่ผ่าน ${failItems.length}\n`;
      if (failItems.length > 0) {
        text += `   ❌ ไม่ผ่าน:\n`;
        failItems.forEach(it => {
          const note = insp.items[it.id]?.note;
          text += `      • ${it.text}${note?` (${note})`:''}\n`;
        });
      }
      if (warnItems.length > 0) {
        text += `   ⚠️ เตือน:\n`;
        warnItems.forEach(it => {
          const note = insp.items[it.id]?.note;
          text += `      • ${it.text}${note?` (${note})`:''}\n`;
        });
      }
    }
  });

  // คอมเพลนต์ห้องอาหารนี้ 7 วันย้อนหลัง
  const inspDate = new Date(insp.date);
  const weekAgo = new Date(inspDate.getTime() - 7*86400000);
  const outletComps = DATA.complaints.filter(c =>
    c.outletId === o.id && new Date(c.date) >= weekAgo && new Date(c.date) <= inspDate
  ).sort((a,b) => new Date(b.date) - new Date(a.date));

  if (outletComps.length > 0) {
    const openCount = outletComps.filter(c => !c.resolved).length;
    const closedCount = outletComps.filter(c => c.resolved).length;
    text += `\n═══════════════════\n`;
    text += `📢 คอมเพลนต์ 7 วันย้อนหลัง\n`;
    text += `   ทั้งหมด ${outletComps.length} เรื่อง (แก้แล้ว ${closedCount} · ค้าง ${openCount})\n`;
    text += `═══════════════════\n`;
    outletComps.forEach((c, i) => {
      const cat = COMPLAINT_CATS.find(x => x.id === c.category);
      text += `\n${i+1}. ${cat?.icon||'📌'} ${cat?.name||'-'} / ${c.subCategory}\n`;
      text += `   ระดับ: ${'★'.repeat(c.severity)}${'☆'.repeat(5-c.severity)} · ${c.date}\n`;
      text += `   ปัญหา: ${c.description}\n`;
      if (c.resolved) {
        text += `   ✅ แก้แล้ว: ${c.resolutionNote}\n`;
        text += `   ลูกค้าพอใจ: ${'★'.repeat(c.customerSat||0)}${'☆'.repeat(5-(c.customerSat||0))}${c.resolvedBy?` (โดย ${c.resolvedBy})`:''}\n`;
        if (c.lessonLearned) text += `   💡 บทเรียน: ${c.lessonLearned}\n`;
      } else {
        text += `   ⏳ ยังไม่แก้ — รอดำเนินการ\n`;
      }
    });
  } else {
    text += `\n═══════════════════\n`;
    text += `📢 คอมเพลนต์ 7 วันย้อนหลัง\n`;
    text += `═══════════════════\n`;
    text += `🎉 ไม่มีคอมเพลนต์ในช่วง 7 วันที่ผ่านมา\n`;
  }

  // Table Feedback
  if (insp.tables && insp.tables.length > 0) {
    text += `\n═══════════════════\n`;
    text += `🪑 ความพึงพอใจตามโต๊ะ\n`;
    text += `   ${insp.tables.length} โต๊ะ · ${insp.tables.reduce((s,t)=>s+(Number(t.guests)||0),0)} ลูกค้า\n`;
    text += `═══════════════════\n`;
    insp.tables.forEach(t => {
      const stars = '⭐'.repeat(Math.max(0, t.rating||0)) + '☆'.repeat(Math.max(0, 5-(t.rating||0)));
      const flag = t.complaint ? ' 📢 คอมเพลนต์' : '';
      text += `\nโต๊ะ ${t.number} · ${t.guests||0} ท่าน · ${stars}${flag}\n`;
      if (t.feedback) text += `   💬 ${t.feedback}\n`;
      if (t.complaint && t.complaintCat) {
        const cat = COMPLAINT_CATS.find(c => c.id === t.complaintCat);
        text += `   📢 หมวด: ${cat?.icon||''} ${cat?.name||'-'}\n`;
      }
    });
    const avgRating = insp.tables.filter(t=>t.rating>0).length ?
      (insp.tables.filter(t=>t.rating>0).reduce((s,t)=>s+t.rating,0)/insp.tables.filter(t=>t.rating>0).length).toFixed(1) : 0;
    text += `\n⭐ คะแนนเฉลี่ยจากลูกค้า: ${avgRating}/5\n`;
  }

  // Photo count
  const totalPhotos = Object.values(insp.items).reduce((s,v) => s+(v.photos?.length||0), 0);
  if (totalPhotos > 0) {
    text += `\n═══════════════════\n`;
    text += `📸 รูปภาพหลักฐาน · ${totalPhotos} รูป\n`;
    text += `═══════════════════\n`;
    text += `   ดูรูปทั้งหมดในระบบ (แนบใน LINE ทีละรูปได้จาก modal)\n`;
  }

  // หมายเหตุ
  if (insp.generalNote) {
    text += `\n═══════════════════\n`;
    text += `📝 หมายเหตุจากผู้ตรวจ\n`;
    text += `═══════════════════\n`;
    text += `${insp.generalNote}\n`;
  }

  // ลายเซ็น
  text += `\n═══════════════════\n`;
  text += `👤 ผู้ตรวจ: ${insp.inspectorName} (${insp.inspectorRole||'-'})\n`;
  if (insp.responsibleName) text += `⭐ ผู้รับผิดชอบ: ${insp.responsibleName} (${insp.responsibleRole||'-'})\n`;
  if (showRev && rev?.status && rev.status !== 'pending') {
    text += `\n🔍 ตรวจซ้ำโดยฝ่ายบริหาร\n`;
    text += `   ${rev.reviewerName} · Match ${rev.matchRate||0}%\n`;
    text += `   ${isVerified ? '✅ ผ่านการตรวจซ้ำ' : '❌ ไม่ผ่านการตรวจซ้ำ'}\n`;
    if (rev.note) text += `   📝 ${rev.note}\n`;
    if (insp.score !== effScore) text += `   (Manager รายงาน: ${insp.score}% → หลังตรวจซ้ำ: ${effScore}%)\n`;
  }
  text += `═══════════════════`;

  // Collect all photos for gallery
  const allPhotos = [];
  cls.forEach(cl => cl.items.forEach(it => {
    const v = insp.items[it.id];
    if (v?.photos?.length) {
      v.photos.forEach(p => allPhotos.push({ text: it.text, photo: p, category: cl.name, status: v.status }));
    }
  }));
  showLineModal(text, 'รายงานการตรวจ', allPhotos);
}

function formatThaiDate(dateStr) {
  try {
    const d = new Date(dateStr);
    const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
  } catch(e) { return dateStr; }
}

// Download all photos in current inspection as sequential downloads
function downloadAllPhotos() {
  const insp = DATA.inspections.find(x => x.id === VIEW_STATE.historyId);
  if (!insp) return;
  const cls = getChecklistForOutlet(insp.outletId);
  let count = 0;
  cls.forEach(cl => cl.items.forEach(it => {
    const v = insp.items[it.id];
    if (v?.photos?.length) {
      v.photos.forEach((p,i) => {
        count++;
        setTimeout(() => {
          const a = document.createElement('a');
          a.href = p;
          a.download = `fnb-${insp.date}-${it.id}-${i+1}.jpg`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }, count * 200);
      });
    }
  }));
  toast(`กำลังดาวน์โหลด ${count} รูป...`);
}

function copyLineText() {
  const ta = document.getElementById('line-text-area');
  if (!ta) return;
  ta.select();
  ta.setSelectionRange(0, 99999);
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(()=>toast('Copy เรียบร้อย! วางใน LINE ได้เลย')).catch(()=>{
        try { document.execCommand('copy'); toast('Copy เรียบร้อย! วางใน LINE ได้เลย'); }
        catch(e2) { toast('กรุณากด Ctrl+C หรือ ⌘+C เพื่อ copy', 'warn'); }
      });
      ok = true;
    } else {
      document.execCommand('copy');
      ok = true;
      toast('Copy เรียบร้อย! วางใน LINE ได้เลย');
    }
  } catch(e) {
    if (!ok) toast('กรุณากด Ctrl+C หรือ ⌘+C เพื่อ copy', 'warn');
  }
}

function openLineApp() {
  const ta = document.getElementById('line-text-area');
  if (!ta) return;
  const text = ta.value;
  // LINE share URL (short version works on mobile app)
  const url = `https://line.me/R/msg/text/?${encodeURIComponent(text)}`;
  window.open(url, '_blank');
  toast('เปิด LINE... ถ้าไม่เปิดกรุณา Copy ข้อความแทน', 'info');
}

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">

function delInsp(id) {
  const i = DATA.inspections.find(x=>x.id===id);
  const h = DATA.hotels.find(x=>x.id===i?.hotelId);
  const o = h?.outlets.find(x=>x.id===i?.outletId);
  showConfirmModal('ลบการตรวจนี้?', `${o?.name||''} · ${i?.date||''} ${i?.time||''}`, () => {
    DATA.inspections = DATA.inspections.filter(i => i.id !== id);
    saveData(); render(); toast('ลบแล้ว');
  });
}

function saveResolution(id) {
  const rf = VIEW_STATE.resolveForm;
  const note = document.getElementById('res-note')?.value.trim() || '';
  const lesson = document.getElementById('res-lesson')?.value.trim() || '';
  if (!note) { toast('กรุณากรอกวิธีแก้ไข', 'warn'); return; }
  const c = DATA.complaints.find(x => x.id === id);
  if (!c) return;
  const now = Date.now();
  c.resolved = true;
  c.resolvedAt = now;
  c.updatedAt = now;
  c.resolvedBy = SESSION.user.name;
  c.resolutionNote = note;
  c.customerSat = rf?.customerSat || 3;
  c.lessonLearned = lesson;
  saveData();
  VIEW_STATE.resolveForm = null;
  closeModal();
  render();
  toast('บันทึกการแก้ไขเรียบร้อย ✓');
}

function saveComplaint() {
  const cf = VIEW_STATE.complaintForm;
  if (!cf.category || !cf.subCategory || !cf.description || !cf.outletId) {
    toast('กรุณากรอกให้ครบ (หมวด + ปัญหาย่อย + รายละเอียด + ห้องอาหาร)', 'warn');
    return;
  }
  const now = Date.now();
  DATA.complaints.push({
    id: uid(), ...cf,
    resolved: false, reportedBy: SESSION.user.id, reporterName: SESSION.user.name,
    createdAt: now,
    updatedAt: now,
  });
  saveData();
  VIEW_STATE.complaintForm = null;
  toast('บันทึกคอมเพลนต์เรียบร้อย 📢');
  nav('complaints');
}

let FNB_FINISHING_EXEC_REVIEW = false;
async function finishExecReview() {
  if (FNB_FINISHING_EXEC_REVIEW) return;
  FNB_FINISHING_EXEC_REVIEW = true;
  try {
    const insp = DATA.inspections.find(x => x.id === VIEW_STATE.historyId);
  if (!insp) return;
  const cls = getChecklistForOutlet(insp.outletId);
  let checked=0, total=0, agreed=0;
  cls.forEach(cl => cl.items.forEach(it => {
    if (insp.items[it.id]?.status) {
      total++;
      const er = insp.execReview?.items?.[it.id];
      if (er && typeof er.agree === 'boolean') { checked++; if (er.agree) agreed++; }
    }
  }));
  if (checked === 0) { toast('กรุณาตรวจซ้ำอย่างน้อย 1 หัวข้อ', 'warn'); return; }
  const missingEvidence = [];
  cls.forEach(cl => cl.items.forEach(it => {
    if (insp.items[it.id]?.status && insp.execReview?.items?.[it.id]?.agree === false) {
      const er = insp.execReview.items[it.id];
      if (!String(er.execNote || '').trim() && !getExecPhotos(er).length) missingEvidence.push(it.text);
    }
  }));
  if (missingEvidence.length) {
    toast(`ยังไม่ครบหลักฐาน “ไม่ตรง” ${missingEvidence.length} หัวข้อ · ต้องใส่เหตุผลหรือรูป`, 'warn');
    return;
  }
  const matchRate = checked ? Math.round(agreed/checked*100) : 0;
  const overallStatus = matchRate >= 80 ? 'verified' : 'rejected';
  insp.execReview = {
    ...insp.execReview,
    status: overallStatus,
    reviewerId: SESSION.user.id,
    reviewerName: SESSION.user.name,
    reviewedAt: Date.now(),
    matchRate, checked, total, agreed,
    note: insp.execReview?.generalNote || '',
  };
    saveData();
    const synced = await commitCurrentStateToCloud('finishExecReview');
    if (!synced) {
      toast('⚠️ ผลตรวจซ้ำถูกเก็บไว้ในเครื่อง แต่ยังยืนยันกับ Cloud ไม่สำเร็จ', 'warn');
      render();
      return;
    }
    toast(overallStatus==='verified'?`✓ ผ่านการตรวจซ้ำ (Match ${matchRate}%)`:`ไม่ผ่านการตรวจซ้ำ (Match ${matchRate}%)`, overallStatus==='verified'?'success':'warn');
    nav('summary', { historyId: insp.id });
  } finally {
    FNB_FINISHING_EXEC_REVIEW = false;
  }
}

function shareDailyLine() {
  const date = VIEW_STATE.dailyDate || new Date().toISOString().slice(0,10);
  const outletId = VIEW_STATE.dailyOutlet || DATA.hotels[0].outlets[0].id;
  const allOutlets = DATA.hotels.flatMap(h => h.outlets.map(o => ({...o, hotel: h})));
  const outletInfo = allOutlets.find(o => o.id === outletId);
  const hotel = outletInfo?.hotel;
  const insps = DATA.inspections.filter(i => i.date === date && i.outletId === outletId && i.status === 'done');
  const comps = DATA.complaints.filter(c => c.date === date && c.outletId === outletId);
  const avg = insps.length ? Math.round(insps.reduce((s,x)=>s+calcEffectiveScore(x),0)/insps.length) : 0;
  let text = `📊 สรุปรายวัน F&B Standards\n📅 ${date}\n🏨 ${hotel?.name}\n🍽️ ${outletInfo?.name} (${outletInfo?.floor})\n\n`;
  text += `━━━ 📋 การตรวจ (${insps.length} รายการ) ━━━\n`;
  if (insps.length === 0) text += 'ยังไม่มีการตรวจ\n';
  else {
    insps.forEach(i => {
      const t = INSPECTION_TYPES[i.type||'main'] || INSPECTION_TYPES.main;
      const rev = i.execReview;
      const showRev = canSeeExecReview();
      const revIcon = !showRev ? '' : (!rev || rev.status==='pending' ? ' ⏳' : rev.status==='verified' ? ' ✅' : ' ❌');
      const effSc = calcEffectiveScore(i);
      text += `${t.icon} ${t.label}: ${effSc}%${revIcon}\n`;
      text += `   👤 ${i.inspectorName}${i.responsibleName?` · ⭐ ${i.responsibleName}`:''}\n`;
      if (i.generalNote) text += `   📝 ${i.generalNote}\n`;
    });
    text += `\n⭐ คะแนนเฉลี่ย: ${avg}%\n`;
  }
  text += `\n━━━ 📢 คอมเพลนต์ (${comps.length} เรื่อง) ━━━\n`;
  if (comps.length === 0) text += '🎉 ไม่มีคอมเพลนต์\n';
  else {
    comps.forEach(c => {
      const cat = COMPLAINT_CATS.find(x => x.id === c.category);
      text += `${cat?.icon} ${cat?.name}/${c.subCategory} ${'★'.repeat(c.severity)}\n`;
      text += `   ${c.description}\n`;
      text += `   ${c.resolved?'✓ แก้แล้ว':'⏳ ค้าง'}\n`;
    });
    text += `\nสรุป: ${comps.filter(c=>c.resolved).length} แก้แล้ว / ${comps.filter(c=>!c.resolved).length} ค้าง\n`;
  }
  showLineModal(text, 'สรุปรายวัน — ส่งเข้า LINE');
}

// Daily KPI aggregator: returns array of {date, count, avgScore} for last N days
function getDailyKPI(insps, days) {
  const results = [];
  const now = new Date();
  now.setHours(0,0,0,0);
  for (let i = days-1; i >= 0; i--) {
    const d = new Date(now.getTime() - i*86400000);
    const ds = d.toISOString().slice(0,10);
    const dayInsps = insps.filter(x => x.date === ds);
    const avg = dayInsps.length ? Math.round(dayInsps.reduce((s,x)=>s+calcEffectiveScore(x),0)/dayInsps.length) : null;
    results.push({ date: ds, count: dayInsps.length, avgScore: avg });
  }
  return results;
}

// YEARLY ANALYTICS: aggregate by year and month
function getYearlyAnalytics(insps, comps) {
  const years = {};
  insps.forEach(i => {
    if (!i.date) return;
    const y = new Date(i.date).getFullYear();
    if (isNaN(y)) return;
    if (!years[y]) years[y] = {
      year: y, total: 0, sumScore: 0,
      months: Array(12).fill(null).map(() => ({total:0, sumScore:0, complaints:0, resolved:0})),
      complaints: 0, resolved: 0,
      byOutlet: {}, byHotel: {},
      execRejected: 0, execVerified: 0, execPending: 0,
    };
    const y0 = years[y];
    y0.total++;
    y0.sumScore += calcEffectiveScore(i);
    const m = new Date(i.date).getMonth();
    y0.months[m].total++;
    y0.months[m].sumScore += calcEffectiveScore(i);
    if (isExecFailed(i)) y0.execRejected++;
    else if (i.execReview?.status === 'verified') y0.execVerified++;
    else y0.execPending++;
    if (!y0.byOutlet[i.outletId]) y0.byOutlet[i.outletId] = { total: 0, sum: 0 };
    y0.byOutlet[i.outletId].total++;
    y0.byOutlet[i.outletId].sum += calcEffectiveScore(i);
    if (!y0.byHotel[i.hotelId]) y0.byHotel[i.hotelId] = { total: 0, sum: 0 };
    y0.byHotel[i.hotelId].total++;
    y0.byHotel[i.hotelId].sum += calcEffectiveScore(i);
  });
  comps.forEach(c => {
    if (!c.date) return;
    const y = new Date(c.date).getFullYear();
    if (isNaN(y) || !years[y]) return;
    const y0 = years[y];
    y0.complaints++;
    if (c.resolved) y0.resolved++;
    const m = new Date(c.date).getMonth();
    if (y0.months[m]) {
      y0.months[m].complaints++;
      if (c.resolved) y0.months[m].resolved++;
    }
  });
  // Finalize averages
  Object.values(years).forEach(y => {
    y.avgScore = y.total ? Math.round(y.sumScore / y.total) : 0;
    y.months.forEach(m => {
      m.avgScore = m.total ? Math.round(m.sumScore / m.total) : null;
      m.resolveRate = m.complaints ? Math.round(m.resolved/m.complaints*100) : 100;
    });
    y.resolveRate = y.complaints ? Math.round(y.resolved / y.complaints * 100) : 100;
    Object.values(y.byOutlet).forEach(o => o.avg = o.total ? Math.round(o.sum/o.total) : 0);
    Object.values(y.byHotel).forEach(h => h.avg = h.total ? Math.round(h.sum/h.total) : 0);
  });
  return years;
}

// Outlet rankings
function renderOutletRankings(hotelId) {
  const hotel = DATA.hotels.find(h => h.id === hotelId);
  if (!hotel) return '';
  const insps = DATA.inspections.filter(i => i.status === 'done');
  const stats = hotel.outlets.map(o => {
    const arr = insps.filter(i => i.outletId === o.id);
    const avg = arr.length ? Math.round(arr.reduce((s,x)=>s+calcEffectiveScore(x),0)/arr.length) : 0;
    const comps = DATA.complaints.filter(c => c.outletId === o.id).length;
    return { o, avg, count: arr.length, comps };
  }).sort((a,b) => b.avg - a.avg);
  const medals = ['🥇','🥈','🥉'];
  return `<div class="space-y-2">
    ${stats.map((s,i) => {
      const color = s.avg>=85?'#166534':s.avg>=70?'#8b6820':'#a52d33';
      const bg = s.avg>=85?'#dcfce7':s.avg>=70?'#faf5e8':'#fee2e2';
      return `<div class="flex items-center gap-3 p-3 rounded-xl" style="background:${bg}">
        <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-bold" style="background:white;color:${color};box-shadow:0 2px 6px rgba(0,0,0,0.08)">${medals[i]||i+1}</div>
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-sm truncate" style="color:#1a1611">${s.o.name}</div>
          <div class="text-xs" style="color:#5c5138">${s.o.floor} · ${s.count} inspections · 📢 ${s.comps} complaints</div>
        </div>
        <div class="text-right">
          <div class="text-2xl font-bold" style="color:${color}">${s.avg}%</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// Manager KPI (individual)
function renderManagerKPI() {
  const insps = DATA.inspections.filter(i => i.status === 'done' && i.responsibleName);
  if (insps.length === 0) return '<div class="text-sm text-center py-6" style="color:#5c5138">ยังไม่มีข้อมูล — ต้องระบุ "ผู้รับผิดชอบห้องอาหาร" ในแบบตรวจก่อน</div>';
  const stats = {};
  insps.forEach(i => {
    const key = i.responsibleName;
    if (!stats[key]) stats[key] = { name: key, role: i.responsibleRole, count: 0, sum: 0, sumMgr: 0, scores: [], catScores: {}, comps: 0, execMatch: 0, execReviewed: 0, execRejected: 0, outlets: new Set(), dates: new Set() };
    const effScore = calcEffectiveScore(i);
    stats[key].count++;
    stats[key].sum += effScore;
    stats[key].sumMgr += i.score;
    stats[key].scores.push(effScore);
    stats[key].outlets.add(i.outletId);
    stats[key].dates.add(i.date);
    if (isExecFailed(i)) stats[key].execRejected++;
    const cls = getChecklistForOutlet(i.outletId);
    cls.forEach(cl => {
      const cs = categoryScore(i, cl);
      if (!stats[key].catScores[cl.name]) stats[key].catScores[cl.name] = { sum: 0, n: 0, icon: cl.icon };
      stats[key].catScores[cl.name].sum += cs.score;
      stats[key].catScores[cl.name].n++;
    });
    // Exec match
    if (i.execReview?.status && i.execReview.status !== 'pending') {
      stats[key].execReviewed++;
      stats[key].execMatch += (i.execReview.matchRate || 0);
    }
    // Complaints at their outlets on their dates
    stats[key].comps = Array.from(stats[key].outlets).reduce((s, oid) => s + DATA.complaints.filter(c => c.outletId === oid && stats[key].dates.has(c.date)).length, 0);
  });
  const list = Object.values(stats).sort((a,b) => (b.sum/b.count) - (a.sum/a.count));
  return `<div class="grid md:grid-cols-2 gap-3">
    ${list.map(s => {
      const avg = Math.round(s.sum/s.count);
      const mgrAvg = Math.round(s.sumMgr/s.count);
      const matchAvg = s.execReviewed ? Math.round(s.execMatch/s.execReviewed) : 0;
      const grade = avg>=90?{t:'A',c:'#166534',b:'ดีเยี่ยม · Excellent'}:avg>=75?{t:'B',c:'#15803d',b:'ดี · Good'}:avg>=60?{t:'C',c:'#8b6820',b:'พอใช้ · Fair'}:{t:'D',c:'#a52d33',b:'ต้องปรับปรุง · Needs Improvement'};
      const cats = Object.entries(s.catScores).map(([n,d]) => ({n, score: Math.round(d.sum/d.n), icon: d.icon})).sort((a,b)=>b.score-a.score);
      const top = cats[0];
      const bottom = cats[cats.length-1];
      return `<div class="card p-4 print-no-break" style="background:linear-gradient(135deg,#fefdfa,#faf5e8);border-color:#ecdcb7">

// Inspector KPI (people who did the reports)
function renderInspectorKPI() {
  const insps = DATA.inspections.filter(i => i.status === 'done');
  const stats = {};
  insps.forEach(i => {
    const key = i.inspectorId;
    if (!stats[key]) stats[key] = { name: i.inspectorName, role: i.inspectorRole, count: 0, sum: 0, execAgree: 0, execTotal: 0 };
    stats[key].count++;
    stats[key].sum += calcEffectiveScore(i);
    if (i.execReview?.matchRate !== undefined) {
      stats[key].execAgree += i.execReview.matchRate;
      stats[key].execTotal++;
    }
  });
  const list = Object.values(stats).sort((a,b)=>b.count-a.count);
  if (list.length === 0) return '<div class="text-sm text-center py-4" style="color:#5c5138">ยังไม่มีข้อมูล · No data yet</div>';
  return `<div class="grid sm:grid-cols-2 gap-3">
    ${list.map(s => {
      const avg = Math.round(s.sum/s.count);
      const match = s.execTotal ? Math.round(s.execAgree/s.execTotal) : 0;
      const color = avg>=85?'#166534':avg>=70?'#8b6820':'#a52d33';
      return `<div class="card p-3" style="background:linear-gradient(135deg,#fefdfa,#faf5e8);border-color:#ecdcb7">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white" style="background:linear-gradient(135deg,#d4af6c,#8b6820)">${s.name.charAt(0)}</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold truncate" style="color:#1a1611">${s.name} <span class="badge badge-neutral">${s.role}</span></div>
            <div class="text-xs" style="color:#5c5138">${s.count} รายงาน · Match ${s.execTotal?match+'%':'-'}</div>
          </div>
          <div class="text-lg font-bold" style="color:${color}">${avg}%</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function getManagerPassExecFailCases() {
  const out = [];
  (DATA.inspections || []).filter(i => i.status === 'done').forEach(insp => {
    const hotel = (DATA.hotels || []).find(h => (h.outlets || []).some(o => o.id === insp.outletId));
    const outlet = hotel?.outlets?.find(o => o.id === insp.outletId);
    const cls = getChecklistForOutlet(insp.outletId);
    cls.forEach(cl => cl.items.forEach(it => {
      const mgr = insp.items?.[it.id];
      const er = insp.execReview?.items?.[it.id];
      if (mgr?.status === 'pass' && er?.agree === false) {
        out.push({
          insp, hotel, outlet, category: cl, item: it, mgr, er,
          managerPhotos: getManagerEvidence(mgr), execPhotos: getExecEvidence(er)
        });
      }
    }));
  });
  return out.sort((a,b) => ((b.er?.reviewedAt || b.insp.execReview?.reviewedAt || 0) - (a.er?.reviewedAt || a.insp.execReview?.reviewedAt || 0)));
}

function renderEvidenceImgs(list, borderColor='#ecdcb7', label='') {
  if (!list.length) return `<div class="text-[11px] py-3 px-3 rounded-lg" style="background:#f7f4ec;color:#8b6820">${label || 'ไม่มีภาพหลักฐาน'}</div>`;
  return `<div class="flex gap-2 flex-wrap">${list.map(x => `<a href="${x.url}" target="_blank" rel="noopener" title="เปิดภาพต้นฉบับ"><img src="${x.url}" style="width:110px;height:82px;object-fit:cover;border-radius:10px;border:1px solid ${borderColor};display:block"></a>`).join('')}</div>`;
}

function renderManagerPassExecFailAnalysis() {
  const cases = getManagerPassExecFailCases();
  const reviewedPass = [];
  const evidenceComplete = [];
  const outletStats = {};
  (DATA.inspections || []).filter(i => i.status === 'done').forEach(insp => {
    const outlet = DATA.hotels.flatMap(h => h.outlets.map(o=>({...o,hotel:h}))).find(o=>o.id===insp.outletId);
    getChecklistForOutlet(insp.outletId).forEach(cl => cl.items.forEach(it => {
      const mgr = insp.items?.[it.id];
      const er = insp.execReview?.items?.[it.id];
      if (mgr?.status === 'pass' && er && typeof er.agree === 'boolean') {
        reviewedPass.push(1);
        if (er.agree === false && (getManagerEvidence(mgr).length || getExecEvidence(er).length)) evidenceComplete.push(1);
        const key = insp.outletId;
        if (!outletStats[key]) outletStats[key] = { name: outlet?.name || insp.outletId, floor: outlet?.floor || '', hotel: outlet?.hotel?.name || '', reviewed:0, mismatch:0 };
        outletStats[key].reviewed++;
        if (er.agree === false) outletStats[key].mismatch++;
      }
    }));
  });
  const mismatchRate = reviewedPass.length ? Math.round(cases.length/reviewedPass.length*100) : 0;
  const evidenceRate = cases.length ? Math.round(evidenceComplete.length/cases.length*100) : 0;
  const outletList = Object.values(outletStats).filter(x=>x.mismatch>0).sort((a,b)=>b.mismatch-a.mismatch);

  ${outletList.length ? `<div class="mb-4"><div class="text-xs font-semibold mb-2" style="color:#a52d33">🏨 ห้องอาหารที่พบ Manager PASS → Executive ไม่ตรง</div>${outletList.slice(0,8).map(x=>`<div class="flex items-center gap-2 py-2" style="border-top:1px solid #f2e6c8"><div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold" style="background:#fee2e2;color:#a52d33">${x.mismatch}</div><div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate" style="color:#1a1611">${x.name}</div><div class="text-[10px]" style="color:#5c5138">${x.hotel} · ${x.floor} · ${x.reviewed} Manager PASS ที่ตรวจซ้ำ</div></div><div class="text-xs font-bold" style="color:#a52d33">${Math.round(x.mismatch/x.reviewed*100)}%</div></div>`).join('')}</div>` : ''}
  ${cases.length ? `<div class="space-y-3">${cases.slice(0,20).map((c,idx)=>`
    <div class="rounded-2xl p-4 print-no-break" style="background:linear-gradient(135deg,#fffafa,#faf5ff);border:1px solid #efdada">
      <div class="flex items-start justify-between gap-3 flex-wrap mb-3">

        <div class="flex gap-2"><span class="badge badge-mint">Manager ✓ ผ่าน</span><span class="badge badge-red">Exec ✕ ไม่ตรง</span></div>
      </div>
      <div class="grid lg:grid-cols-2 gap-3">
        <div class="rounded-xl p-3" style="background:#f7fbf8;border:1px solid #cfe9d7"><div class="text-xs font-semibold mb-2" style="color:#166534">📷 หลักฐานรอบ Manager · ${c.insp.inspectorName || '-'}${c.insp.responsibleName ? ` · Manager: ${c.insp.responsibleName}`:''}</div>${renderEvidenceImgs(c.managerPhotos,'#b8ddc2','ไม่มีภาพ Manager')}${c.mgr.note?`<div class="text-xs mt-2" style="color:#166534"><b>Note:</b> ${c.mgr.note}</div>`:''}<div class="text-[10px] mt-2" style="color:#5c5138">ตรวจเดิม: ${c.insp.date} ${c.insp.time}</div></div>
        <div class="rounded-xl p-3" style="background:#fbf7ff;border:1px solid #dccaf0"><div class="text-xs font-semibold mb-2" style="color:#6b47a3">🔍 หลักฐานตรวจซ้ำ Executive · ${c.er?.uploadedByName || c.insp.execReview?.reviewerName || '-'}</div>${renderEvidenceImgs(c.execPhotos,'#d0b8db','ไม่มีภาพ Executive')}${c.er.execNote?`<div class="text-xs mt-2" style="color:#6b47a3"><b>เหตุผล/Note:</b> ${c.er.execNote}</div>`:''}<div class="text-[10px] mt-2" style="color:#5c5138">ตรวจซ้ำ: ${c.insp.execReview?.reviewedAt ? new Date(c.insp.execReview.reviewedAt).toLocaleString('th-TH') : '-'}</div></div>

  ${cases.length>20 ? `<div class="text-[11px] mt-3" style="color:#8b6820">แสดง 20 เคสล่าสุดจากทั้งหมด ${cases.length} เคส · KPI นับทั้งหมด</div>` : ''}`;
}

function renderTopFail() {
  const counts = {};
  const itemText = {};
  (Array.isArray(DATA.inspections) ? DATA.inspections : []).filter(i=>i?.status==='done').forEach(i => {
    getChecklistForOutlet(i?.outletId).forEach(cl => {
      (Array.isArray(cl?.items) ? cl.items : []).forEach(it => {
        if (!it?.id) return;
        itemText[it.id] = it.text || it.id;
        if (i.items?.[it.id]?.status === 'fail') counts[it.id] = (counts[it.id]||0) + 1;
      });
    });
  });
  const list = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if (!list.length) return '<div class="text-sm text-center py-4" style="color:#5c5138">🎉 ยังไม่มีหัวข้อที่ตก · No failed items</div>';
  return list.map(([id,cnt]) => `<div class="flex items-center gap-2 py-2" style="border-top:1px solid #f2e6c8">
    <div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold" style="background:#fee2e2;color:#a52d33">${cnt}</div>
    <div class="text-sm flex-1" style="color:#1a1611">${itemText[id]||id}</div>
  </div>`).join('');
}

function renderInspectorRank() {
  const s = {};

    s[i.inspectorId].count++; s[i.inspectorId].sum += i.score;
  });
  const list = Object.values(s).sort((a,b)=>b.count-a.count).slice(0,5);

function drawKPI() {
  const insps = DATA.inspections.filter(i=>i.status==='done');

    responsive: true,
    plugins: { legend: { labels: { color: '#1a1611' } } },
    scales: { x: { ticks: { color: '#5c5138' }, grid: { color: '#f2e6c8' } }, y: { ticks: { color: '#5c5138' }, grid: { color: '#f2e6c8' }, beginAtZero: true, max: 100 } }
  });

  const elCat = document.getElementById('kpi-cat');
  if (elCat) {
    const mainCls = DATA.checklists.main || [];
    new Chart(elCat, {
      type: 'radar',
      data: {
        labels: mainCls.map(c=>c.name),
        datasets: [{
          label: 'คะแนนเฉลี่ย · Avg Score',
          data: mainCls.map(cl => {
            const relevant = insps.filter(i => (DATA.checklists[i.type||'main']||DATA.checklists.main||[]).some(c => c.id === cl.id));
            if (!relevant.length) return 0;
            return Math.round(relevant.reduce((s,i)=>s+categoryScore(i,cl).score,0)/relevant.length);
          }),
          backgroundColor: 'rgba(184,137,47,0.2)', borderColor: '#b8892f', borderWidth: 2, pointBackgroundColor: '#b8892f',
        }]
      },
      options: { plugins: { legend: { labels: { color: '#1a1611' } } },
        scales: { r: { angleLines: { color: '#f2e6c8' }, grid: { color: '#f2e6c8' }, pointLabels: { color: '#1a1611', font: {size: 10} }, ticks: { color: '#5c5138', backdropColor: 'transparent' }, min: 0, max: 100 } } }
    });
  }

  const el2 = document.getElementById('kpi-trend');
  if (el2) {
    const days = [];
    for (let i=13; i>=0; i--) days.push(new Date(Date.now() - i*86400000).toISOString().slice(0,10));
    new Chart(el2, {
      type: 'line',
      data: { labels: days.map(d=>d.slice(5)), datasets: [
        { label: 'Baiyoke', data: days.map(d => { const a = insps.filter(i => i.hotelId==='baiyoke' && i.date === d); return a.length ? Math.round(a.reduce((s,x)=>s+calcEffectiveScore(x),0)/a.length) : null; }), borderColor: '#b8892f', backgroundColor: 'rgba(184,137,47,0.15)', tension: 0.35, fill: true, spanGaps: true, pointRadius: 4 },
        { label: 'Queensland', data: days.map(d => { const a = insps.filter(i => i.hotelId==='queensland' && i.date === d); return a.length ? Math.round(a.reduce((s,x)=>s+calcEffectiveScore(x),0)/a.length) : null; }), borderColor: '#3a3428', backgroundColor: 'rgba(58,52,40,0.10)', tension: 0.35, fill: true, spanGaps: true, pointRadius: 4 },
      ]}, options: opts()
    });
  }

  const el4 = document.getElementById('kpi-complaint');
  if (el4) {
    new Chart(el4, {
      type: 'doughnut',
      data: {
        labels: COMPLAINT_CATS.map(c => c.name),
        datasets: [{
          data: COMPLAINT_CATS.map(c => DATA.complaints.filter(x => x.category === c.id).length),
          backgroundColor: ['#ea580c','#0284c7','#7c3aed','#d97706','#5c5138'],
        }]
      },
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#1a1611', font: {size:11} } } } }
    });
  }

  const el5 = document.getElementById('kpi-complaint-outlet');
  if (el5) {
    const allOutlets = DATA.hotels.flatMap(h => h.outlets.map(o => ({...o, hotel: h})));
    const data = allOutlets.map(o => DATA.complaints.filter(c => c.outletId === o.id).length);
    const top = allOutlets.map((o,i) => ({o, cnt: data[i]})).sort((a,b) => b.cnt - a.cnt).slice(0,8);
    new Chart(el5, {
      type: 'bar',
      data: {
        labels: top.map(x => x.o.name.substring(0,20)),
        datasets: [{ data: top.map(x => x.cnt), backgroundColor: '#b8892f', borderRadius: 8 }]
      },
      options: { ...opts(), scales: { ...opts().scales, y: { ...opts().scales.y, max: undefined } }, plugins: { legend: { display: false } } }
    });
  }
}

const ROLE_OPTIONS = [
  { value: 'admin', label: '👑 Admin · ผู้ดูแลระบบ' },

];
function addUser() {
  showFormModal({
    title: '+ เพิ่มผู้ใช้ใหม่',
    subtitle: 'Add New User',
    fields: [
      { name: 'name', label: 'ชื่อ-นามสกุล · Full Name', placeholder: 'สมชาย ใจดี' },
      { name: 'username', label: 'Username', placeholder: 'somchai' },
      { name: 'password', label: 'รหัสผ่าน · Password', value: '1234' },
      { name: 'role', label: 'บทบาท · Role', type: 'select', value: 'inspector', options: ROLE_OPTIONS },
    ],
    submitLabel: '+ เพิ่มผู้ใช้',
    onSubmit: async (v) => {
      if (!v.name || !v.username) { toast('กรุณาใส่ชื่อและ username', 'warn'); return; }
      const h = await hashPassword(v.password || '1234');
      const rec = { id: uid(), username: v.username, name: v.name, role: v.role };
      if (h) rec.passwordHash = h; else rec.password = v.password || '1234';
      DATA.users.push(rec);
      saveData(); closeModal(); render(); toast('เพิ่มผู้ใช้แล้ว ✓');
    }
  });
}
function editUser(id) {
  const u = DATA.users.find(x=>x.id===id); if(!u) return;
  showFormModal({
    title: 'แก้ไขผู้ใช้',
    subtitle: 'Edit User',
    fields: [
      { name: 'name', label: 'ชื่อ-นามสกุล · Full Name', value: u.name },
      { name: 'username', label: 'Username', value: u.username },
      { name: 'password', label: 'รหัสผ่านใหม่ · New Password', placeholder: 'เว้นว่าง = ใช้รหัสเดิม', value: '' },
      { name: 'role', label: 'บทบาท · Role', type: 'select', value: u.role, options: ROLE_OPTIONS },
    ],
    onSubmit: async (v) => {
      if (!v.name || !v.username) { toast('กรุณาใส่ชื่อและ username', 'warn'); return; }
      u.name = v.name; u.username = v.username; u.role = v.role;
      if (v.password) {
        const h = await hashPassword(v.password);
        if (h) { u.passwordHash = h; delete u.password; } else { u.password = v.password; }
      }
      saveData(); closeModal(); render(); toast('บันทึกแล้ว ✓');
    }
  });
}
function delUser(id) {
  const u = DATA.users.find(x=>x.id===id);
  showConfirmModal('ลบผู้ใช้นี้?', `${u?.name} (${u?.username})`, () => {
    DATA.users = DATA.users.filter(u => u.id !== id);
    saveData(); render(); toast('ลบแล้ว');
  });
}

// Outlet checklist functions
function copyMainToOutlet(outletId) {
  DATA.outletChecklists[outletId] = JSON.parse(JSON.stringify(DATA.checklists.main || []));
  // Give new unique IDs to avoid conflicts with main
  DATA.outletChecklists[outletId].forEach(cl => {
    cl.id = 'o_'+outletId+'_'+cl.id;
    cl.items.forEach(it => it.id = 'o_'+outletId+'_'+it.id);
  });
  saveData(); render(); toast('คัดลอกแล้ว · Copied — แก้ไขได้แล้ว');
}
function clearOutletChecklist(outletId) {
  showConfirmModal('ล้าง checklist ห้องนี้?', 'จะกลับไปใช้ Main default · ข้อมูลเดิมจะหายไป', () => {
    delete DATA.outletChecklists[outletId];
    saveData(); render(); toast('ล้างแล้ว');
  });
}

function showFormModal({title, subtitle, fields, submitLabel = 'บันทึก · Save', onSubmit}) {
  const fieldHtml = fields.map((f, i) => {
    if (f.type === 'select' && f.options) {
      return `<div style="margin-bottom:14px">
        <label class="text-xs font-semibold mb-1.5 block" style="color:#5c5138">${f.label}</label>
        <select id="mf-${i}" data-mfield="${f.name}">
          ${f.options.map(o => `<option value="${o.value}" ${o.value===f.value?'selected':''}>${o.label}</option>`).join('')}
        </select>
      </div>`;
    }
    if (f.type === 'emoji-picker') {
      const emojis = ['📌','📋','🍽️','🧼','👔','🌅','🌙','⭐','🔥','❄️','💧','🎨','🎯','🍴','🥘','🚿','🧹','📦','🔍','⚙️','🎭','🍹','🥂'];
      return `<div style="margin-bottom:14px">
        <label class="text-xs font-semibold mb-1.5 block" style="color:#5c5138">${f.label}</label>
        <div class="flex items-center gap-2">
          <input id="mf-${i}" data-mfield="${f.name}" value="${(f.value||'').replace(/"/g,'&quot;')}" placeholder="${f.placeholder||''}" style="width:80px;text-align:center;font-size:20px">
          <div class="flex flex-wrap gap-1" style="flex:1">
            ${emojis.map(e => `<button type="button" data-emoji-pick="${e}" data-target="mf-${i}" style="width:32px;height:32px;font-size:18px;border:1px solid #ecdcb7;background:#fff;border-radius:8px;cursor:pointer">${e}</button>`).join('')}
          </div>
        </div>
      </div>`;
    }
    if (f.type === 'textarea') {
      return `<div style="margin-bottom:14px">
        <label class="text-xs font-semibold mb-1.5 block" style="color:#5c5138">${f.label}</label>
        <textarea id="mf-${i}" data-mfield="${f.name}" placeholder="${f.placeholder||''}" rows="3" style="font-size:14px">${(f.value||'').replace(/</g,'&lt;')}</textarea>
      </div>`;
    }
    return `<div style="margin-bottom:14px">
      <label class="text-xs font-semibold mb-1.5 block" style="color:#5c5138">${f.label}</label>
      <input id="mf-${i}" data-mfield="${f.name}" type="${f.type||'text'}" value="${(f.value||'').replace(/"/g,'&quot;')}" placeholder="${f.placeholder||''}">
    </div>`;
  }).join('');
  openModal(`
  <div class="p-6">
    <div class="mb-4 text-center">
      <div class="display-font text-xl font-bold" style="color:#1a1611">${title}</div>
      ${subtitle?`<div class="text-xs mt-1" style="color:#5c5138">${subtitle}</div>`:''}
      <div class="gold-line-short mx-auto mt-3"></div>
    </div>
    <form id="mf-form">
      ${fieldHtml}
      <div class="flex gap-2 mt-4">
        <button type="button" data-action="closeModal" class="btn-secondary flex-1">ยกเลิก · Cancel</button>
        <button type="submit" class="btn-primary flex-1">${submitLabel}</button>
      </div>
    </form>
  </div>`);
  // Wire up emoji pickers
  document.querySelectorAll('[data-emoji-pick]').forEach(b => {
    b.onclick = () => {
      const target = document.getElementById(b.dataset.target);
      if (target) target.value = b.dataset.emojiPick;
    };
  });
  // Wire up submit
  const form = document.getElementById('mf-form');
  if (form) form.onsubmit = (e) => {
    e.preventDefault();
    const values = {};
    fields.forEach((f, i) => {
      const el = document.getElementById(`mf-${i}`);
      values[f.name] = el?.value.trim() || '';
    });
    onSubmit(values);
  };
  // Focus first field
  setTimeout(() => document.getElementById('mf-0')?.focus(), 100);
}

function showConfirmModal(title, msg, onConfirm) {
  openModal(`
  <div class="p-6 text-center">
    <div class="text-4xl mb-3">⚠️</div>
    <div class="display-font text-lg font-bold" style="color:#1a1611">${title}</div>
    <div class="text-sm mt-2 mb-4" style="color:#5c5138">${msg}</div>
    <div class="flex gap-2">
      <button data-action="closeModal" class="btn-secondary flex-1">ยกเลิก</button>
      <button id="confirm-btn" class="btn-danger flex-1">ตกลง · Confirm</button>
    </div>
  </div>`);
  const btn = document.getElementById('confirm-btn');
  // กัน ghost click: modal เพิ่งเปิดจากการแตะ ห้ามให้ click ที่ตามมาไปกดยืนยันเอง
  if (btn) btn.onclick = () => { if (Date.now() - _lastTouchActAt < 400) return; closeModal(); onConfirm(); };
}

        เปิด Auto-compact ไว้เพื่อเก็บข้อมูลได้ 3+ ปี · ภาพหลักฐานเดิมจะถูกลบออกจาก Storage ตามรอบ retention เพื่อควบคุมพื้นที่
      </div>
    </div>
  </div>

  <div class="card p-6">
    <div class="font-semibold mb-4" style="color:#1a1611">💾 การจัดการข้อมูล · Data Management</div>
    <div class="grid sm:grid-cols-2 gap-4">
      <button data-action="exportData" class="btn-primary py-4">📥 ดาวน์โหลดข้อมูล (JSON)</button>
      <label class="btn-secondary py-4 cursor-pointer text-center" style="display:block">📤 นำเข้าข้อมูล (JSON)<input type="file" accept=".json" data-import-input style="display:none"></label>
      <button data-action="compactNow" class="btn-secondary py-4" style="border-color:#8b6820;color:#8b6820">🗜️ Compact ทันที · ลบรูปเก่า</button>
      <button data-action="clearOldInspections" class="btn-secondary py-4" style="border-color:#dc2626;color:#dc2626">🧹 ลบข้อมูลเก่ากว่า 90 วัน</button>
      <button data-action="cleanupLoadTests" class="btn-secondary py-4" style="border-color:#d97706;color:#92400e">🧪 ลบประวัติ LOADTEST</button>
      <button data-action="clearInspections" class="btn-danger py-4">🗑️ ลบประวัติการตรวจทั้งหมด</button>
      <button data-action="resetAll" class="btn-danger py-4">⚠️ รีเซ็ตระบบทั้งหมด</button>
    </div>

    <div class="mt-6 pt-6" style="border-top:1px solid #f2e6c8">
      <div class="text-sm font-semibold mb-3" style="color:#1a1611">💽 พื้นที่เก็บ · Storage Usage</div>
      <div class="rounded-xl p-4" style="background:linear-gradient(135deg,#faf5e8,#fefdfa);border:1.5px solid #ecdcb7">
        <div class="flex justify-between mb-2 items-baseline">
          <div class="text-2xl font-bold" style="color:${pctColor}">${info.sizeMB} MB</div>
          <div class="text-xs" style="color:#5c5138">Browser limit: ~5 MB</div>
        </div>
        <div style="height:10px;background:#f2e6c8;border-radius:6px;overflow:hidden">
          <div style="height:100%;width:${Math.min(info.pct,100)}%;background:${pctColor};transition:width 0.4s"></div>
        </div>
        <div class="text-xs mt-2" style="color:${pctColor};font-weight:600">${info.pct}% used${info.pct>=80?' · ⚠️ ควรลบข้อมูลเก่า':''}</div>
      </div>
    </div>

    <div class="mt-6 pt-6" style="border-top:1px solid #f2e6c8">
      <div class="text-xs mb-3" style="color:#5c5138">สถิติปัจจุบัน · Current Stats</div>
      <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-center">
        <div class="card p-3" style="background:#faf5e8"><div class="text-2xl font-bold" style="color:#8b6820">${DATA.users.length}</div><div class="text-xs" style="color:#5c5138">ผู้ใช้</div></div>
        <div class="card p-3" style="background:#dcfce7"><div class="text-2xl font-bold" style="color:#166534">${DATA.hotels.length}</div><div class="text-xs" style="color:#5c5138">โรงแรม</div></div>
        <div class="card p-3" style="background:#e3f0f9"><div class="text-2xl font-bold" style="color:#3a6a90">${Object.values(DATA.checklists).flat().reduce((s,c)=>s+c.items.length,0)}</div><div class="text-xs" style="color:#5c5138">หัวข้อตรวจ</div></div>
        <div class="card p-3" style="background:#f0eafa"><div class="text-2xl font-bold" style="color:#6b47a3">${DATA.inspections.length}</div><div class="text-xs" style="color:#5c5138">การตรวจ</div></div>
        <div class="card p-3" style="background:#fbe8e2"><div class="text-2xl font-bold" style="color:#a34532">${DATA.complaints.length}</div><div class="text-xs" style="color:#5c5138">คอมเพลนต์</div></div>
      </div>
    </div>
  </div>`;
}

function clearOldInspections() {
  const cutoff = Date.now() - 90*86400000;
  const oldCount = DATA.inspections.filter(i => (i.completedAt || 0) < cutoff).length;
  if (oldCount === 0) { toast('ไม่มีข้อมูลเก่ากว่า 90 วัน · No data older than 90 days'); return; }
  showConfirmModal(`ลบการตรวจเก่ากว่า 90 วัน?`, `${oldCount} รายการจะถูกลบ`, () => {
    DATA.inspections = DATA.inspections.filter(i => (i.completedAt || 0) >= cutoff);
    DATA.complaints = DATA.complaints.filter(c => new Date(c.date).getTime() >= cutoff);
    saveData(); render(); toast(`ลบแล้ว ${oldCount} รายการ`);
  });
}
function compactNow() {
  const days = DATA.settings?.compactDays || 30;
  const cutoff = Date.now() - days*86400000;
  const before = DATA.inspections.filter(i => i._compacted).length;
  compactExpiredInspectionPhotos();
  const after = DATA.inspections.filter(i => i._compacted).length;
  saveData(); render();
  const compactedNow = Math.max(0, after - before);
  if (compactedNow > 0) toast(`🗜️ Compact แล้ว ${compactedNow} รายการ · ลบหลักฐานรูปเก่าตามนโยบาย ${days} วัน`);
  else toast('ไม่มีรูปเก่าที่ต้อง compact · Nothing to compact');
}

function exportData() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `fnb-standards-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    toast('บน GitHub Pages จะ download ได้', 'info');
  } catch(e) { toast('บน GitHub Pages จะ download ได้', 'info'); }
}
function importData(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!confirm('แทนที่ข้อมูลทั้งหมด?')) return;
      DATA = d; saveData(); render(); toast('นำเข้าเรียบร้อย');
    } catch(err) { toast('ไฟล์ไม่ถูกต้อง', 'error'); }
  };
  r.readAsText(f);
}
async function cleanupLoadTests() {
  const localCount = (DATA.inspections||[]).filter(isLoadTestInspection).length;
  if (!confirm(`ลบข้อมูล LOADTEST ออกจากระบบ F&B?\n\nข้อมูลตรวจจริงจะไม่ถูกลบ\nประวัติสรุปการทดสอบในเมนู “ประวัติทดสอบ” จะยังคงอยู่`)) return;
  DATA.inspections = (DATA.inspections||[]).filter(i => !isLoadTestInspection(i));
  saveDataLocalOnly();
  if (FNB_SB) {
    try {
      const { data, error } = await FNB_SB.from(FNB_CLOUD.table).select('item_id,payload').eq('bucket','inspections').like('item_id','LOADTEST_%');
      if (error) throw error;
      const ids = (data||[]).map(x=>x.item_id).filter(Boolean);
      for (let i=0;i<ids.length;i+=100) {
        const chunk = ids.slice(i,i+100);
        const r = await FNB_SB.from(FNB_CLOUD.table).delete().eq('bucket','inspections').in('item_id',chunk);
        if (r.error) throw r.error;
      }
      if (FNB_CLOUD_CACHE.inspections) {
        for (const id of ids) FNB_CLOUD_CACHE.inspections.delete(id);
      }
      toast(`🧪 ลบ LOADTEST แล้ว ${ids.length} รายการ · ข้อมูลจริงไม่ถูกลบ`, 'success');
    } catch (e) {
      toast(`ลบใน Cloud ไม่สำเร็จ · ${e.message||e}`, 'warn');
    }
  } else {
    toast(`ลบ LOADTEST ในเครื่องแล้ว ${localCount} รายการ · เปิด Cloud ก่อนเพื่อลบ Supabase`, 'info');
  }
  render();
}

function clearInspections() { if (!confirm('ลบประวัติทั้งหมด?')) return; DATA.inspections = []; saveData(); render(); toast('ลบแล้ว'); }
function resetAll() {
  if (!confirm('รีเซ็ตระบบ?')) return;
  if (!confirm('แน่ใจอีกครั้ง?')) return;
  DATA = JSON.parse(JSON.stringify(DEFAULT_DATA)); saveData(); render(); toast('รีเซ็ตแล้ว');
}

// STATS
function getGlobalStats() {
  const insps = DATA.inspections.filter(i => i.status === 'done');
  const total = insps.length;
  const avgScore = total ? Math.round(insps.reduce((s,x)=>s+x.score,0)/total) : 0;
  const today = new Date().toISOString().slice(0,10);
  const todayCount = insps.filter(i => i.date === today).length;
  return { total, avgScore, today: todayCount };
}

// ===== เฝ้าสถานะเน็ต =====
window.addEventListener('online', () => {
  setConn('connecting');
  if (!FNB_CLOUD_READY) initCloud();
  else { (async () => { await cloudSyncNow(false); await refreshCloudFromServer('online'); flushPhotoQueue(); })(); setConn('online'); }
});
window.addEventListener('offline', () => setConn('offline', 'อุปกรณ์ออฟไลน์'));
// กลับมาเปิดหน้าจออีกครั้ง: ดึงข้อมูลล่าสุดและส่งของค้าง
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!navigator.onLine) { setConn('offline', 'อุปกรณ์ออฟไลน์'); return; }
  if (!FNB_CLOUD_READY) initCloud();
  else {
    // Pull first, then sync pending local edits. This prevents an old tab from showing stale History.
    (async () => {
      await cloudSyncNow(false);
      await refreshCloudFromServer('visibility');
      flushPhotoQueue();
    })();
  }
});
window.addEventListener('pageshow', ev => { if (ev.persisted && navigator.onLine && FNB_CLOUD_READY) { cloudSyncNow(false).then(() => refreshCloudFromServer('pageshow')); flushPhotoQueue(); } });
// ส่งรูปที่ค้างเป็นระยะ เผื่อเน็ตกลับมาแบบเงียบๆ
setInterval(() => {
  if (!navigator.onLine || !FNB_CLOUD_READY) return;
  flushPhotoQueue();
  if (SYNC_DIRTY.size || SYNC_DEL.size) cloudSyncNow(false);
  else refreshCloudFromServer('periodic');
}, 15000);

// INIT
function bootApp() {
  try { syncSnapReset(); syncPersist(); } catch (e) { console.warn('sync init', e); }
  pqInit().then(() => { FNB_CONN.pendingPhotos = readPhotoQueue().length; paintConnChip(); if (VIEW_STATE.page === 'inspection') softRender(); });
  render();
  if (!navigator.onLine) setConn('offline', 'อุปกรณ์ออฟไลน์');
  initCloud();
  setTimeout(() => flushPhotoDeletionQueue(), 1800);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootApp);
else bootApp();
</script>
