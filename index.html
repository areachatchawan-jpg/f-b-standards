<style>
  :root {

    --bg: #fefdfb; --bg-alt: #f7f4ec; --card: #ffffff; --card-border: #ede4cf;

    --gold: #b8892f; --gold-dark: #8b6820; --gold-light: #d4af6c;

    --mint: #16a34a; --mint-tint: #dcfce7;

    --red: #dc2626; --red-tint: #fee2e2;

    /* ---- MOBILE FIX 1: แถบแท็บให้ขึ้นบรรทัดใหม่แทนการเลื่อนซ่อน ----
       เดิมแท็บหมวดตรวจยาวเกินจอ (ถึง 670px บนจอ 390px) และ scrollbar ถูกซ่อน
       ทำให้ผู้ตรวจไม่เห็นว่ามีหมวดอื่นอยู่ทางขวา จึงตรวจไม่ครบ */
    [data-scroll-key] { flex-wrap: wrap !important; overflow-x: visible !important; }
    [data-scroll-key] > * { min-width: 0 !important; flex: 1 1 auto !important; }
    [data-scroll-key] > .tab-btn { flex: 1 1 30% !important; white-space: normal !important; line-height: 1.25; }
    .tab-btn { white-space: normal !important; min-height: 44px; }

    button[data-action^="del"], button[data-action^="remove"], button[data-action^="Del"] {
      min-width: 44px; min-height: 44px; }
    .flex.overflow-x-auto:not([data-scroll-key]) { flex-wrap: wrap; overflow-x: visible; }

    /* ---- MOBILE FIX 2: ปุ่มเมนูบนให้แตะง่าย (มาตรฐาน 44px) ---- */
    .app-header .nav-btn { padding: 0 10px !important; font-size: 12px; min-height: 44px; min-width: 44px;

    /* ---- MOBILE FIX 3: ช่องกรอกต้อง >= 16px ไม่งั้น iPhone ซูมเข้าเองทุกครั้ง ---- */
    input, select, textarea { font-size: 16px !important; }

    /* ป้ายสถานะบนมือถือ: ปกติโชว์แค่จุด ประหยัดที่ — จะขยายเป็นข้อความเมื่อออฟไลน์ */

}

  if (name === 'shifts') return DATA.shifts;
  if (name === 'checklists') return DATA.checklists;

  if (value === null || value === undefined) return;
  if (name === 'hotels' && Array.isArray(value)) DATA.hotels = value;
  else if (name === 'shifts' && Array.isArray(value)) DATA.shifts = value;
  else if (name === 'checklists' && typeof value === 'object') DATA.checklists = value;

    hotels: DATA.hotels,
    shifts: DATA.shifts,

  // even when the actual data is identical. Sort object keys recursively while
  // preserving array order.
  const canonicalize = value => {
    if (Array.isArray(value)) return value.map(canonicalize);
    if (value && typeof value === 'object') {
      const out = {};
      for (const key of Object.keys(value).sort()) out[key] = canonicalize(value[key]);

  if (FNB_CONN.state === state && FNB_CONN.lastError === err) return;

// วาดเฉพาะป้ายสถานะ ไม่ render ทั้งหน้า (กันหน้ากระพริบ/ช่องพิมพ์หลุด)
function paintConnChip() {
  const el = document.getElementById('conn-chip');
  if (!el) return;
  const s = FNB_CONN.state;
  const pend = FNB_CONN.pendingPhotos;
  const map = {
    connecting: ['wait', '⏳', 'กำลังเชื่อมต่อ'],
    online: ['on', '', 'ออนไลน์'],

// ยิงซ้ำแบบถอยหลังทีละขั้น + สุ่มเวลา กันกรณี 100 เครื่องเข้าพร้อมกันแล้วชน auth
async function withRetry(fn, tries = 4, label = '') {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try { return await fn(); }
    catch (e) {
      lastErr = e;
      if (i === tries - 1) break;
      const wait = Math.round((400 * Math.pow(2, i)) + Math.random() * 900);
      console.warn(`retry ${label} #${i + 1} in ${wait}ms:`, e?.message || e);
      await new Promise(r => setTimeout(r, wait));
    }
  }
  throw lastErr;
}

async function initCloud() {
  if (!cloudConfigured()) {
    console.warn('F&B Cloud not configured: add the Supabase publishable/anon key to FNB_CLOUD.key');
    setConn('local');
    return;

    if (!FNB_SB) {
      FNB_SB = window.supabase.createClient(FNB_CLOUD.url, FNB_CLOUD.key, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
        realtime: { params: { eventsPerSecond: 4 } },
        // History must always read the current shared database, not a browser/CDN cached GET.
        global: {

    let { data: sessionData, error: sessionError } = await FNB_SB.auth.getSession();
    if (sessionError) console.warn('getSession:', sessionError.message);
    if (!sessionData?.session) {

        if (anon.error) throw anon.error;

}

let FNB_RT_CHANNEL = null;
let FNB_RECONNECT_TIMER = null;
let FNB_RECONNECT_TRIES = 0;
function scheduleCloudReconnect() {
  clearTimeout(FNB_RECONNECT_TIMER);
  FNB_RECONNECT_TRIES = Math.min(FNB_RECONNECT_TRIES + 1, 6);
  const wait = Math.round(Math.min(60000, 3000 * Math.pow(1.8, FNB_RECONNECT_TRIES - 1)) + Math.random() * 2000);
  FNB_RECONNECT_TIMER = setTimeout(() => { if (!FNB_CLOUD_READY) initCloud(); }, wait);

/* ===================== SYNC-V2: multi-device safe sync =====================

   - FNB_CLOUD_CACHE = exactly what the cloud holds (never local-only data)
   - Per-checklist-item timestamps (_u) so two devices editing the same inspection merge instead of overwrite
   - Refresh/realtime never discard unsent local edits                                                  */
const SYNC_KEYS = { dirty: STORAGE_KEY + ':sync:dirty', del: STORAGE_KEY + ':sync:deleted', seen: STORAGE_KEY + ':sync:seen' };

let SYNC_DEL = new Set(syncRead(SYNC_KEYS.del, []));

const SYNC_SNAP = new Map();                              // key -> hash of last known local version
const SYNC_PREV = new Map();                              // key -> deep copy of last saved local version (only changed items)
const SYNC_BUCKETS = ['inspections', 'complaints'];

  syncWrite(SYNC_KEYS.dirty, [...SYNC_DIRTY]);
  syncWrite(SYNC_KEYS.del, [...SYNC_DEL]);
  if (SYNC_SEEN !== null) syncWrite(SYNC_KEYS.seen, SYNC_SEEN);
  FNB_CONN.pendingItems = SYNC_DIRTY.size + SYNC_DEL.size;
}
function syncHash(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return h; }

  SYNC_SNAP.clear(); SYNC_PREV.clear();
  for (const b of SYNC_BUCKETS) for (const x of (DATA[b] || [])) if (x && x.id) SYNC_SNAP.set(b + '|' + x.id, syncItemHash(x));
}
function syncSnapSet(b, x) { if (x && x.id) { SYNC_SNAP.set(b + '|' + x.id, syncItemHash(x)); SYNC_PREV.delete(b + '|' + x.id); } }

function syncStampEntries(cur, prev, now) {
  if (!cur || typeof cur !== 'object') return;
  for (const k of Object.keys(cur)) {
    const e = cur[k]; if (!e || typeof e !== 'object') continue;
    const pe = prev ? prev[k] : undefined;
    if (!pe || syncNoU(e) !== syncNoU(pe)) e._u = now;
  }
}
function syncStampInspection(x, prev, now) {
  x.updatedAt = now;
  syncStampEntries(x.items, prev && prev.items, now);
  if (x.execReview && typeof x.execReview === 'object') {
    syncStampEntries(x.execReview.items, prev && prev.execReview && prev.execReview.items, now);
    const strip = er => { if (!er) return ''; const c = { ...er }; delete c.items; delete c._u; return JSON.stringify(c); };
    if (!prev || strip(x.execReview) !== strip(prev.execReview)) x.execReview._u = now;
  }
  if (Array.isArray(x.tables)) {
    const pm = new Map(((prev && prev.tables) || []).map(t => [t && t.id, t]));
    x.tables.forEach(t => { if (t && typeof t === 'object') { const pt = pm.get(t.id); if (!pt || syncNoU(t) !== syncNoU(pt)) t._u = now; } });
  }
}
// called from saveData(): detect what THIS device changed since last save
function syncTrack() {
  const now = Date.now();
  for (const b of SYNC_BUCKETS) {
    const list = DATA[b] || [];
    const present = new Set();
    for (const x of list) {
      if (!x || !x.id) continue;
      if (b === 'inspections' && typeof isLoadTestInspection === 'function' && isLoadTestInspection(x)) continue;
      const key = b + '|' + x.id; present.add(key);
      const h = syncItemHash(x);
      if (SYNC_SNAP.get(key) === h) continue;
      const prev = SYNC_PREV.get(key) || (FNB_CLOUD_CACHE[b] && FNB_CLOUD_CACHE[b].get(x.id)) || null;
      if (b === 'inspections') syncStampInspection(x, prev, now); else x.updatedAt = now;
      SYNC_SNAP.set(key, syncItemHash(x));
      SYNC_PREV.set(key, syncClone(x));
      SYNC_DIRTY.add(key); SYNC_DEL.delete(key);
    }
    for (const key of [...SYNC_SNAP.keys()]) {
      if (!key.startsWith(b + '|') || present.has(key)) continue;
      SYNC_SNAP.delete(key); SYNC_PREV.delete(key); SYNC_DIRTY.delete(key);
      const id = key.slice(b.length + 1);
      if (syncSeenSet().has(key) || (FNB_CLOUD_CACHE[b] && FNB_CLOUD_CACHE[b].has(id))) SYNC_DEL.add(key);

  }
  syncPersist();
}
function syncMergeEntries(a, b, preferA) {
  const out = {}; const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  for (const k of keys) {
    const ea = a ? a[k] : undefined, eb = b ? b[k] : undefined;
    if (ea === undefined) { out[k] = eb; continue; }
    if (eb === undefined) { out[k] = ea; continue; }
    const ua = Number((ea && ea._u) || 0), ub = Number((eb && eb._u) || 0);
    out[k] = ua > ub ? ea : ub > ua ? eb : (preferA ? ea : eb);

}
// Merge two versions of one inspection: newest checklist item wins item-by-item
function mergeInspection(L, R) {
  if (!L) return syncClone(R); if (!R) return syncClone(L);
  const lNew = syncTs(L) >= syncTs(R);
  const top = syncClone(lNew ? L : R);
  top.items = syncClone(syncMergeEntries(L.items, R.items, lNew));
  const le = L.execReview, re = R.execReview;
  if (le || re) {
    const eu = x => Number((x && (x._u || x.reviewedAt)) || 0);
    const base = !le ? re : !re ? le : (eu(le) > eu(re) || (eu(le) === eu(re) && lNew)) ? le : re;
    const er = syncClone(base) || {};
    er.items = syncClone(syncMergeEntries(le && le.items, re && re.items, lNew));
    top.execReview = er;
  }
  if (Array.isArray(L.tables) || Array.isArray(R.tables)) {
    const m = new Map();
    for (const t of (R.tables || [])) if (t) m.set(t.id, t);
    for (const t of (L.tables || [])) { if (!t) continue; const o = m.get(t.id); if (!o || Number(t._u || 0) >= Number(o._u || 0)) m.set(t.id, t); }
    top.tables = syncClone([...m.values()]);

}
function syncMergeItem(b, L, R) { return b === 'inspections' ? mergeInspection(L, R) : (syncTs(L) >= syncTs(R) ? syncClone(L) : syncClone(R)); }

function cloudTimestamp(item, fallback=0) {
  if (!item) return fallback;
  const n = Number(item.updatedAt || item.createdAt || 0);
  return Number.isFinite(n) ? n : fallback;
}

function remoteTimestamp(row) {
  if (!row) return 0;
  const appTs = cloudTimestamp(row.payload, 0);
  if (appTs) return appTs;
  const parsed = Date.parse(row.updated_at || '');
  if (Number.isFinite(parsed)) return parsed;
  return cloudTimestamp(row.payload, 0);
}

function chooseNewestCloudRow(localItem, remoteRow) {
  if (!localItem && !remoteRow) return null;
  if (!remoteRow) return { value: localItem, localNewer: true };
  if (!localItem) return { value: remoteRow.payload, localNewer: false };
  const lt = cloudTimestamp(localItem);
  const rt = remoteTimestamp(remoteRow);
  if (lt > rt) return { value: localItem, localNewer: true };
  return { value: remoteRow.payload, localNewer: false };
}

// ดึงทุกแถวแบบแบ่งหน้า — เดิมไม่มี .range() ทำให้ Supabase ส่งกลับสูงสุด 1000 แถว
// แล้วข้อมูลที่เหลือหายไปเงียบๆ (ไม่มี error) พอใช้ไปสักพักรายงานจะไม่ครบ
async function cloudFetchAllRows() {
  const PAGE = 800;
  const all = [];
  for (let from = 0; ; from += PAGE) {
    const { data, error } = await FNB_SB
      .from(FNB_CLOUD.table)
      .select('bucket,item_id,payload,updated_at')
      .order('bucket', { ascending: true })
      .order('item_id', { ascending: true })
      .range(from, from + PAGE - 1);
    if (error) throw error;
    const batch = data || [];
    all.push(...batch);
    if (batch.length < PAGE) break;
    if (from > 200000) break; // กันลูปไม่รู้จบ
  }
  return all;
}

let FNB_FRESH_DB = false;

// โหลด + รวมข้อมูล เท่านั้น ยังไม่เขียนขึ้น cloud
async function cloudLoadStateRaw() {
  if (!FNB_SB) return;
  const list = await cloudFetchAllRows();
  const cfgRows = list.filter(r => r.bucket === 'config');
  const cloudIns = list.filter(r => r.bucket === 'inspections' && !r.payload?.testRun && !String(r.item_id||'').startsWith('LOADTEST_'));
  const cloudComp = list.filter(r => r.bucket === 'complaints');

  FNB_FRESH_DB = (cfgRows.length === 0 && cloudIns.length === 0 && cloudComp.length === 0);
  if (FNB_FRESH_DB) {
    FNB_CLOUD_CACHE.config = {};
    FNB_CLOUD_CACHE.inspections = new Map();
    FNB_CLOUD_CACHE.complaints = new Map();
    for (const b of SYNC_BUCKETS) for (const x of (DATA[b] || [])) if (x && x.id && !(b === 'inspections' && isLoadTestInspection(x))) SYNC_DIRTY.add(b + '|' + x.id);
    if (SYNC_SEEN === null) SYNC_SEEN = [];
    syncSnapReset(); syncPersist();
    return;
  }

  // รองรับทั้งรูปแบบเดิม (config/state แถวเดียว) และรูปแบบใหม่ (แยกแถวต่อหัวข้อ)
  const prevCfgCache = FNB_CLOUD_CACHE.config || {};
  const cfgLocalPending = s => prevCfgCache[s] !== undefined && jsonStable(configSectionValue(s)) !== jsonStable(prevCfgCache[s]);
  const pendingCfg = new Set(CONFIG_SECTIONS.filter(cfgLocalPending));
  FNB_CLOUD_CACHE.config = {};
  const legacy = cfgRows.find(r => r.item_id === 'state');
  if (legacy?.payload) {
    CONFIG_SECTIONS.forEach(s => {
      if (legacy.payload[s] !== undefined) {
        if (!pendingCfg.has(s)) applyConfigSection(s, legacy.payload[s]);
        FNB_CLOUD_CACHE.config[s] = JSON.parse(JSON.stringify(legacy.payload[s]));
      }
    });
  }
  for (const r of cfgRows) {
    if (!CONFIG_SECTIONS.includes(r.item_id)) continue;
    const v = r.payload && r.payload.v !== undefined ? r.payload.v : r.payload;
    if (!pendingCfg.has(r.item_id)) applyConfigSection(r.item_id, v);
    FNB_CLOUD_CACHE.config[r.item_id] = JSON.parse(JSON.stringify(v));
  }
  if (pendingCfg.size) setTimeout(() => scheduleCloudSync(), 0);

  const cloudInsRows = new Map(cloudIns.map(r => [r.item_id, r]));
  const cloudCompRows = new Map(cloudComp.map(r => [r.item_id, r]));
  // cache = exactly what the cloud holds
  FNB_CLOUD_CACHE.inspections = new Map(cloudIns.map(r => [r.item_id, syncClone(r.payload)]));
  FNB_CLOUD_CACHE.complaints = new Map(cloudComp.map(r => [r.item_id, syncClone(r.payload)]));
  const firstRun = SYNC_SEEN === null;
  const seen = syncSeenSet();
  const mergeBucket = (b, rowsMap, localList) => {
    const out = [];
    const localMap = new Map(localList.filter(x => x && x.id).map(x => [x.id, x]));
    for (const id of new Set([...localMap.keys(), ...rowsMap.keys()])) {
      const key = b + '|' + id;
      const L = localMap.get(id); const R = rowsMap.get(id)?.payload;
      if (L && R) {
        if (SYNC_DIRTY.has(key)) syncAssignInPlace(L, syncMergeItem(b, L, R));
        else syncAssignInPlace(L, R);
        out.push(L);
      } else if (R) {
        if (SYNC_DEL.has(key)) continue;           // deleted here, delete is still being sent
        out.push(syncClone(R));
      } else if (L) {
        if (SYNC_DIRTY.has(key)) out.push(L);      // made here, not uploaded yet
        else if (firstRun) { out.push(L); if (Date.now() - syncTs(L) < 7 * 864e5) SYNC_DIRTY.add(key); }
        else if (seen.has(key)) { /* deleted on another device */ }
        else { out.push(L); SYNC_DIRTY.add(key); }
      }
    }
    return out;
  };
  DATA.inspections = mergeBucket('inspections', cloudInsRows, (DATA.inspections || []).filter(x => !isLoadTestInspection(x)));
  DATA.inspections.forEach(i => {
    if (!i.tables) i.tables = [];
    if (i.status === 'done' && (!i.execReview || !i.execReview.status)) {
      i.execReview = { ...(i.execReview || {}), status: 'pending' };
    }
  });
  DATA.complaints = mergeBucket('complaints', cloudCompRows, DATA.complaints || []);
  SYNC_SEEN = [...cloudIns.map(r => 'inspections|' + r.item_id), ...cloudComp.map(r => 'complaints|' + r.item_id)];
  syncSnapReset();
  syncPersist();
}

// เรียกหลังโหลดสำเร็จเท่านั้น
async function cloudAfterLoad() {
  // ดันขึ้น cloud เฉพาะตอนฐานข้อมูลยังว่าง (ครั้งแรกสุด) หรือมีของในเครื่องที่ใหม่กว่า
  await cloudSyncNow(FNB_FRESH_DB);
  saveDataLocalOnly();
  softRender();
}

// ดึงฐานข้อมูลกลางแบบ authoritative อีกครั้งโดยไม่เขียน local ที่เก่ากลับไปทับ cloud
// ใช้เมื่อเปิดหน้า History/Reports และเป็น background refresh เพื่อให้คอมกับมือถือเห็นชุดข้อมูลเดียวกัน
let FNB_CLOUD_REFRESHING = false;
let FNB_CLOUD_REFRESH_TIMER = null;
async function refreshCloudFromServer(reason = 'manual') {
  if (!FNB_CLOUD_READY || !FNB_SB || FNB_CLOUD_REFRESHING || FNB_CLOUD_SYNCING) return false;
  if (!navigator.onLine) return false;
  FNB_CLOUD_REFRESHING = true;
  try {
    await withRetry(() => cloudLoadStateRaw(), 3, `cloudRefresh:${reason}`);
    FNB_CONN.lastSyncAt = Date.now();
    saveDataLocalOnly();
    if (SYNC_DIRTY.size || SYNC_DEL.size) scheduleCloudSync();
    if (VIEW_STATE.page !== 'inspection') softRender();
    return true;
  } catch (e) {
    console.warn('Cloud refresh failed:', e?.message || e);
    return false;
  } finally {
    FNB_CLOUD_REFRESHING = false;
  }
}

function scheduleCloudRefresh() {
  clearTimeout(FNB_CLOUD_REFRESH_TIMER);
  FNB_CLOUD_REFRESH_TIMER = setTimeout(() => {
    if (FNB_CLOUD_READY && navigator.onLine) refreshCloudFromServer('background');
  }, 15000);
}

// เก็บชื่อเดิมไว้ เผื่อมีที่อื่นเรียก
async function cloudLoadState() {
  await cloudLoadStateRaw();
  await cloudAfterLoad();
}

function cloudRowPayload(bucket, item) {
  // A new inspection may have no cached previous row yet.
  // Guard null/undefined so cloud sync never crashes with:
  // "Cannot read properties of null (reading 'items')"
  if (item === null || item === undefined) return item;
  let payload = JSON.parse(JSON.stringify(item));
  if (!payload || typeof payload !== 'object') return payload;
  // Photos should be Supabase Storage URLs; never push large inline data URLs to the database.
  if (payload.items) {
    for (const v of Object.values(payload.items)) {
      if (Array.isArray(v.photos)) v.photos = v.photos.filter(p => typeof p === 'string' && /^https?:\/\//i.test(p));
      if (Array.isArray(v.photoEvidence)) v.photoEvidence = v.photoEvidence.filter(x => x && typeof x.url === 'string' && /^https?:\/\//i.test(x.url));
      if (v.photoEvidence?.length) v.photoEvidence = v.photoEvidence.map(x => ({
        url: x.url, path: x.path || null, uploadedAt: x.uploadedAt || null,
        uploadedBy: x.uploadedBy || null, uploadedByName: x.uploadedByName || null, stage: x.stage || 'manager'
      }));
    }
  }
  if (payload.execReview?.items) {
    for (const v of Object.values(payload.execReview.items)) {
      if (typeof v.execPhoto === 'string' && !/^https?:\/\//i.test(v.execPhoto)) delete v.execPhoto;
      if (Array.isArray(v.execPhotos)) v.execPhotos = v.execPhotos.filter(p => typeof p === 'string' && /^https?:\/\//i.test(p));
      if (Array.isArray(v.execEvidence)) v.execEvidence = v.execEvidence.filter(x => x && typeof x.url === 'string' && /^https?:\/\//i.test(x.url)).map(x => ({
        url: x.url, path: x.path || null, storageMode: x.storageMode || 'public',
        uploadedAt: x.uploadedAt || null,
        uploadedBy: x.uploadedBy || null, uploadedByName: x.uploadedByName || null, stage: 'executive'
      }));
    }
  }
  return payload;
}

async function verifyCloudRows(expectedRows) {
  const grouped = new Map();
  for (const row of expectedRows) {
    if (!grouped.has(row.bucket)) grouped.set(row.bucket, []);
    grouped.get(row.bucket).push(row);
  }

  for (const [bucket, rows] of grouped) {
    for (let i = 0; i < rows.length; i += 100) {
      const chunk = rows.slice(i, i + 100);
      const ids = chunk.map(r => r.item_id);
      const { data, error } = await FNB_SB
        .from(FNB_CLOUD.table)
        .select('bucket,item_id,payload,updated_at')
        .eq('bucket', bucket)
        .in('item_id', ids);
      if (error) throw error;

      const got = new Map((data || []).map(r => [r.item_id, r]));
      for (const expected of chunk) {
        const actual = got.get(expected.item_id);
        // แถวต้องมีอยู่จริง — อันนี้คือของจริงที่ต้องเตือน
        if (!actual) throw new Error(`Cloud read-back ไม่พบ ${bucket}/${expected.item_id}`);
        if (jsonStable(actual.payload) === jsonStable(expected.payload)) continue;
        // ข้อมูลไม่ตรง = มีคนอื่นบันทึกทับระหว่างที่เราเขียนเสร็จกับตอนอ่านกลับ
        // ซึ่งเป็นเรื่องปกติเมื่อหลายคนใช้พร้อมกัน ไม่ใช่ความผิดพลาด
        // เดิมโค้ดโยน error ทำให้ขึ้น "บันทึก Cloud ไม่สำเร็จ" ทั้งที่ข้อมูลเข้าแล้ว
        const remoteTs = remoteTimestamp(actual);
        const localTs = cloudTimestamp(expected.payload, 0);
        if (remoteTs >= localTs) {
          console.info(`read-back: มีคนอื่นอัปเดต ${bucket}/${expected.item_id} ทีหลัง — ใช้ของเขา`);
          if (bucket === 'inspections' || bucket === 'complaints') {
            try { applyCloudRealtime({ eventType: 'UPDATE', new: actual }); } catch (_) {}
          }
          continue;
        }
        throw new Error(`Cloud read-back ข้อมูลไม่ตรง ${bucket}/${expected.item_id}`);
      }
    }
  }
}

async function verifyCloudDeletes(bucket, ids) {
  for (let i = 0; i < ids.length; i += 100) {
    const chunk = ids.slice(i, i + 100);
    const { data, error } = await FNB_SB
      .from(FNB_CLOUD.table)
      .select('item_id')
      .eq('bucket', bucket)
      .in('item_id', chunk);
    if (error) throw error;
    if ((data || []).length) throw new Error(`Cloud delete verification ไม่ผ่าน ${bucket}`);
  }
}

let FNB_SYNC_PENDING = false;
async function cloudSyncNow(force = false) {
  if (!FNB_CLOUD_READY || !FNB_SB) return;
  if (FNB_CLOUD_SYNCING) {
    // มีรอบก่อนหน้ากำลังวิ่งอยู่ — จำไว้ว่ายังมีของค้าง แล้วค่อยยิงซ้ำ
    // (เดิม return ทิ้งเฉยๆ ทำให้การแก้ล่าสุดไม่ถูกส่งขึ้น cloud)
    FNB_SYNC_PENDING = true;
    return;
  }
  FNB_CLOUD_SYNCING = true;
  try {
    const upserts = [];
    // แยก config เป็นแถวย่อยต่อหัวข้อ เพื่อให้แอดมินสองคนแก้คนละเรื่องพร้อมกันได้
    // โดยของอีกคนไม่หาย (เดิมยัดรวมเป็นแถวเดียว ใครบันทึกทีหลังทับหมด)
    const cfgSnapshot = {};
    for (const s of CONFIG_SECTIONS) {
      const v = JSON.parse(JSON.stringify(configSectionValue(s)));
      cfgSnapshot[s] = v;
      if (force || jsonStable(v) !== jsonStable(FNB_CLOUD_CACHE.config?.[s])) {
        upserts.push({ bucket: 'config', item_id: s, payload: { v } });
      }
    }

    for (let i = 0; i < upserts.length; i += 100) {
      const chunk = upserts.slice(i, i + 100);
      const { error } = await FNB_SB.from(FNB_CLOUD.table).upsert(chunk, { onConflict: 'bucket,item_id' });
      if (error) throw error;
      await verifyCloudRows(chunk);
    }
    FNB_CLOUD_CACHE.config = cfgSnapshot;

    // ---- records changed on THIS device (dirty) ----
    for (const b of SYNC_BUCKETS) {
      const want = [];
      for (const key of [...SYNC_DIRTY]) {
        if (!key.startsWith(b + '|')) continue;
        const id = key.slice(b.length + 1);
        const item = (DATA[b] || []).find(x => x.id === id);
        if (!item || (b === 'inspections' && isLoadTestInspection(item))) { SYNC_DIRTY.delete(key); continue; }
        want.push(item);
      }
      if (force) for (const x of (DATA[b] || [])) if (x && x.id && !want.includes(x) && !(b === 'inspections' && isLoadTestInspection(x))) want.push(x);
      for (let i = 0; i < want.length; i += 50) {
        const chunkItems = want.slice(i, i + 50);
        // conflict check: did another device change these since we last saw them?
        const { data: remoteRows, error: rErr } = await FNB_SB.from(FNB_CLOUD.table)
          .select('item_id,payload,updated_at').eq('bucket', b).in('item_id', chunkItems.map(x => x.id));
        if (rErr) throw rErr;
        const remote = new Map((remoteRows || []).map(r => [r.item_id, r]));
        const rows = []; const startHash = new Map();
        for (const item of chunkItems) {
          const key = b + '|' + item.id;
          const R = remote.get(item.id)?.payload;
          const base = FNB_CLOUD_CACHE[b].get(item.id);
          if (R && jsonStable(R) !== jsonStable(base === undefined ? null : base)) {
            const merged = syncMergeItem(b, item, R);
            syncAssignInPlace(item, merged);
            syncSnapSet(b, item);
            if (b === 'complaints' && syncTs(R) > syncTs(item)) { FNB_CLOUD_CACHE[b].set(item.id, syncClone(R)); SYNC_DIRTY.delete(key); continue; }
          }
          startHash.set(item.id, syncItemHash(item));
          rows.push({ bucket: b, item_id: item.id, payload: b === 'inspections' ? cloudRowPayload('inspections', item) : syncClone(item) });
        }
        if (!rows.length) continue;
        const { error } = await FNB_SB.from(FNB_CLOUD.table).upsert(rows, { onConflict: 'bucket,item_id' });
        if (error) throw error;
        await verifyCloudRows(rows);
        for (const r of rows) {
          const key = b + '|' + r.item_id;
          FNB_CLOUD_CACHE[b].set(r.item_id, syncClone(r.payload));
          syncSeenAdd(key);
          const item = (DATA[b] || []).find(x => x.id === r.item_id);
          if (!item || syncItemHash(item) === startHash.get(r.item_id)) SYNC_DIRTY.delete(key);
        }
      }
    }

    // ---- deletions made on THIS device ----
    for (const b of SYNC_BUCKETS) {
      const ids = [...SYNC_DEL].filter(k => k.startsWith(b + '|')).map(k => k.slice(b.length + 1));
      for (let i = 0; i < ids.length; i += 100) {
        const chunk = ids.slice(i, i + 100);
        const { error } = await FNB_SB.from(FNB_CLOUD.table).delete().eq('bucket', b).in('item_id', chunk);
        if (error) throw error;
        await verifyCloudDeletes(b, chunk);
        chunk.forEach(id => { SYNC_DEL.delete(b + '|' + id); syncSeenDel(b + '|' + id); FNB_CLOUD_CACHE[b].delete(id); });
      }
    }
    syncPersist();
    FNB_CONN.lastSyncAt = Date.now();
    FNB_RECONNECT_TRIES = 0;
    if (FNB_CONN.state !== 'online') setConn('online');
    return true;
  } catch (e) {
    console.error('Cloud sync failed:', e);
    const offlineish = !navigator.onLine || /fetch|network|timeout|Failed to fetch/i.test(e?.message || '');
    if (offlineish) {
      // เน็ตหลุด: ข้อมูลยังอยู่ในเครื่องและจะส่งให้เองเมื่อกลับมา ไม่ต้องตกใจ
      setConn('offline', e?.message || '');
      scheduleCloudReconnect();
    } else {
      toast(`บันทึก Cloud ไม่สำเร็จ · ${e.message || e}`, 'warn');
    }
    return false;
  } finally {
    FNB_CLOUD_SYNCING = false;
    if (FNB_SYNC_PENDING) { FNB_SYNC_PENDING = false; setTimeout(() => cloudSyncNow(false), 250); }
  }
}

// Commit งานสำคัญแบบ synchronous: รอ Cloud พร้อม, หยุด timer, เขียน + read-back ให้จบก่อนออกจากงาน
async function waitForCloudReady(timeoutMs = 10000) {
  if (FNB_CLOUD_READY && FNB_SB) return true;
  const started = Date.now();
  while (Date.now() - started < timeoutMs) {
    if (FNB_CLOUD_READY && FNB_SB) return true;
    await new Promise(r => setTimeout(r, 200));
  }
  return !!(FNB_CLOUD_READY && FNB_SB);
}

async function commitCurrentStateToCloud(reason = 'manual') {
  const ready = await waitForCloudReady();
  if (!ready) return false;
  clearTimeout(FNB_CLOUD_TIMER);
  for (let attempt = 0; attempt < 3; attempt++) {
    while (FNB_CLOUD_SYNCING) await new Promise(r => setTimeout(r, 150));
    const ok = await cloudSyncNow(false);
    if (ok) {
      await refreshCloudFromServer(`verify:${reason}`);
      return true;
    }
    if (attempt < 2) await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
  }
  return false;
}

// รวบการกดหลายครั้งให้ยิงขึ้น cloud ครั้งเดียว
// เดิมหน่วงแค่ 80ms ทำให้การตรวจ 1 ใบ (40 หัวข้อ) ยิง 40 ครั้ง
// และทุกครั้งจะถูก broadcast ไปหาทุกเครื่องที่เปิดอยู่
function scheduleCloudSync() {
  if (!FNB_CLOUD_READY) return;
  clearTimeout(FNB_CLOUD_TIMER);
  FNB_CLOUD_TIMER = setTimeout(() => cloudSyncNow(false), 1500);
}

// เด้งหน้าจอใหม่แบบรวบรอบ และไม่วาดทับตอนผู้ใช้กำลังพิมพ์
let FNB_RENDER_TIMER = null;
function requestRealtimeRender() {
  clearTimeout(FNB_RENDER_TIMER);
  FNB_RENDER_TIMER = setTimeout(() => {
    const ae = document.activeElement;
    const typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
    const inspecting = VIEW_STATE.page === 'inspection' && VIEW_STATE.inspection?.status !== 'done';
    if (typing || inspecting) { FNB_RENDER_TIMER = setTimeout(requestRealtimeRender, 2500); return; }
    softRender();
  }, 900);
}
let FNB_LOCAL_SAVE_TIMER = null;
function requestLocalSave() {
  clearTimeout(FNB_LOCAL_SAVE_TIMER);
  FNB_LOCAL_SAVE_TIMER = setTimeout(saveDataLocalOnly, 600);
}

function applyCloudRealtime(payload) {
  const row = payload.eventType === 'DELETE' ? payload.old : payload.new;
  if (!row) return;
  if (row.bucket === 'config') {
    if (payload.eventType === 'DELETE') return;
    if (CONFIG_SECTIONS.includes(row.item_id)) {
      const v = row.payload && row.payload.v !== undefined ? row.payload.v : row.payload;
      const prevC = FNB_CLOUD_CACHE.config && FNB_CLOUD_CACHE.config[row.item_id];
      const localPending = prevC !== undefined && jsonStable(configSectionValue(row.item_id)) !== jsonStable(prevC);
      if (!localPending) applyConfigSection(row.item_id, v);
      if (!FNB_CLOUD_CACHE.config) FNB_CLOUD_CACHE.config = {};
      FNB_CLOUD_CACHE.config[row.item_id] = JSON.parse(JSON.stringify(v));
      requestLocalSave();
      requestRealtimeRender();
      return;
    }
    if (row.item_id !== 'state') return;
    const p = row.payload || {};
    CONFIG_SECTIONS.forEach(s => {
      if (p[s] !== undefined) {
        applyConfigSection(s, p[s]);
        if (!FNB_CLOUD_CACHE.config) FNB_CLOUD_CACHE.config = {};
        FNB_CLOUD_CACHE.config[s] = JSON.parse(JSON.stringify(p[s]));
      }
    });
    requestLocalSave();
    requestRealtimeRender();
    return;
  } else if (row.bucket === 'inspections' || row.bucket === 'complaints') {
    const b = row.bucket, id = row.item_id, key = b + '|' + id;
    if (b === 'inspections' && (String(id).startsWith('LOADTEST_') || row.payload?.testRun)) return;
    const list = DATA[b] || (DATA[b] = []);
    if (payload.eventType === 'DELETE') {
      FNB_CLOUD_CACHE[b].delete(id); syncSeenDel(key);
      if (!SYNC_DIRTY.has(key)) { DATA[b] = list.filter(x => x.id !== id); SYNC_SNAP.delete(key); SYNC_PREV.delete(key); }
    } else {
      const R = row.payload; if (!R) return;
      FNB_CLOUD_CACHE[b].set(id, syncClone(R)); syncSeenAdd(key);
      const local = list.find(x => x.id === id);
      if (!local) { if (!SYNC_DEL.has(key)) { const c = syncClone(R); list.push(c); syncSnapSet(b, c); } }
      else if (SYNC_DIRTY.has(key)) { syncAssignInPlace(local, syncMergeItem(b, local, R)); syncSnapSet(b, local); scheduleCloudSync(); }
      else { syncAssignInPlace(local, R); syncSnapSet(b, local); }
    }
    syncPersist();
  }
  requestLocalSave();
  // รวบรอบการวาดหน้าจอ และไม่ขัดจังหวะตอนกำลังตรวจหรือกำลังพิมพ์
  requestRealtimeRender();
}

let FNB_QUOTA_WARNED = false;
function saveDataLocalOnly() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
    FNB_QUOTA_WARNED = false;
  } catch (e) {
    // localStorage เต็ม (ปกติ ~5MB) — เดิมเงียบสนิท ทำให้ข้อมูลออฟไลน์หายโดยไม่มีใครรู้
    console.error('saveDataLocalOnly failed:', e);
    if (trimLocalDataForQuota()) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); return; } catch (_) {}
    }
    if (!FNB_QUOTA_WARNED) {
      FNB_QUOTA_WARNED = true;
      toast('⚠️ พื้นที่เก็บในเครื่องเต็ม — ข้อมูลใหม่อาจไม่ถูกเก็บสำรอง กรุณาเชื่อมเน็ตเพื่อส่งขึ้น Cloud', 'warn');
    }
  }
}
// ตัดรูปในเครื่องของใบเก่าทิ้ง (รูปตัวจริงอยู่บน Cloud แล้ว) เพื่อให้มีที่ว่างพอบันทึก
function trimLocalDataForQuota() {
  const list = (DATA.inspections || []).slice().sort((a, b) => (a.completedAt || a.updatedAt || 0) - (b.completedAt || b.updatedAt || 0));
  let freed = false;
  for (const insp of list.slice(0, Math.ceil(list.length / 2))) {
    Object.values(insp.items || {}).forEach(v => {
      if (Array.isArray(v.photos) && v.photos.some(p => String(p).startsWith('data:'))) {
        v.photos = v.photos.filter(p => !String(p).startsWith('data:'));
        freed = true;
      }
    });
  }
  return freed;
}

function dataUrlToBlob(dataUrl) {
  const [meta, b64] = dataUrl.split(',');
  const mime = (meta.match(/data:([^;]+)/i) || [,'image/jpeg'])[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function getStoragePathFromPublicUrl(url) {
  if (!url || typeof url !== 'string') return null;
  const marker = `/storage/v1/object/public/${FNB_CLOUD.photoBucket}/`;
  const idx = url.indexOf(marker);
  if (idx < 0) return null;
  try { return decodeURIComponent(url.slice(idx + marker.length).split('?')[0]); } catch (_) { return url.slice(idx + marker.length).split('?')[0]; }
}

function getManagerPhotos(item) {
  if (!item) return [];
  if (Array.isArray(item.photos)) return item.photos.filter(Boolean);
  return item.photo ? [item.photo] : [];
}
function getExecPhotos(er) {
  if (!er) return [];
  const arr = Array.isArray(er.execPhotos) ? er.execPhotos.filter(Boolean) : [];
  if (er.execPhoto && !arr.includes(er.execPhoto)) arr.push(er.execPhoto);
  return arr;
}
function getManagerEvidence(item) {
  const urls = getManagerPhotos(item);
  const meta = Array.isArray(item?.photoEvidence) ? item.photoEvidence : [];
  return urls.map((url, idx) => meta[idx] || ({ url, path: getStoragePathFromPublicUrl(url), uploadedAt: null, uploadedBy: null, uploadedByName: null, stage: 'manager' }));
}
function getExecEvidence(er) {
  const urls = getExecPhotos(er);
  const meta = Array.isArray(er?.execEvidence) ? er.execEvidence : [];
  return urls.map((url, idx) => meta[idx] || ({ url, path: getStoragePathFromPublicUrl(url), uploadedAt: null, uploadedBy: null, uploadedByName: null, stage: 'executive' }));
}

async function uploadPhotoToCloud(dataUrl, inspectionId, itemId, stage='manager') {
  if (!FNB_CLOUD_READY || !FNB_SB) {
    throw new Error('Cloud ยังไม่พร้อม — กรุณารอให้ขึ้นว่า Cloud พร้อมใช้งาน');
  }
  const safeStage = stage === 'executive' ? 'executive' : 'manager';
  const path = `inspections/${inspectionId}/${itemId}/${safeStage}/${uid()}.jpg`;
  const blob = dataUrlToBlob(dataUrl);

  const bucket = FNB_SB.storage.from(FNB_CLOUD.photoBucket);
  const { error } = await bucket.upload(path, blob, {
    contentType: 'image/jpeg',
    cacheControl: '31536000',
    upsert: false
  });
  if (error) throw new Error(`Storage upload: ${error.message || error}`);

  // Preferred: permanent public URL. The setup SQL makes fnb-photos public.
  const { data: pub } = bucket.getPublicUrl(path);
  const publicUrl = pub?.publicUrl;
  if (!publicUrl) throw new Error('อัปโหลดแล้วแต่ไม่พบ Public URL ของรูป');

  // Verify the URL can actually be fetched. This catches the common case
  // where the bucket is still private or the Storage policy was not applied.
  try {
    const probe = await fetch(publicUrl, { method: 'HEAD', cache: 'no-store' });
    if (probe.ok) return { url: publicUrl, path, storageMode: 'public' };
  } catch (_) {}

  // Fallback for an accidentally-private bucket: keep the image visible now.
  // A long-lived signed URL is only a fallback; production should use the
  // public fnb-photos bucket configured by fnb-supabase-setup.sql.
  try {
    const { data: signed, error: signedError } = await bucket.createSignedUrl(path, 60 * 60 * 24 * 365);
    if (!signedError && signed?.signedUrl) {
      return { url: signed.signedUrl, path, storageMode: 'signed' };
    }
  } catch (_) {}

  throw new Error('อัปโหลดสำเร็จแต่เปิดรูปไม่ได้ — ตรวจ Bucket fnb-photos ให้เป็น Public และใช้ SQL setup ล่าสุด');
}

/* ===================== คิวรูปภาพรอส่ง =====================
   เดิม: ถ่ายรูปแล้วอัปโหลดทันที ถ้าเน็ตสะดุดคือรูปหายเลย ต้องถ่ายใหม่
   ใหม่: เก็บรูปที่ย่อแล้วไว้ในเครื่อง แล้วส่งให้เองเมื่อเน็ตกลับมา       */
const PHOTO_QUEUE_KEY = `${STORAGE_KEY}:photoQueue`;
const PHOTO_QUEUE_MAX = 500;

// คิวรูปเก็บใน IndexedDB (จุได้มากกว่า localStorage หลายเท่า และใช้ได้ทั้ง iOS / Android / คอม)
const PQ = { db: null, mem: [], ready: false };
function pqOpen() {
  return new Promise(res => {
    try {
      if (!window.indexedDB) return res(null);
      const r = indexedDB.open('fnb_photo_queue', 1);
      r.onupgradeneeded = () => { try { r.result.createObjectStore('q', { keyPath: 'qid' }); } catch (_) {} };
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
      setTimeout(() => res(null), 4000);
    } catch (_) { res(null); }
  });
}
function pqTx(mode, fn) {
  return new Promise(res => {
    try { const tx = PQ.db.transaction('q', mode); const st = tx.objectStore('q'); const out = fn(st); tx.oncomplete = () => res(out && out.result !== undefined ? out.result : true); tx.onerror = () => res(null); tx.onabort = () => res(null); }
    catch (_) { res(null); }
  });
}
async function pqInit() {
  if (PQ.ready) return;
  let legacy = [];
  try { legacy = JSON.parse(localStorage.getItem(PHOTO_QUEUE_KEY) || '[]'); if (!Array.isArray(legacy)) legacy = []; } catch (_) {}
  PQ.db = await pqOpen();
  if (PQ.db) {
    const all = await pqTx('readonly', st => st.getAll());
    PQ.mem = Array.isArray(all) ? all.sort((a, b) => (a.ts || 0) - (b.ts || 0)) : [];
    for (const e of legacy) if (e && e.qid && !PQ.mem.some(x => x.qid === e.qid)) { PQ.mem.push(e); await pqTx('readwrite', st => st.put(e)); }
    try { localStorage.removeItem(PHOTO_QUEUE_KEY); } catch (_) {}
  } else {
    PQ.mem = legacy;
  }
  PQ.ready = true;
  FNB_CONN.pendingPhotos = PQ.mem.length;
  paintConnChip();
}
function readPhotoQueue() { return PQ.mem.slice(); }
function writePhotoQueue(q) {
  const keep = new Set(q.map(x => x.qid));
  const removed = PQ.mem.filter(x => !keep.has(x.qid));
  const added = q.filter(x => !PQ.mem.some(m => m.qid === x.qid));
  PQ.mem = q.slice(-PHOTO_QUEUE_MAX);
  if (PQ.db) {
    pqTx('readwrite', st => { removed.forEach(x => st.delete(x.qid)); added.forEach(x => st.put(x)); });
  } else {
    try { localStorage.setItem(PHOTO_QUEUE_KEY, JSON.stringify(PQ.mem.slice(-40))); }
    catch (_) { try { localStorage.setItem(PHOTO_QUEUE_KEY, JSON.stringify(PQ.mem.slice(-10))); } catch (__) {} }
  }
  FNB_CONN.pendingPhotos = PQ.mem.length;
  paintConnChip();
}
function enqueuePhoto(entry) {
  const q = readPhotoQueue();
  q.push(entry);
  writePhotoQueue(q);
}
function pendingPhotosFor(inspectionId, itemId, stage) {
  return readPhotoQueue().filter(p => p.inspectionId === inspectionId && p.itemId === itemId && (!stage || p.stage === stage));
}

let FNB_PHOTO_QUEUE_RUNNING = false;
async function flushPhotoQueue() {
  if (!PQ.ready) await pqInit();
  if (FNB_PHOTO_QUEUE_RUNNING || !FNB_CLOUD_READY || !FNB_SB) return;
  let q = readPhotoQueue();
  if (!q.length) { FNB_CONN.pendingPhotos = 0; paintConnChip(); return; }
  FNB_PHOTO_QUEUE_RUNNING = true;
  let sent = 0;
  try {
    for (const entry of q.slice()) {
      try {
        const asset = await uploadPhotoToCloud(entry.dataUrl, entry.inspectionId, entry.itemId, entry.stage);
        attachUploadedAsset(entry, asset);
        q = readPhotoQueue().filter(x => x.qid !== entry.qid);
        writePhotoQueue(q);
        sent++;
      } catch (e) {
        console.warn('ส่งรูปที่ค้างไม่สำเร็จ จะลองใหม่ภายหลัง:', e?.message || e);
        break; // เน็ตยังไม่ดี หยุดไว้ก่อน ไม่ทิ้งรูป
      }
    }
  } finally {
    FNB_PHOTO_QUEUE_RUNNING = false;
  }
  if (sent) {
    saveData();
    softRender();
    toast(`📤 ส่งรูปที่ค้างขึ้น Cloud แล้ว ${sent} รูป`, 'success');
  }
}

// เอา URL ที่อัปโหลดสำเร็จ ใส่กลับเข้าใบตรวจที่ถูกต้อง
function attachUploadedAsset(entry, asset) {
  const insp = (DATA.inspections || []).find(x => x.id === entry.inspectionId)
    || (VIEW_STATE.inspection?.id === entry.inspectionId ? VIEW_STATE.inspection : null);
  if (!insp) return;
  if (entry.stage === 'executive') {
    if (!insp.execReview) insp.execReview = { items: {} };
    if (!insp.execReview.items) insp.execReview.items = {};
    const er = insp.execReview.items[entry.itemId] || (insp.execReview.items[entry.itemId] = {});
    if (!Array.isArray(er.execPhotos)) er.execPhotos = getExecPhotos(er);
    if (!Array.isArray(er.execEvidence)) er.execEvidence = [];
    er.execPhotos.push(asset.url);
    er.execPhoto = asset.url;
    er.execEvidence.push({ url: asset.url, path: asset.path, storageMode: asset.storageMode || 'public',
      stage: 'executive', uploadedAt: entry.ts, uploadedBy: entry.userId, uploadedByName: entry.userName });
  } else {
    if (!insp.items) insp.items = {};
    const it = insp.items[entry.itemId] || (insp.items[entry.itemId] = {});
    if (!Array.isArray(it.photos)) it.photos = [];
    if (!Array.isArray(it.photoEvidence)) it.photoEvidence = [];
    it.photos.push(asset.url);
    it.photoEvidence.push({ url: asset.url, path: asset.path, storageMode: asset.storageMode || 'public',
      stage: 'manager', uploadedAt: entry.ts, uploadedBy: entry.userId, uploadedByName: entry.userName });
  }
}

function queuePhotoDeletion(paths) {
  const clean = Array.from(new Set((paths || []).filter(Boolean)));
  if (!clean.length) return;
  try {
    const key = `${STORAGE_KEY}:photoCleanup`;
    const old = JSON.parse(localStorage.getItem(key) || '[]');
    localStorage.setItem(key, JSON.stringify(Array.from(new Set(old.concat(clean))).slice(-5000)));
  } catch (_) {}
  setTimeout(() => flushPhotoDeletionQueue(), 300);
}

async function flushPhotoDeletionQueue() {
  if (!FNB_CLOUD_READY || !FNB_SB || FNB_PHOTO_CLEANUP_RUNNING) return;
  FNB_PHOTO_CLEANUP_RUNNING = true;
  try {
    const key = `${STORAGE_KEY}:photoCleanup`;
    const queue = JSON.parse(localStorage.getItem(key) || '[]');
    if (!Array.isArray(queue) || !queue.length) return;
    for (let i = 0; i < queue.length; i += 50) {
      const batch = queue.slice(i, i + 50);
      const { error } = await FNB_SB.storage.from(FNB_CLOUD.photoBucket).remove(batch);
      if (error) throw error;
    }
    localStorage.removeItem(key);
  } catch (e) {
    console.warn('Photo cleanup failed:', e);
  } finally {
    FNB_PHOTO_CLEANUP_RUNNING = false;
  }
}

function compactExpiredInspectionPhotos() {
  const days = DATA.settings?.compactDays || 30;
  const cutoff = Date.now() - days * 86400000;
  const paths = [];
  (DATA.inspections || []).forEach(i => {
    // เดิมใช้ (completedAt || 0) ทำให้ใบที่ยังตรวจไม่เสร็จ (ยังไม่มี completedAt) ถูกล้างรูปทันทีหลังแนบ
    if (i.status !== 'done') return;
    const doneAt = Number(i.completedAt || i.updatedAt || i.createdAt || Date.now());
    if (doneAt >= cutoff || !i.items || i._compacted) return;
    let managerCount = 0, executiveCount = 0;
    Object.values(i.items).forEach(v => {
      const mgrEv = getManagerEvidence(v);
      managerCount += mgrEv.length;
      mgrEv.forEach(x => { if (x.path) paths.push(x.path); });
      if (Array.isArray(v.photos)) v.photos = [];
      if (Array.isArray(v.photoEvidence)) v.photoEvidence = [];
    });
    Object.values(i.execReview?.items || {}).forEach(er => {
      const exEv = getExecEvidence(er);
      executiveCount += exEv.length;
      exEv.forEach(x => { if (x.path) paths.push(x.path); });
      er.execPhotos = [];
      er.execEvidence = [];
      er.execPhoto = null;
    });
    if (managerCount || executiveCount) {
      i.photoRetention = {
        policyDays: days,
        compactedAt: Date.now(),
        managerPhotosRemoved: managerCount,
        executivePhotosRemoved: executiveCount
      };
      i._compacted = true;
      i._compactedAt = Date.now();
    }
  });
  if (paths.length) queuePhotoDeletion(paths);
}

function isLoadTestInspection(item) {
  const id = String(item?.id || item?.item_id || '');
  return item?.testRun === true || item?.inspectorId === 'load-test' || id.startsWith('LOADTEST_') || id.startsWith('loadtest-');
}

let DATA = loadData();
let SESSION = { user: null };

function loadData() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const p = JSON.parse(s);
      if (!p.users?.length) p.users = JSON.parse(JSON.stringify(DEFAULT_DATA.users));
      if (!p.hotels?.length) p.hotels = JSON.parse(JSON.stringify(DEFAULT_DATA.hotels));
      if (!p.checklists) p.checklists = JSON.parse(JSON.stringify(DEFAULT_CHECKLISTS));
      if (!p.checklists.main) p.checklists.main = JSON.parse(JSON.stringify(DEFAULT_CHECKLISTS.main));
      if (!p.shifts?.length) p.shifts = JSON.parse(JSON.stringify(DEFAULT_SHIFTS));
      if (!p.outletChecklists) p.outletChecklists = {};
      if (!p.inspections) p.inspections = [];
      if (!p.complaints) p.complaints = [];
      if (!p.settings) p.settings = { autoCompact: true, compactDays: 30 };
      // Never mix synthetic LOADTEST rows into operational F&B history.
      p.inspections = p.inspections.filter(i => !isLoadTestInspection(i));
      // Migrate old inspections: ensure tables + executive review state exist.
      // Historical completed inspections without execReview must remain reviewable.
      p.inspections.forEach(i => {
        if (!i.tables) i.tables = [];
        if (i.status === 'done' && (!i.execReview || !i.execReview.status)) {
          i.execReview = { status: 'pending' };
        }
      });
      return p;
    }
  } catch(e) { console.warn(e); }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
let _saveQuotaWarned = false;
function saveData() {
  try {
    // Auto-compact if enabled: strip inspection evidence photos after the configured retention window.
    // Metadata, scores, notes, review decisions and photo counts remain for KPI/audit reporting.
    if (DATA.settings?.autoCompact !== false) {
      compactExpiredInspectionPhotos();
    }
    try { syncTrack(); } catch (e) { console.warn('syncTrack', e); }
    const json = JSON.stringify(DATA);
    localStorage.setItem(STORAGE_KEY, json);
    _saveQuotaWarned = false;
    scheduleCloudSync();
  } catch(e) {
    console.warn('saveData failed:', e);
    if (!_saveQuotaWarned) {
      _saveQuotaWarned = true;
      // Try more aggressive compaction as fallback
      try {
        const stripped = JSON.parse(JSON.stringify(DATA));
        stripped.inspections?.forEach(i => {
          if (i.items) Object.values(i.items).forEach(v => { v.photos = []; v.photoEvidence = []; });
          if (i.execReview?.items) Object.values(i.execReview.items).forEach(v => { v.execPhotos = []; v.execEvidence = []; v.execPhoto = null; });
          i._compacted = true;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stripped));
        // Update actual DATA to match
        DATA.inspections.forEach(i => {
          if (i.items) Object.values(i.items).forEach(v => { v.photos = []; v.photoEvidence = []; });
          if (i.execReview?.items) Object.values(i.execReview.items).forEach(v => { v.execPhotos = []; v.execEvidence = []; v.execPhoto = null; });
          i._compacted = true;
        });
        toast('⚠️ พื้นที่เก็บใกล้เต็ม — ลบรูปเก่าให้อัตโนมัติแล้ว · Storage full: photos compacted', 'warn');
      } catch(e2) {
        toast('❌ บันทึกไม่ได้ — ใช้ Admin > Data > Clear เก่าออก · Cannot save: clear old data', 'warn');
      }
      scheduleCloudSync();
    }
  }
}
function getStorageInfo() {
  try {
    const size = localStorage.getItem(STORAGE_KEY)?.length || 0;
    return { sizeMB: (size/1024/1024).toFixed(2), pct: Math.round(size/5242880*100) };
  } catch(e) { return { sizeMB: '?', pct: 0 }; }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function toast(msg, kind='success') {
  const el = document.createElement('div');
  el.className = 'toast';
  const bg = { success:'linear-gradient(135deg,#6fbc85,#4a9660)', warn:'linear-gradient(135deg,#f0b862,#8b6820)', error:'linear-gradient(135deg,#e66b70,#b8383e)', info:'linear-gradient(135deg,#7aacd6,#4d80ad)' };
  el.style.background = bg[kind] || bg.success;
  const ic = { success:'✓', warn:'⚠', error:'✕', info:'ℹ' };
  el.innerHTML = `<span style="font-size:16px">${ic[kind]||ic.success}</span> ${msg}`;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// จำตำแหน่งเลื่อนของหน้าที่ออกมา เพื่อคืนให้ตอนกดย้อนกลับ (เช่น ยกเลิกการตรวจ → กลับรายการห้องอาหารที่เลื่อนค้างไว้)
let NAV_STACK = [];
let _restoreScrollY = null;
let _lastRenderedPage = null;
function nav(page, extra={}) {
  const isPageChange = VIEW_STATE.page !== page;
  _restoreScrollY = null;
  if (isPageChange) {
    if (page === 'login') NAV_STACK = [];
    else {
      const top = NAV_STACK[NAV_STACK.length - 1];
      if (top && top.page === page) { NAV_STACK.pop(); _restoreScrollY = top.y; }   // ย้อนกลับ → คืนตำแหน่งเดิม
      else if (VIEW_STATE.page && VIEW_STATE.page !== 'login') {
        NAV_STACK.push({ page: VIEW_STATE.page, y: window.scrollY });                // ไปหน้าใหม่ → จำของหน้านี้ไว้
        if (NAV_STACK.length > 20) NAV_STACK.shift();
      }
    }
  }
  VIEW_STATE = { ...VIEW_STATE, page, ...extra };
  _forceScrollTop = isPageChange && _restoreScrollY === null;
  render();
  // History/report pages are shared views: always pull the newest cloud rows when opened.
  if ((page === 'history' || page === 'summary' || page === 'kpi' || page === 'dailySummary') && FNB_CLOUD_READY) {
    refreshCloudFromServer(`nav:${page}`);
  }

let _lastScrollAt = 0, _touchActive = false, _softRenderTimer = null;
window.addEventListener('scroll', () => { _lastScrollAt = Date.now(); }, { passive: true });
document.addEventListener('touchstart', () => { _touchActive = true; }, { passive: true });

function softRender() {
  const ae = document.activeElement;

  if (typing || _touchActive || Date.now() - _lastScrollAt < 700) {

function render() {
  try {
    const app = document.getElementById('app');
    if (!SESSION.user && VIEW_STATE.page !== 'login') VIEW_STATE.page = 'login';
    // เล่น fade-in เฉพาะตอนเปลี่ยนหน้า — re-render เฉยๆ (กดปุ่ม/ sync cloud) ต้องไม่กะพริบ
    const pageChanged = _forceScrollTop || _lastRenderedPage !== VIEW_STATE.page;
    app.classList.toggle('no-anim', !pageChanged);
    // ล็อกความสูงไว้ชั่วขณะตอนสลับ innerHTML ไม่งั้นเอกสารหดเป็น 0 แล้ว iOS ดีดตำแหน่งเลื่อน
    if (!pageChanged) app.style.minHeight = app.offsetHeight + 'px';
    // Preserve scroll + focus across re-renders (kills "หน้าเด้ง" bug)
    const scrollY = window.scrollY;
    // Preserve horizontal scroll positions of all scrollable tab bars
    const hScrolls = [];
    document.querySelectorAll('.scroll-hide').forEach(el => {
      if (el.scrollLeft > 0 || el.scrollWidth > el.clientWidth) {
        // Track by key: page + first-child-text hash so we can match after re-render
        const key = (el.getAttribute('data-scroll-key')) ||
                    (VIEW_STATE.page + '|' + (el.firstElementChild?.textContent?.slice(0,40) || '') + '|' + el.children.length);
        hScrolls.push({ key, scrollLeft: el.scrollLeft });
      }
    });
    const focused = document.activeElement;
    const focusInfo = focused && focused !== document.body ? {
      itemId: focused.dataset?.itemId, field: focused.dataset?.field,
      cfield: focused.dataset?.cfield, tfield: focused.dataset?.tfield,
      tableId: focused.dataset?.tableId,
      id: focused.id,
      selStart: focused.selectionStart, selEnd: focused.selectionEnd,
    } : null;
    const views = { login: renderLogin, home: renderHome, outlets: renderOutlets, inspection: renderInspection, summary: renderSummary, history: renderHistory, kpi: renderKPI, testHistory: renderTestHistory, admin: renderAdmin, complaints: renderComplaints, complaintForm: renderComplaintForm, execReview: renderExecReview, dailySummary: renderDailySummary };
    app.innerHTML = (views[VIEW_STATE.page] || renderLogin)();
    if (VIEW_STATE.page === 'kpi') setTimeout(drawKPI, 50);
    // Restore scroll and focus
    if (_forceScrollTop) { window.scrollTo(0, 0); _forceScrollTop = false; }
    else if (_restoreScrollY !== null) { window.scrollTo(0, _restoreScrollY); _restoreScrollY = null; }
    else window.scrollTo(0, scrollY);
    _lastRenderedPage = VIEW_STATE.page;
    // Restore horizontal scroll positions on tab bars
    requestAnimationFrame(() => {
      app.style.minHeight = '';
      document.querySelectorAll('.scroll-hide').forEach(el => {
        const key = (el.getAttribute('data-scroll-key')) ||
                    (VIEW_STATE.page + '|' + (el.firstElementChild?.textContent?.slice(0,40) || '') + '|' + el.children.length);
        const match = hScrolls.find(h => h.key === key);
        if (match) el.scrollLeft = match.scrollLeft;
        // Additionally, scroll active tab into view
        const active = el.querySelector('.tab-btn.active');
        if (active && !match) {
          try {
            const elRect = el.getBoundingClientRect();
            const actRect = active.getBoundingClientRect();
            if (actRect.left < elRect.left || actRect.right > elRect.right) {
              el.scrollLeft += (actRect.left - elRect.left) - (elRect.width - actRect.width) / 2;
            }
          } catch(_) {}
        }
      });
    });
    if (focusInfo) {
      let el = null;
      if (focusInfo.id) el = document.getElementById(focusInfo.id);
      else if (focusInfo.field && focusInfo.itemId) el = document.querySelector(`[data-field="${focusInfo.field}"][data-item-id="${focusInfo.itemId}"]`);
      else if (focusInfo.tfield && focusInfo.tableId) el = document.querySelector(`[data-tfield="${focusInfo.tfield}"][data-table-id="${focusInfo.tableId}"]`);
      else if (focusInfo.field) el = document.querySelector(`[data-field="${focusInfo.field}"]`);
      else if (focusInfo.cfield) el = document.querySelector(`[data-cfield="${focusInfo.cfield}"]`);
      if (el) {
        try { el.focus(); if (focusInfo.selStart != null && el.setSelectionRange) el.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); } catch(_) {}
      }
    }
    closeModal();
    paintConnChip();
  } catch(e) {
    console.error(e);
    try { document.getElementById('app').style.minHeight = ''; } catch(_) {}
    document.getElementById('app').innerHTML = `<div style="padding:40px;background:#faf5e8;color:#1a1611;min-height:100vh"><h2 style="color:#dc2626">เกิดข้อผิดพลาด</h2><pre style="background:#fee2e2;padding:16px;border-radius:12px;overflow:auto;font-size:12px">${(e.stack||e.message).replace(/</g,'&lt;')}</pre></div>`;
  }
}

// EVENT ACTION DISPATCHER — desktop + touch clicks
function handleAction(e) {
  try {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    if (!a || a === 'noop') return;
    if (el._acted && Date.now() - el._acted < 400) return;
    el._acted = Date.now();
    if (e.type === 'click' && e.cancelable) e.preventDefault();
    if (typeof ACTIONS !== 'undefined' && ACTIONS[a]) ACTIONS[a](el.dataset, el, e);
    else if (typeof toast === 'function') toast('ไม่พบ action: '+a, 'error');
  } catch (err) {
    console.error('handleAction error:', err);
    if (typeof toast === 'function') toast('ผิดพลาด: '+err.message, 'error');
  }
}

// EVENT DELEGATION — touch-safe
// A finger drag must remain a scroll, never an accidental outlet/action click.
// On PointerEvent-capable browsers pointerup handles touch; touchend is only a
// legacy fallback. Clicks generated after touch are suppressed for 800ms.
let _lastTouchActAt = 0;
let _touchStartX = 0;
let _touchStartY = 0;
let _touchMoved = false;
let _touchPointerActive = false;
const TOUCH_MOVE_THRESHOLD = 12;

document.addEventListener('touchstart', function(e) {
  const t = e.touches?.[0];
  if (!t) return;
  _touchStartX = t.clientX;
  _touchStartY = t.clientY;
  _touchMoved = false;
  _touchPointerActive = !!window.PointerEvent;
}, {passive:true});

document.addEventListener('touchmove', function(e) {
  const t = e.touches?.[0];
  if (!t) return;
  if (Math.abs(t.clientX - _touchStartX) > TOUCH_MOVE_THRESHOLD ||
      Math.abs(t.clientY - _touchStartY) > TOUCH_MOVE_THRESHOLD) {
    _touchMoved = true;
  }
}, {passive:true});

document.addEventListener('pointerup', function(e) {
  if (e.pointerType === 'mouse') return;
  if (_touchMoved) {
    _touchMoved = false;
    _touchPointerActive = false;
    return;
  }
  const el = e.target.closest('[data-action]');
  if (!el || !el.dataset.action || el.dataset.action === 'noop') return;
  if (Date.now() - _lastTouchActAt < 800) return;
  _lastTouchActAt = Date.now();
  handleAction(e);
  _touchPointerActive = false;
}, {passive:true});

document.addEventListener('touchend', function(e) {
  // Modern browsers already handled the gesture through pointerup.
  if (_touchPointerActive) {
    _touchPointerActive = false;
    _touchMoved = false;
    return;
  }
  if (_touchMoved) {
    _touchMoved = false;
    return;
  }
  const el = e.target.closest('[data-action]');
  if (!el || !el.dataset.action || el.dataset.action === 'noop') return;
  if (Date.now() - _lastTouchActAt < 800) return;
  _lastTouchActAt = Date.now();
  handleAction(e);
}, {passive:true});

document.addEventListener('click', function(e) {
  if (Date.now() - _lastTouchActAt < 800) return;
  handleAction(e);
}, false);

  if (e.target.id === 'login-form') { e.preventDefault(); doLogin(); }

// LOGIN
// รหัสผ่านถูกเก็บเป็นค่า hash (SHA-256 + salt) แทนตัวอักษรเปล่า
// เดิมเปิด View Source ก็อ่านรหัสของทุกคนได้ทันที
const PW_SALT = 'fnb-standards-2569';
async function hashPassword(plain) {
  try {
    const buf = new TextEncoder().encode(PW_SALT + ':' + plain);
    const digest = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (_) {
    return null; // เบราว์เซอร์เก่า/เปิดผ่าน http — ถอยไปเทียบแบบเดิม
  }
}
function isHashed(v) { return typeof v === 'string' && /^[0-9a-f]{64}$/.test(v); }
async function passwordMatches(user, plain) {
  const stored = user.passwordHash || user.password;
  if (!stored) return false;
  if (isHashed(stored)) {
    const h = await hashPassword(plain);
    return h !== null && h === stored;
  }
  return stored === plain; // ข้อมูลเก่าที่ยังเป็นตัวอักษรเปล่า
}

async function doLogin() {
  const u = (document.getElementById('login-user')?.value||'').trim().toLowerCase();
  const p = (document.getElementById('login-pass')?.value||'').trim();
  const err = document.getElementById('login-err');
  if (!u || !p) { if (err) { err.textContent='กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'; err.style.display='block'; } return; }
  const candidate = DATA.users.find(x => x.username.toLowerCase() === u);
  const ok = candidate ? await passwordMatches(candidate, p) : false;
  if (!ok) { if (err) { err.textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'; err.style.display='block'; } return; }
  SESSION.user = candidate;
  toast(`ยินดีต้อนรับ ${candidate.name} 👋`);
  nav('home');
}

          <div class="mt-4 pt-4" style="border-top:1px solid #f5f5f4">
            <button type="button" data-action="pickInspectionType" data-hotel-id="${h.id}" data-outlet-id="${o.id}" class="btn-secondary outlet-start-btn w-full" style="color:#ea580c;border-color:#f1d5a5;font-weight:700">
              ▶ เริ่มตรวจ · Start
            </button>
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function countOutletInsps(hid, oid) {
  return DATA.inspections.filter(i => i.hotelId===hid && i.outletId===oid && i.status==='done').length;
}

function showInspectionTypeModal(hotelId, outletId) {
  const h = DATA.hotels.find(x => x.id === hotelId);
  const o = h?.outlets.find(x => x.id === outletId);
  openModal(`
  <div class="p-6">
    <div class="mb-6 text-center">
      <div class="text-lg font-bold mb-1" style="color:#1c1917">เลือกประเภทการตรวจ · Select Inspection Type</div>
      <div class="text-xs" style="color:#78716c">${o?.name} · ${o?.floor}</div>
    </div>
    <div class="space-y-3">
      ${Object.entries(INSPECTION_TYPES).map(([k,t]) => `
        <div data-action="startInspection" data-hotel-id="${hotelId}" data-outlet-id="${outletId}" data-type="${k}" class="card-hover rounded-2xl p-5 relative overflow-hidden" style="background:linear-gradient(135deg,#fb923c,#ea580c,#c2410c);color:white;cursor:pointer;box-shadow:0 12px 24px rgba(234,88,12,0.3)">
          <div class="flex items-center gap-4">
            <div class="text-4xl">${t.icon}</div>
            <div class="flex-1">
              <div class="text-lg font-bold">${t.label}</div>
              <div class="text-xs opacity-90">${t.desc}</div>
            </div>
            <div class="text-2xl">→</div>
          </div>
        </div>
      `).join('')}
    </div>
    <button data-action="closeModal" class="btn-secondary w-full mt-4">ยกเลิก · Cancel</button>
  </div>`);
}

// INSPECTION
function renderInspection() {
  const h = DATA.hotels.find(x => x.id === VIEW_STATE.hotelId);
  const o = h?.outlets.find(x => x.id === VIEW_STATE.outletId);
  if (!h || !o) return renderHome();
  const type = VIEW_STATE.inspectionType || 'main';
  const typeCfg = INSPECTION_TYPES[type] || INSPECTION_TYPES.main;
  const checklists = getChecklistForOutlet(o.id);
  const shifts = DATA.shifts || DEFAULT_SHIFTS;
  if (!VIEW_STATE.inspection) {
    // Determine current shift by time
    const nowH = new Date().getHours();
    const defaultShift = shifts.find(s => {
      const [sh,sm] = s.start.split(':').map(Number);
      const [eh,em] = s.end.split(':').map(Number);
      const cur = nowH*60 + new Date().getMinutes();
      return cur >= sh*60+sm && cur < eh*60+em;
    }) || shifts[0];
    VIEW_STATE.inspection = {
      id: uid(), type, hotelId: h.id, outletId: o.id,
      inspectorId: SESSION.user.id, inspectorName: SESSION.user.name, inspectorRole: SESSION.user.role,
      responsibleName: '', responsibleRole: 'Manager',
      date: new Date().toISOString().slice(0,10),
      time: new Date().toTimeString().slice(0,5),
      shiftId: defaultShift.id,
      shift: `${defaultShift.name} · ${defaultShift.nameTh}`,
      shiftStart: defaultShift.start, shiftEnd: defaultShift.end,
      generalNote: '', items: {}, tables: [], activeTab: checklists[0]?.id, status: 'draft', execReview: null,
    };
    checklists.forEach(cl => cl.items.forEach(it => {
      VIEW_STATE.inspection.items[it.id] = { status: null, note: '', photos: [] };
    }));
  }
  const insp = VIEW_STATE.inspection;
  // Ensure items array structure has photos array (migrate old ones)
  Object.values(insp.items).forEach(v => { if (!v.photos) v.photos = v.photo ? [v.photo] : []; if (v.photo !== undefined) delete v.photo; });
  if (!insp.tables) insp.tables = [];
  const activeCl = checklists.find(c => c.id === insp.activeTab) || checklists[0];
  const totals = calcInspectionProgress(insp);
  const isEditingSaved = insp.status === 'done';
  return `
  ${topbar()}
  <div class="max-w-4xl mx-auto px-4 pb-32 fade-in">
    <div class="flex items-center justify-between gap-2 mb-4 flex-wrap">
      <button data-action="cancelInspection" class="btn-secondary">← ${isEditingSaved?'กลับ · Back':'ยกเลิก · Cancel'}</button>
      ${isEditingSaved?`<span class="badge badge-gold">✏️ กำลังแก้ไข · Editing</span>`:''}
    </div>

    <div class="rounded-3xl p-5 mb-4 relative overflow-hidden" style="background:linear-gradient(135deg,#f4dfa8,#d4af6c 45%,#8b6820);box-shadow:0 14px 34px rgba(139,104,32,0.25)">
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0 flex-1">
          <div class="text-white/90 text-xs font-semibold" style="letter-spacing:0.1em;text-transform:uppercase">${typeCfg.icon} ${typeCfg.label}</div>
          <div class="text-white text-xl font-bold truncate display-font">${o.name}</div>
          <div class="text-white/85 text-xs">${h.name} · ${o.floor}</div>
        </div>
        <div class="text-right shrink-0">
          <div class="text-white/80 text-xs">คืบหน้า · Progress</div>
          <div class="text-white text-3xl font-bold" data-progress-count>${totals.answered}/${totals.total}</div>
          <div class="w-32 mt-2 progress-bar" style="background:rgba(255,255,255,0.25)">
            <div class="progress-fill" data-progress-fill style="width:${(totals.answered/totals.total)*100}%;background:linear-gradient(90deg,#fff,#faf5e8)"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Shift Selector -->
    <div class="card p-4 mb-4">
      <label class="text-xs mb-2 block font-semibold" style="color:#5c5138;letter-spacing:0.05em">☀️ รอบการตรวจ · Meal Shift</label>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
        ${shifts.map(s => `
          <button data-action="selectShift" data-shift-id="${s.id}" class="rounded-xl p-3 text-center transition" style="border:2px solid ${insp.shiftId===s.id?'#b8892f':'#ecdcb7'};background:${insp.shiftId===s.id?'linear-gradient(135deg,#faf5e8,#f2e6c8)':'#fff'};cursor:pointer">
            <div class="text-2xl mb-1">${s.icon}</div>
            <div class="text-xs font-semibold" style="color:${insp.shiftId===s.id?'#8b6820':'#1a1611'}">${s.name}</div>
            <div class="text-xs" style="color:#5c5138">${s.nameTh}</div>
            <div class="text-xs mt-1" style="color:#5c5138;font-weight:600">${s.start}-${s.end}</div>
          </button>
        `).join('')}
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" style="padding-top:12px;border-top:1px dashed #f2e6c8">
        <div><label class="text-xs mb-1 block font-semibold" style="color:#5c5138">📅 วันที่ · Date</label><input type="date" data-field="date" value="${insp.date}"></div>
        <div><label class="text-xs mb-1 block font-semibold" style="color:#5c5138">🕐 เวลา · Time</label><input type="time" data-field="time" value="${insp.time}"></div>
        <div><label class="text-xs mb-1 block font-semibold" style="color:#5c5138">⏰ เริ่ม · Start</label><input type="time" data-field="shiftStart" value="${insp.shiftStart||''}"></div>
        <div><label class="text-xs mb-1 block font-semibold" style="color:#5c5138">⏱️ ถึง · End</label><input type="time" data-field="shiftEnd" value="${insp.shiftEnd||''}"></div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-3" style="padding-top:12px;border-top:1px dashed #f2e6c8">
        <div><label class="text-xs mb-1 block font-semibold" style="color:#5c5138">👤 ผู้ตรวจ · Inspector</label><input value="${insp.inspectorName}" disabled></div>
        <div class="sm:col-span-1"><label class="text-xs mb-1 block" style="color:#8b6820;font-weight:600">⭐ ผู้รับผิดชอบ · Manager</label><input data-field="responsibleName" placeholder="ชื่อ-นามสกุล..." value="${(insp.responsibleName||'').replace(/"/g,'&quot;')}" style="background:#faf5e8"></div>
        <div><label class="text-xs mb-1 block" style="color:#8b6820;font-weight:600">ตำแหน่ง · Role</label>
          <select data-field="responsibleRole">${['Manager','Assistant Manager','Supervisor','Head Chef','Captain'].map(r=>`<option ${insp.responsibleRole===r?'selected':''}>${r}</option>`).join('')}</select>
        </div>
      </div>
    </div>

    ${checklists.length > 1 ? `
    <div class="card p-2 mb-4 flex overflow-x-auto scroll-hide gap-1" data-scroll-key="inspection-tabs">
      ${checklists.map(cl => {
        const t = calcTabProgress(insp, cl);
        const active = insp.activeTab === cl.id;
        return `<button data-action="switchTab" data-tab="${cl.id}" class="tab-btn ${active?'active':''} flex-1 min-w-max">
          <div class="text-xl mb-1">${cl.icon}</div><div class="text-xs">${cl.name}</div><div class="text-[10px] mt-1" data-tab-count="${cl.id}" style="opacity:0.7">${t.answered}/${t.total}</div>
        </button>`;
      }).join('')}
      <button data-action="switchTab" data-tab="_tables" class="tab-btn ${insp.activeTab==='_tables'?'active':''} flex-1 min-w-max">
        <div class="text-xl mb-1">🪑</div><div class="text-xs">โต๊ะลูกค้า</div><div class="text-[10px] mt-1" style="opacity:0.7">${insp.tables.length} โต๊ะ</div>
      </button>
    </div>` : ''}

    ${insp.activeTab === '_tables' ? renderTableFeedback(insp) : `
    <div class="space-y-3 mb-6">
      ${(activeCl?.items||[]).map((item,idx) => renderInspectionItem(item, insp, idx)).join('')}
    </div>`}

    <div class="card p-4 mb-6">
      <label class="text-sm font-semibold mb-2 block" style="color:#1a1611">📝 หมายเหตุรวม · General Notes</label>
      <textarea rows="3" data-field="general" placeholder="สรุปสิ่งที่พบระหว่างการตรวจ... · Summary of findings...">${insp.generalNote||''}</textarea>
    </div>

    <div class="bottom-bar">
      <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
        <div>
          <div class="text-xs" style="color:#5c5138;font-weight:600">คะแนน · Score</div>
          <div class="text-2xl font-bold" data-bottom-score style="color:${totals.score>=75?'#166534':totals.score>=60?'#8b6820':'#dc2626'}">${totals.score}%</div>
        </div>
        <div class="flex gap-2">
          <button data-action="saveDraft" class="btn-secondary">💾 ${isEditingSaved?'บันทึก':'บันทึกร่าง'}</button>
          <button data-action="finishInspection" class="btn-primary">✓ ${isEditingSaved?'อัปเดต · Update':'ตรวจเสร็จ · Finish'}</button>
        </div>
      </div>
    </div>
  </div>`;
}

// Render Table Feedback section
function renderTableFeedback(insp) {
  return `
  <div class="card p-4 mb-6">
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div>
        <div class="font-semibold" style="color:#1a1611">🪑 ความพึงพอใจตามโต๊ะ · Table Feedback</div>
        <div class="text-xs" style="color:#5c5138">สอบถามความพึงพอใจลูกค้าทีละโต๊ะ · Ask each table's feedback</div>
      </div>
      <button data-action="addTable" class="btn-primary">+ เพิ่มโต๊ะ · Add Table</button>
    </div>

    ${insp.tables.length === 0 ? `
      <div class="text-center py-8" style="color:#5c5138">
        <div class="text-4xl mb-2">🪑</div>
        <div class="text-sm">ยังไม่มีโต๊ะ · No tables yet</div>
        <div class="text-xs mt-1">กด "+ เพิ่มโต๊ะ" เพื่อบันทึกความพึงพอใจของลูกค้าแต่ละโต๊ะ</div>
      </div>
    ` : `
      <div class="grid grid-cols-4 gap-2 mb-4 pb-4" style="border-bottom:1px solid #f2e6c8">
        <div class="text-center"><div class="text-2xl font-bold" style="color:#1a1611">${insp.tables.length}</div><div class="text-xs" style="color:#5c5138">โต๊ะ · Tables</div></div>
        <div class="text-center"><div class="text-2xl font-bold" style="color:#8b6820">${insp.tables.reduce((s,t)=>s+(Number(t.guests)||0),0)}</div><div class="text-xs" style="color:#5c5138">ลูกค้า · Guests</div></div>
        <div class="text-center"><div class="text-2xl font-bold" style="color:#166534">${insp.tables.filter(t=>(t.rating||0)>=4).length}</div><div class="text-xs" style="color:#5c5138">พอใจ · Happy</div></div>
        <div class="text-center"><div class="text-2xl font-bold" style="color:#dc2626">${insp.tables.filter(t=>t.complaint).length}</div><div class="text-xs" style="color:#5c5138">คอมเพลนต์ · Issues</div></div>
      </div>
      <div class="space-y-3">
        ${insp.tables.map((t,i) => renderTableCard(t, i)).join('')}
      </div>
    `}
  </div>`;
}

function renderTableCard(t, idx) {
  const cats = COMPLAINT_CATS.filter(c => c.id !== 'other');
  return `
  <div class="rounded-2xl p-3" style="background:${t.complaint?'#fef2f2':'#faf5e8'};border:1.5px solid ${t.complaint?'#fca5a5':'#ecdcb7'}">
    <div class="flex items-center gap-2 mb-3">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center text-lg font-bold" style="background:${t.complaint?'#fee2e2':'#f2e6c8'};color:${t.complaint?'#a52d33':'#8b6820'}">${idx+1}</div>
      <input data-tfield="number" data-table-id="${t.id}" placeholder="เลข/ชื่อโต๊ะ · Table #" value="${(t.number||'').replace(/"/g,'&quot;')}" class="flex-1" style="padding:6px 10px;font-size:13px;background:white">
      <input type="number" data-tfield="guests" data-table-id="${t.id}" placeholder="ลูกค้า" value="${t.guests||''}" style="width:70px;padding:6px 10px;font-size:13px;background:white" min="1">
      <span class="text-xs" style="color:#5c5138">ท่าน</span>
      <button data-action="delTable" data-table-id="${t.id}" style="background:none;border:0;color:#dc2626;padding:6px;cursor:pointer;font-size:16px">✕</button>
    </div>
    <div class="grid grid-cols-5 gap-1 mb-2">
      ${[1,2,3,4,5].map(n => `<button data-action="setTableRating" data-table-id="${t.id}" data-rating="${n}" class="text-center py-2 rounded-lg text-sm" style="background:${(t.rating||0)>=n?'linear-gradient(135deg,#d4af6c,#8b6820)':'#fff'};color:${(t.rating||0)>=n?'white':'#8b6820'};border:1.5px solid ${(t.rating||0)>=n?'transparent':'#ecdcb7'};font-weight:600;cursor:pointer">${'⭐'.repeat(n>3?1:1)}${n}</button>`).join('')}
    </div>
    <textarea data-tfield="feedback" data-table-id="${t.id}" placeholder="ความเห็นลูกค้า · Guest feedback (เช่น: อาหารอร่อย บริการดี · หรือ อาหารไม่สด รอนาน)" rows="2" style="padding:8px 10px;font-size:13px;background:white;margin-bottom:8px">${(t.feedback||'').replace(/"/g,'&quot;')}</textarea>
    <div class="flex items-center gap-2 flex-wrap">
      <label class="flex items-center gap-1.5 text-xs cursor-pointer" style="color:${t.complaint?'#a52d33':'#5c5138'};font-weight:600">
        <input type="checkbox" data-tfield="complaint" data-table-id="${t.id}" ${t.complaint?'checked':''} style="width:auto;padding:0;margin:0">
        📢 มีคอมเพลนต์ · Complaint
      </label>
      ${t.complaint ? `
        <select data-tfield="complaintCat" data-table-id="${t.id}" style="flex:1;padding:4px 8px;font-size:12px;width:auto;min-width:120px">
          <option value="">-- เลือกหมวดปัญหา --</option>
          ${cats.map(c => `<option value="${c.id}" ${t.complaintCat===c.id?'selected':''}>${c.icon} ${c.name}</option>`).join('')}
        </select>
      ` : ''}
    </div>

    ${t.complaint ? `
      <!-- Inline resolution — บันทึกวิธีแก้ปัญหาที่นี่เลย -->
      <div class="mt-3 pt-3 rounded-xl p-3" style="background:${t.resolved?'#dcfce7':'#fef3c7'};border:1.5px dashed ${t.resolved?'#86efac':'#fde68a'}">
        <div class="flex items-center justify-between gap-2 mb-2">
          <div class="text-xs font-bold" style="color:${t.resolved?'#166534':'#92400e'}">
            ${t.resolved ? '✅ แก้ไขแล้ว · Resolved' : '🔧 บันทึกวิธีแก้ไข · Log Resolution'}
          </div>
          <label class="flex items-center gap-1 text-xs cursor-pointer" style="color:${t.resolved?'#166534':'#92400e'};font-weight:600">
            <input type="checkbox" data-tfield="resolved" data-table-id="${t.id}" ${t.resolved?'checked':''} style="width:auto;padding:0;margin:0">
            แก้ไขแล้ว
          </label>
        </div>
        <textarea data-tfield="resolutionNote" data-table-id="${t.id}" placeholder="🔧 วิธีแก้ไข · How was it fixed? (เช่น: เชิญไปที่โต๊ะ แจ้งครัวเปลี่ยนจานใหม่ให้ทันที)" rows="2" style="padding:6px 10px;font-size:12px;background:white;margin-bottom:6px">${(t.resolutionNote||'').replace(/"/g,'&quot;')}</textarea>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <div>
            <div class="text-xs mb-1" style="color:#5c5138;font-weight:600">😊 ลูกค้าพอใจหลังแก้</div>
            <div class="flex gap-0.5">
              ${[1,2,3,4,5].map(n => `<button data-action="setTableCustSat" data-table-id="${t.id}" data-sat="${n}" style="flex:1;padding:4px 0;border-radius:6px;background:${(t.customerSat||0)>=n?'linear-gradient(135deg,#fbbf24,#d97706)':'#fff'};color:${(t.customerSat||0)>=n?'white':'#8b6820'};border:1px solid ${(t.customerSat||0)>=n?'transparent':'#ecdcb7'};font-size:11px;cursor:pointer;font-weight:600">${n}⭐</button>`).join('')}
            </div>
          </div>
          <div>
            <div class="text-xs mb-1" style="color:#5c5138;font-weight:600">👤 คนแก้ปัญหา</div>
            <input data-tfield="resolvedBy" data-table-id="${t.id}" placeholder="ชื่อพนักงาน" value="${(t.resolvedBy||'').replace(/"/g,'&quot;')}" style="padding:5px 10px;font-size:12px;background:white">
          </div>
        </div>
        <textarea data-tfield="lessonLearned" data-table-id="${t.id}" placeholder="💡 บทเรียน · Lesson (ทีมได้เรียนรู้อะไร? เพื่อป้องกันซ้ำ)" rows="2" style="padding:6px 10px;font-size:12px;background:white">${(t.lessonLearned||'').replace(/"/g,'&quot;')}</textarea>
      </div>
    ` : ''}
  </div>`;
}

function renderInspectionItem(item, insp, idx) {
  const val = insp.items[item.id] || { status: null, note: '', photos: [] };
  const pendingHere = pendingPhotosFor(insp.id, item.id, 'manager');
  if (!val.photos) val.photos = [];
  const s = val.status;
  const badgeBg = s==='pass'?'#dcfce7':s==='warn'?'#ffedd5':s==='fail'?'#fee2e2':'#f5f5f4';
  const badgeColor = s==='pass'?'#166534':s==='warn'?'#8b6820':s==='fail'?'#a52d33':'#5c5138';
  return `
  <div class="card p-4" data-item-anchor="${item.id}">
    <div class="flex items-start gap-3 mb-3">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0" data-num-badge="${item.id}" style="background:${badgeBg};color:${badgeColor};transition:background 0.2s,color 0.2s">${idx+1}</div>
      <div class="text-sm flex-1 pt-1" style="color:#1a1611;font-weight:500">${item.text}</div>
    </div>
    <div class="status-buttons mb-3">
      <button data-action="setStatus" data-item-id="${item.id}" data-status="pass" class="status-btn ${s==='pass'?'active-pass':''}"><span class="icon">✓</span> ผ่าน · Pass</button>
      <button data-action="setStatus" data-item-id="${item.id}" data-status="warn" class="status-btn ${s==='warn'?'active-warn':''}"><span class="icon">⚠</span> เตือน · Warn</button>
      <button data-action="setStatus" data-item-id="${item.id}" data-status="fail" class="status-btn ${s==='fail'?'active-fail':''}"><span class="icon">✕</span> ไม่ผ่าน · Fail</button>
    </div>
    <div class="flex gap-2 flex-wrap items-center" style="border-top:1px dashed #f2e6c8;padding-top:10px">
      <input type="text" data-field="item-note" data-item-id="${item.id}" placeholder="หมายเหตุ · Note (optional)..." value="${(val.note||'').replace(/"/g,'&quot;')}" class="flex-1" style="min-width:100px;padding:8px 12px;font-size:13px">
      <label class="btn-secondary cursor-pointer whitespace-nowrap flex items-center gap-1" style="padding:8px 12px;font-size:13px">
        🖼️ คลัง · Gallery
        <input type="file" accept="image/*" multiple data-photo-input data-item-id="${item.id}" style="display:none">
      </label>
      <label class="btn-secondary cursor-pointer whitespace-nowrap flex items-center gap-1" style="padding:8px 12px;font-size:13px">
        📷 กล้อง · Camera
        <input type="file" accept="image/*" capture="environment" data-photo-input data-item-id="${item.id}" style="display:none">

function updateInspectionUI() {

// เช็คว่าหมวดปัจจุบันตรวจครบไหม → สลับ tab อัตโนมัติ (แต่ไม่บังคับสลับทันที)
function checkTabComplete() {
  const insp = VIEW_STATE.inspection;
  if (!insp) return;
  const cls = getInspectionChecklist(insp);
  const currentCat = cls.find(c => c.id === insp.activeTab);
  if (!currentCat) return;
  const allDone = currentCat.items.every(it => insp.items[it.id]?.status);
  if (!allDone) return;
  // หมวดปัจจุบันครบแล้ว - หาหมวดถัดไปที่ยังมีข้อค้าง
  const currentTabIdx = cls.findIndex(c => c.id === insp.activeTab);
  let nextCat = null;
  for (let i = currentTabIdx + 1; i < cls.length; i++) {
    if (cls[i].items.some(it => !insp.items[it.id]?.status)) { nextCat = cls[i]; break; }
  }
  if (!nextCat) {
    for (let i = 0; i < currentTabIdx; i++) {
      if (cls[i].items.some(it => !insp.items[it.id]?.status)) { nextCat = cls[i]; break; }
    }
  }
  if (nextCat) {
    toast(`✓ ${currentCat.icon} ${currentCat.name} ครบแล้ว → กำลังไป ${nextCat.icon} ${nextCat.name}`, 'success');
    setTimeout(() => {
      insp.activeTab = nextCat.id;
      _forceScrollTop = true;
      render();
    }, 1200);
  } else {
    // ตรวจครบทุกหัวข้อ
    toast('🎉 ตรวจครบทุกข้อแล้ว! กดปุ่ม "ตรวจเสร็จ" ด้านล่าง', 'success');
    setTimeout(() => window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'}), 600);
  }
}

async function attachPhoto(ev, itemId) {

      const count = previewBox.querySelector('.text-xs');

    }
  }
  const inspId = VIEW_STATE.inspection.id;
